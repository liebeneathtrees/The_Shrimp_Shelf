    '<div class="highlight-box blue reveal" style="margin-top:1.5rem"><strong>Still stuck?</strong> The shrimp hobby has a generous and knowledgeable community. The r/shrimptank subreddit and Shrimpspot forums are excellent places to post photos and get specific advice. When asking for help, always include your full water parameters (GH, KH, pH, TDS, ammonia, nitrite, nitrate, temperature) and a description of your setup - it saves everyone time and gets you to an answer faster.</div>' +
  '</div>';
}

// ── GLOSSARY ──────────────────────────────────────────
function renderGlossary() {
  var terms = [
    { term: 'Ammonia (NH3/NH4+)', def: 'Toxic waste product produced by shrimp, decomposing food, and plant matter. Should read 0 ppm in any established tank. Even 0.25 ppm is stressful; 1 ppm can be lethal.' },
    { term: 'Berried', def: 'A female shrimp carrying fertilized eggs under her tail, which she fans constantly with her swimmerets. Named for the egg cluster\'s resemblance to a bunch of berries.' },
    { term: 'Biofilm', def: 'A thin layer of bacteria, microalgae, fungi, and organic matter that colonizes every surface in an established tank. The primary natural diet of dwarf shrimp - far more nutritious than most commercial foods.' },
    { term: 'Buffering capacity', def: 'The ability of water to resist pH change, determined by KH (carbonate hardness). High KH = stable pH; low KH = pH can swing rapidly with CO2 changes or acid inputs.' },
    { term: 'Caridina', def: 'A genus of dwarf shrimp that includes Crystal Red, Crystal Black, Bee, and Tiger shrimp. Generally requires softer, lower pH water than Neocaridina and is more sensitive to parameter swings. Not covered in detail in this guide.' },
    { term: 'Colony', def: 'An established, breeding population of shrimp in a tank. A healthy colony self-sustains with births outnumbering deaths.' },
    { term: 'Copper (Cu)', def: 'A heavy metal that is toxic to shrimp at very low concentrations - levels harmless to fish can kill shrimp within hours. Common sources: medications, cheap fertilizers, old plumbing.' },
    { term: 'Culling', def: 'Selectively removing shrimp from the colony - usually those with undesirable color, pattern, or size - to maintain or improve the quality of future generations.' },
    { term: 'Cycling', def: 'The process of establishing a colony of beneficial nitrogen-cycle bacteria (Nitrosomonas and Nitrobacter) in a new tank before adding shrimp. Takes 4–6 weeks fishless, or 1–2 weeks with a seeded filter.' },
    { term: 'dGH / dKH', def: 'Degrees of General Hardness and Carbonate Hardness - the unit used to measure GH and KH in the hobby. 1 dGH/dKH ≈ 17.9 ppm.' },
    { term: 'Drip acclimation', def: 'A slow method of introducing shrimp to new water by dripping new water into the transport bag or a small container over 30–60 minutes. Reduces parameter shock.' },
    { term: 'GH (General Hardness)', def: 'A measure of dissolved calcium and magnesium in water. Critical for shell formation and successful molting. Neocaridina prefer 7–15 dGH. Too low GH = failed molts and WROD.' },
    { term: 'Grade', def: 'A quality descriptor for color density and coverage in selectively bred shrimp. Higher grades have more opaque, consistent color. Examples: Sakura (entry) → Fire Red → Painted Fire Red for cherry shrimp.' },
    { term: 'IAL (Indian Almond Leaf)', def: 'Dried leaves of Terminalia catappa, commonly used in shrimp tanks. Release tannins that lower pH slightly, have mild antibacterial properties, and provide an excellent biofilm grazing surface.' },
    { term: 'Inert substrate', def: 'A substrate that does not affect water chemistry - plain gravel, sand, or lava rock. Preferred for Neocaridina tanks where stable, neutral-to-alkaline parameters are needed.' },
    { term: 'Inter-molt', def: 'The period between molts when a shrimp\'s shell is fully hardened and it is actively feeding, growing, and behaving normally.' },
    { term: 'KH (Carbonate Hardness)', def: 'A measure of dissolved carbonates and bicarbonates in water. Acts as a pH buffer - higher KH means more stable pH. Neocaridina prefer 2–8 dKH.' },
    { term: 'Mating swarm', def: 'The frantic swimming behavior of male shrimp immediately after a female molts and releases pheromones. Males swim rapidly in all directions searching for the female. Normal and expected behavior.' },
    { term: 'Meiofauna', def: 'Microscopic organisms (copepods, nematodes, rotifers, ostracods) that live in the substrate and water column. Contribute to biofilm complexity and provide supplemental food for shrimplets.' },
    { term: 'Neocaridina', def: 'A genus of dwarf freshwater shrimp originating from eastern Asia. All common color forms (cherry, blue dream, snowball, etc.) are the same species, Neocaridina davidi. Hardy, beginner-friendly, and widely kept.' },
    { term: 'Nitrate (NO3)', def: 'The end product of the nitrogen cycle. Less toxic than ammonia or nitrite but stressful at high levels. Keep below 20 ppm in a shrimp tank; ideally below 10. Reduced by water changes and plant uptake.' },
    { term: 'Nitrite (NO2)', def: 'An intermediate product of the nitrogen cycle, produced by Nitrosomonas bacteria breaking down ammonia. Highly toxic - should read 0 ppm in an established tank.' },
    { term: 'Nitrogen cycle', def: 'The biological process by which ammonia (from waste) is converted to nitrite by Nitrosomonas bacteria, then to nitrate by Nitrobacter bacteria. A cycled tank maintains 0 ammonia and 0 nitrite continuously.' },
    { term: 'Parameters', def: 'Shorthand for water chemistry values - pH, GH, KH, TDS, ammonia, nitrite, nitrate, and temperature. Testing parameters is the first step in diagnosing any shrimp problem.' },
    { term: 'pH', def: 'A measure of water acidity or alkalinity on a scale of 0–14. 7.0 is neutral. Neocaridina prefer 6.8–7.8. pH is influenced by KH, CO2, and certain substrates.' },
    { term: 'Planaria', def: 'Flat, triangular-headed white worms that can appear in shrimp tanks. Harmless to adult shrimp but can attack eggs and newly molted individuals. Treated with Planaria Zero.' },
    { term: 'Pre-molt', def: 'The period before a molt when a shrimp stops eating, may appear pale or dull, and begins reabsorbing calcium from its old shell. Can last days to a week.' },
    { term: 'Remineralizer', def: 'A product added to RO or distilled water to restore GH and KH. Salty Shrimp GH+ is the most widely used for Neocaridina. Allows precise control of water hardness.' },
    { term: 'RO water', def: 'Reverse Osmosis water - water purified by forcing it through a semipermeable membrane, removing nearly all dissolved minerals. Used by experienced keepers who want precise control of water chemistry by remineralizing from zero.' },
    { term: 'Saddle', def: 'A yellowish patch visible behind the head of a mature female shrimp, under the dorsal shell. Unfertilized eggs waiting in the ovaries. When the female molts and is fertilized, the saddle becomes a clutch of eggs carried under the tail.' },
    { term: 'Shrimplet', def: 'A newly hatched or juvenile shrimp. Neocaridina shrimplets are born as fully formed miniature shrimp (1–2mm) with no larval stage in freshwater.' },
    { term: 'Sponge filter', def: 'A simple filter that draws water through a sponge using an air pump and uplift tube. Provides biological filtration with gentle flow and zero risk of sucking up shrimplets - the standard for shrimp tanks.' },
    { term: 'TDS (Total Dissolved Solids)', def: 'A measure of all dissolved substances in water, in parts per million (ppm). Neocaridina prefer 150–250 ppm. TDS rises with mineral content and falls with RO or rain water addition. Measured with an inexpensive pen meter.' },
    { term: 'Tannins', def: 'Natural polyphenol compounds released by botanicals, driftwood, and leaves. They stain water a tea color, lower pH slightly, and have mild antibacterial properties. Beneficial in shrimp tanks; loved by shrimp.' },
    { term: 'Vorticella', def: 'A stalked ciliate protozoan that attaches to shrimp shells, appearing as white fuzzy tufts. Opportunistic in high-waste tanks. Treated with salt or hydrogen peroxide dips; not directly fatal but stressful.' },
    { term: 'WROD (White Ring of Death)', def: 'A failed molt where the new shell hardens in the wrong position, trapping the shrimp at the junction of head and body. Visible as a white ring around the shrimp\'s midsection. Almost always fatal. Primary cause: low GH.' }
  ];

  var glossHtml = terms.map(function(t) {
    return '<div class="info-card" style="margin:0.5rem 0;padding:0.85rem 1.1rem">' +
      '<div class="info-card-title">' + t.term + '</div>' +
      '<div class="info-card-body">' + t.def + '</div>' +
    '</div>';
  }).join('');

  return '<div class="page-body">' +
    '<p class="prose reveal">Every abbreviation, piece of jargon, and technical term you\'ll encounter in the shrimp hobby - defined plainly.</p>' +
    '<div class="reveal">' + glossHtml + '</div>' +
  '</div>';
}

// ── WATER PARAMETERS ──────────────────────────────────
function renderParameters() {

  // Dual-range bar: shows acceptable zone (muted) + ideal zone (vivid) overlaid
  // All positions as % of the display scale (scaleMin to scaleMax)
  function paramBar(cfg) {
    var span   = cfg.scaleMax - cfg.scaleMin;
    var accL   = ((cfg.accMin  - cfg.scaleMin) / span * 100).toFixed(2);
    var accW   = ((cfg.accMax  - cfg.accMin)   / span * 100).toFixed(2);
    var ideL   = ((cfg.ideMin  - cfg.scaleMin) / span * 100).toFixed(2);
    var ideW   = ((cfg.ideMax  - cfg.ideMin)   / span * 100).toFixed(2);
    var labelL = cfg.scaleMin + (cfg.scaleMax - cfg.scaleMin) * 0.01;
    var labelR = cfg.scaleMax;

    return '<div class="param-row reveal">' +
      '<div class="param-header">' +
        '<span class="param-label">' + cfg.label + '</span>' +
        '<span class="param-badges">' +
          '<span class="param-badge param-badge-ideal">Ideal: ' + cfg.ideMin + '–' + cfg.ideMax + ' ' + cfg.unit + '</span>' +
          '<span class="param-badge param-badge-acc">OK: ' + cfg.accMin + '–' + cfg.accMax + ' ' + cfg.unit + '</span>' +
        '</span>' +
      '</div>' +
      '<div class="param-track">' +
        '<div class="param-zone-acc"  style="left:' + accL + '%;width:' + accW + '%"></div>' +
        '<div class="param-zone-ideal" style="left:' + ideL + '%;width:' + ideW + '%"></div>' +
        '<span class="param-tick-label param-tick-l">' + cfg.scaleMin + '</span>' +
        '<span class="param-tick-label param-tick-r">' + cfg.scaleMax + '</span>' +
      '</div>' +
      '<div class="param-note">' + cfg.note + '</div>' +
    '</div>';
  }

  var legend = '<div class="param-legend reveal">' +
    '<span class="legend-swatch legend-ideal"></span><span class="legend-text">Ideal range</span>' +
    '<span class="legend-swatch legend-acc"></span><span class="legend-text">Acceptable range</span>' +
  '</div>';

  var bars = '<div class="params-wrap reveal">' +
    paramBar({ label:'pH', unit:'', scaleMin:5.5, scaleMax:9.0,
      accMin:6.5, accMax:8.0, ideMin:7.0, ideMax:7.6,
      note:'Prefers slightly alkaline, stable water. Avoid swift fluctuations - even within the acceptable range, rapid swings cause more harm than a steady value at the edge.' }) +
    paramBar({ label:'GH: General Hardness', unit:'dGH', scaleMin:0, scaleMax:16,
      accMin:4, accMax:12, ideMin:6, ideMax:8,
      note:'Calcium and magnesium for shell-building. Below 4 dGH risks the White Ring of Death. Above 12 can harden shells excessively, making them difficult to split at molt.' }) +
    paramBar({ label:'KH: Carbonate Hardness', unit:'dKH', scaleMin:0, scaleMax:12,
      accMin:1, accMax:8, ideMin:2, ideMax:5,
      note:'Acts as a pH buffer. Below 1 dKH means pH can crash overnight. Above 8 dKH can suppress molting in sensitive lines.' }) +
    paramBar({ label:'TDS: Total Dissolved Solids', unit:'ppm', scaleMin:50, scaleMax:400,
      accMin:150, accMax:300, ideMin:200, ideMax:250,
      note:'Reflects overall mineral density. Below 150 ppm risks osmotic shock and WROD. Above 350 ppm suggests waste buildup or overly hard tap water.' }) +
    paramBar({ label:'Temperature', unit:'°F', scaleMin:60, scaleMax:85,
      accMin:65, accMax:78, ideMin:68, ideMax:74,
      note:'Cooler water extends lifespan and reduces metabolic stress; warmer water speeds breeding and the life cycle. Above 80°F causes dangerous oxygen depletion.' }) +
    paramBar({ label:'Nitrate (NO₃)', unit:'ppm', scaleMin:0, scaleMax:40,
      accMin:0, accMax:20, ideMin:0, ideMax:10,
      note:'Shrimp are far more sensitive to nitrate than most tropical fish. Above 20 ppm weakens immune systems and causes failed molts over time. Manage with water changes and fast-growing plants.' }) +
  '</div>';

  var zeroParams =
    '<div class="zero-params-grid reveal">' +
      '<div class="zero-param-card">' +
        '<div class="zero-param-icon">&#9888;&#65039;</div>' +
        '<div class="zero-param-name">Ammonia (NH&#8323;/NH&#8324;&#8314;)</div>' +
        '<div class="zero-param-value">0 ppm - always</div>' +
        '<div class="zero-param-note">Highly toxic. Even 0.25 ppm causes stress; 1 ppm can kill within hours. Any reading above zero means the tank is not fully cycled or has crashed.</div>' +
      '</div>' +
      '<div class="zero-param-card">' +
        '<div class="zero-param-icon">&#9888;&#65039;</div>' +
        '<div class="zero-param-name">Nitrite (NO&#8322;&#8315;)</div>' +
        '<div class="zero-param-value">0 ppm - always</div>' +
        '<div class="zero-param-note">Blocks oxygen transport in shrimp hemolymph. Equally toxic to ammonia. A cycled, established tank should permanently read zero for both.</div>' +
      '</div>' +
    '</div>';

  return '<div class="page-body">' +

    '<div class="highlight-box water reveal">Water chemistry is the foundation of shrimp keeping. Get this right and most other problems solve themselves. The ranges below apply to Neocaridina - Ghost Shrimp tolerate similar values; Bamboo Shrimp prefer the softer end of these ranges.</div>' +

    '<h2 class="section-heading reveal">Visual Parameter Ranges</h2>' +
    '<p class="prose reveal">Each bar shows two zones: the <strong>acceptable range</strong> (light blue - shrimp can survive here) and the <strong>ideal range</strong> (vivid blue - where shrimp thrive, breed consistently, and molt safely). Stability within your chosen range matters more than hitting a precise number.</p>' +

    legend + bars +

    '<h2 class="section-heading reveal">Zero-tolerance parameters</h2>' +
    '<p class="prose reveal">These two have no acceptable non-zero value. Both should read 0 ppm permanently in any established tank.</p>' +
    zeroParams +

    '<h2 class="section-heading reveal">Three key takeaways</h2>' +
    '<div class="highlight-box blue reveal"><strong>Zero tolerance for nitrogen waste.</strong> In an established tank, ammonia and nitrite must be 0 ppm. Nitrate below 10 ppm is optimal - levels above 20 ppm weaken immune systems and cause failed molts over time, even when other parameters look fine.</div>' +
    '<div class="highlight-box gold reveal"><strong>TDS and GH protect molting.</strong> Low TDS (below 150 ppm) or low GH (below 4 dGH) leads to the White Ring of Death - the shrimp cannot break free from its old exoskeleton because the new shell is too soft. High TDS (above 350 ppm) can make shells too hard to split. Both extremes kill at molting time.</div>' +
    '<div class="highlight-box moss reveal"><strong>Stability beats perfection.</strong> Neocaridina adapt remarkably well to values slightly outside the ideal zone as long as parameters stay consistent. Rapid shifts in water chemistry cause far more stress than being steadily at the edge of acceptable. Test regularly, change water gradually, and avoid sudden additions.</div>' +

    '<h2 class="section-heading reveal">Parameter deep-dives</h2>' +

    '<div class="info-card reveal"><div class="info-card-title">pH - what it means and what moves it</div><div class="info-card-body">pH measures hydrogen ion concentration on a logarithmic scale - each full point is a 10× change. In a shrimp tank, pH is primarily controlled by KH (buffering) and CO2. Higher CO2 lowers pH; lower CO2 raises it. Active substrates like ADA Amazonia release acids that push pH down significantly over time - avoid for Neocaridina. The most stable pH comes from maintaining consistent KH and making water changes slowly.</div></div>' +

    '<div class="info-card reveal"><div class="info-card-title">GH: why it matters more than most keepers realize</div><div class="info-card-body">GH measures dissolved calcium and magnesium - the minerals shrimp use to build and repair their exoskeleton at every molt. Low GH is the most common preventable cause of WROD. Many tap water supplies have adequate GH; others (soft-water regions, municipal softening, or RO filtration) have very low GH. Test your tap water directly. If GH is below 4, supplement with Salty Shrimp GH+ at water changes to reach 6–8 dGH.</div></div>' +

    '<div class="info-card reveal"><div class="info-card-title">KH: the buffer that protects pH stability</div><div class="info-card-body">KH absorbs acid inputs (CO2, decomposition, tannins) before they can shift pH. A tank with KH below 1 dKH can swing from pH 7.5 to 6.0 overnight; a tank with KH of 3+ holds steady through most inputs. Aim for 2–5 dKH for Neocaridina. The relationship is simple: KH keeps pH stable; GH keeps shrimp shells strong. Both matter independently.</div></div>' +

    '<div class="info-card reveal"><div class="info-card-title">TDS: a useful flag, not a precise target</div><div class="info-card-body">TDS measures everything dissolved in water as a single number. It is a useful quick-check: rising TDS between water changes suggests accumulating waste; a sudden drop may indicate a parameter shift. The ideal 200–250 ppm zone reflects the mineral density Neocaridina evolved in. A TDS pen meter costs around $10 and gives you a daily reading without test tubes - well worth having.</div></div>' +

    '<div class="info-card reveal"><div class="info-card-title">Temperature: lifespan vs breeding rate trade-off</div><div class="info-card-body">Cooler water (68–70°F) slows metabolism, extends lifespan, and produces shrimp that often show more intense color. Warmer water (72–76°F) speeds up the breeding cycle and increases activity - useful for building a colony faster. Above 78°F, oxygen solubility drops and shrimp begin to show heat stress. Above 82°F, mass deaths become likely. In summer, monitor tank temperature and consider a small fan aimed at the water surface to keep temperatures down.</div></div>' +

    '<h2 class="section-heading reveal">What goes wrong when parameters drift</h2>' +
    '<table class="data-table reveal"><thead><tr><th>Symptom</th><th>Most likely parameter issue</th></tr></thead><tbody>' +
      '<tr><td>Failed molts / WROD</td><td>GH below 4 dGH, or TDS below 150 ppm</td></tr>' +
      '<tr><td>Shells too hard to split</td><td>TDS above 350 ppm or GH above 12 dGH</td></tr>' +
      '<tr><td>pH swings day to night</td><td>KH below 1–2 dKH</td></tr>' +
      '<tr><td>Shrimp dying after water change</td><td>Temperature shock, or new water GH/KH very different from tank</td></tr>' +
      '<tr><td>Breeding stops</td><td>Temperature below 65°F, GH below 4, nitrate above 20 ppm</td></tr>' +
      '<tr><td>Lethargy / not eating</td><td>Ammonia or nitrite detectable, or pre-molt (normal)</td></tr>' +
      '<tr><td>Erratic swimming / spinning</td><td>Ammonia spike, copper contamination, or acute pH crash</td></tr>' +
      '<tr><td>Color fading gradually</td><td>Chronic nitrate above 20 ppm, or stress from unstable parameters</td></tr>' +
    '</tbody></table>' +

    '<h2 class="section-heading reveal">Testing kit recommendations</h2>' +
    '<div class="highlight-box moss reveal"><strong>Minimum kit:</strong> API Freshwater Master Test Kit (ammonia, nitrite, nitrate, pH) + a GH/KH drop test kit (API or Salifert) + a TDS pen meter. The pen is inexpensive (~$10) and gives a daily quick-check in seconds. Test full parameters weekly while the tank is new; monthly once stable. Always test before and after changing anything significant.</div>' +

  '</div>';
}

// ── TANK EVALUATOR (merged tools + evaluator) ─────────
function renderEvaluator() {

function evParamInput(id, label, def, unit, accLo, accHi, ideLo, ideHi, isZero) {
  return '<div class="ev-param-row">' +
    '<div class="ev-param-label">' + label + (unit ? ' <span style="color:var(--mid-text);font-weight:400">(' + unit + ')</span>' : '') + '</div>' +
    '<div style="display:flex;align-items:center;gap:0.6rem">' +
      '<input class="tool-input ev-param-input" id="' + id + '" type="number" value="' + def + '" step="' + (id === 'ev-ph' ? '0.1' : '1') + '"' +
        ' data-acc-lo="' + accLo + '" data-acc-hi="' + accHi + '" data-ide-lo="' + ideLo + '" data-ide-hi="' + ideHi + '" data-zero="' + (isZero ? 'true' : 'false') + '"' +
        ' oninput="evParamFeedback(this)">' +
      '<span class="tool-unit">' + unit + '</span>' +
      '<span class="ev-param-status" id="' + id + '-status"></span>' +
    '</div>' +
  '</div>';
}

var evHistorySessions = [];

function evParamFeedback(input) {
  var val    = parseFloat(input.value);
  var accLo  = parseFloat(input.dataset.accLo);
  var accHi  = parseFloat(input.dataset.accHi);
  var ideLo  = parseFloat(input.dataset.ideLo);
  var ideHi  = parseFloat(input.dataset.ideHi);
  var isZero = input.dataset.zero === 'true';
  var status = document.getElementById(input.id + '-status');
  if (!status) return;
  if (isNaN(val)) { status.textContent = ''; return; }
  if (isZero) {
    status.className = 'ev-param-status ' + (val === 0 ? 'ev-ok' : 'ev-bad');
    status.textContent = val === 0 ? '\u2713 Zero' : '\u26a0 Must be 0';
  } else if (val >= ideLo && val <= ideHi) {
    status.className = 'ev-param-status ev-ideal';
    status.textContent = '\u2605 Ideal';
  } else if (val >= accLo && val <= accHi) {
    status.className = 'ev-param-status ev-ok';
    status.textContent = '\u2713 OK';
  } else {
    status.className = 'ev-param-status ev-bad';
    status.textContent = val < accLo ? '\u25bc Low' : '\u25b2 High';
  }
  if (input.id === 'ev-gh') { var t = document.getElementById('ev-tds-gh'); if (t) { t.value = val; evTdsCalc(); } }
  if (input.id === 'ev-kh') { var t2 = document.getElementById('ev-tds-kh'); if (t2) { t2.value = val; evTdsCalc(); } }
}

function evVolCalc() {
  var l = parseFloat(document.getElementById('ev-l').value) || 0;
  var w = parseFloat(document.getElementById('ev-w').value) || 0;
  var h = parseFloat(document.getElementById('ev-h').value) || 0;
  var shape = document.getElementById('ev-shape').value;
  var cu_in = shape === 'bow' ? l*w*h*0.92 : shape === 'hex' ? (Math.sqrt(3)/2)*w*w*h : l*w*h;
  var gal = cu_in / 231;
  var net = gal * 0.9;
  var el = document.getElementById('ev-vol-result');
  if (el) el.textContent = gal > 0 ? gal.toFixed(1) + ' gal gross  |  ~' + net.toFixed(1) + ' gal usable' : '--';
  var remVol = document.getElementById('ev-rem-vol');
  if (remVol && gal > 0) { remVol.value = (gal * 0.2).toFixed(1); evRemCalc(); }
}

function evPhotoCalc() {
  var hrs  = parseFloat(document.getElementById('ev-light').value) || 0;
  var type = document.getElementById('ev-light-type').value;
  var el   = document.getElementById('ev-photo-result');
  if (!el) return;
  var ideal = { shrimp_low:[6,8], shrimp_planted:[7,9], shrimp_moss:[6,8], shrimp_high:[8,10] };
  var range = ideal[type] || [7,9];
  var algRisk = hrs > range[1] + 2 ? 'High' : hrs > range[1] ? 'Moderate' : 'Low';
  var algCol  = algRisk === 'High' ? '#c0392b' : algRisk === 'Moderate' ? '#c9a84c' : '#4a8a6a';
  var tipMap = {
    shrimp_low:     'Low-light shrimp tanks need 6-8 hrs. Longer periods encourage algae without benefiting shrimp.',
    shrimp_planted: 'Planted shrimp tanks do well at 7-9 hrs. A midday siesta schedule helps suppress algae.',
    shrimp_moss:    'Moss tanks thrive at 6-8 hrs. Moss tolerates low light and provides excellent biofilm at any intensity.',
    shrimp_high:    'High-light tanks need 8-10 hrs but benefit greatly from a siesta: 3 hrs on, 3 hrs off, 4 hrs on.'
  };
  var msg = hrs < range[0] ? 'Under-lit for this setup. Increase to ' + range[0] + '-' + range[1] + ' hrs for healthy plant and biofilm growth.'
    : hrs > range[1] ? 'Over-lit - algae risk increases significantly above ' + range[1] + ' hrs. Consider a timer if you do not already use one.'
    : 'Good photoperiod for this tank type.';
  var icon = hrs >= range[0] && hrs <= range[1] ? '\u2713' : '\u26a0';
  el.innerHTML = '<div class="tool-note" style="background:var(--white);border:1px solid var(--border);border-radius:8px;padding:0.7rem 1rem;margin-top:0">' +
    '<div style="margin-bottom:0.3rem;font-weight:500">' + icon + ' ' + msg + '</div>' +
    '<div style="margin-bottom:0.3rem">' + tipMap[type] + '</div>' +
    '<div>Algae risk at ' + hrs + ' hrs: <strong style="color:' + algCol + '">' + algRisk + '</strong></div>' +
  '</div>';
}

function evRemCalc() {
  var vol    = parseFloat(document.getElementById('ev-rem-vol').value) || 0;
  var start  = parseFloat(document.getElementById('ev-rem-start').value) || 0;
  var target = parseFloat(document.getElementById('ev-rem-target').value) || 0;
  var rate   = parseFloat(document.getElementById('ev-rem-rate').value) || 1;
  var volL   = vol * 3.785;
  var delta  = Math.max(0, target - start);
  var qtsp   = (delta / rate) * (volL / 10);
  var grams  = qtsp * 1.4;
  var tsp    = qtsp / 4;
  var el     = document.getElementById('ev-rem-result');
  if (el) el.textContent = delta <= 0 ? 'Target GH already met' :
    grams.toFixed(1) + ' g  |  ' + tsp.toFixed(2) + ' tsp  |  ' + qtsp.toFixed(1) + ' x 1/4 tsp';
}

function evTdsCalc() {
  var gh  = parseFloat(document.getElementById('ev-tds-gh').value) || 0;
  var kh  = parseFloat(document.getElementById('ev-tds-kh').value) || 0;
  var est = (gh + kh) * 17.9;
  var el  = document.getElementById('ev-tds-result');
  if (el) el.textContent = '~' + Math.round(est) + ' ppm (mineral baseline)';
  var measured = parseFloat(document.getElementById('ev-tds').value);
  var cmp = document.getElementById('ev-tds-compare');
  if (cmp && !isNaN(measured) && measured > 0 && est > 0) {
    var diff = measured - est;
    var pct  = Math.round(diff / est * 100);
    var msg  = diff <= 10 ? '\u2713 Measured TDS closely matches mineral estimate - low organic load.'
      : diff <= 50 ? '\u26a0 Measured TDS is ~' + Math.round(diff) + ' ppm above mineral estimate. Some organic contribution.'
      : '\u26a0 Measured TDS is ' + Math.round(diff) + ' ppm (' + pct + '%) above mineral baseline. Consider a water change.';
    var col = diff <= 10 ? '#4a8a6a' : diff <= 50 ? '#c9a84c' : '#c0392b';
    cmp.innerHTML = '<div class="tool-note" style="color:' + col + ';font-weight:500">' + msg + '</div>';
  }
}

function evMateNone(cb) {
  if (cb.checked) {
    ['ev-mate-nano','ev-mate-risky','ev-mate-pred','ev-mate-snails'].forEach(function(id) {
      var el = document.getElementById(id); if (el) el.checked = false;
    });
  }
}

function evGatherSetup() {
  var getVal = function(id) { var el = document.getElementById(id); return el ? el.value : ''; };
  var getNum = function(id) { var el = document.getElementById(id); return el ? parseFloat(el.value) : NaN; };
  var getCb  = function(id) { var el = document.getElementById(id); return el ? el.checked : false; };
  var l = getNum('ev-l'), w = getNum('ev-w'), h = getNum('ev-h');
  var shape = getVal('ev-shape');
  var cu_in = shape === 'bow' ? l*w*h*0.92 : shape === 'hex' ? (Math.sqrt(3)/2)*w*w*h : l*w*h;
  var gal = cu_in / 231;

  // Local datetime (not UTC) - used for sorting and filenames
  var now = new Date();
  var pad = function(n) { return String(n).padStart(2,'0'); };
  var localDate = now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate());
  var localTime = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
  var localDatetime = localDate + 'T' + localTime;
  var fileTimePart = pad(now.getHours()) + pad(now.getMinutes());
  return {
    date: localDate,
    datetime: localDatetime,
    fileTimePart: fileTimePart,
    label: (document.getElementById('ev-name').value.trim() || 'My Shrimp Tank'),
    volume: parseFloat(gal.toFixed(2)),
    maturity: getVal('ev-maturity'),
    substrate: getVal('ev-substrate'),
    params: { ph:getNum('ev-ph'), gh:getNum('ev-gh'), kh:getNum('ev-kh'), tds:getNum('ev-tds'), temp:getNum('ev-temp'), ammonia:getNum('ev-ammonia'), nitrite:getNum('ev-nitrite'), nitrate:getNum('ev-nitrate') },
    photoperiod: { hours:getNum('ev-light'), type:getVal('ev-light-type') },
    remineraliser: { vol:getNum('ev-rem-vol'), startGH:getNum('ev-rem-start'), targetGH:getNum('ev-rem-target'), rate:getNum('ev-rem-rate') },
    tdsEstimate: { gh:getNum('ev-tds-gh'), kh:getNum('ev-tds-kh') },
    filter: { type:getVal('ev-filter-type'), cycled:getVal('ev-filter-cycled'), maint:getVal('ev-filter-maint') },
    stocking: { species:getVal('ev-shrimp-species'), count:getNum('ev-shrimp-count'), mates:['nano','risky','pred','snails'].filter(function(m) { return getCb('ev-mate-'+m); }) },
    plants: { density:getVal('ev-plant-density'), moss:getCb('ev-has-moss'), leaflitter:getCb('ev-has-leaflitter'), botanicals:getCb('ev-has-botanicals'), driftwood:getCb('ev-has-driftwood'), floaters:getCb('ev-has-floaters'), hides:getCb('ev-has-hides') }
  };
}

function evScore(setup) {
  var p   = setup.params;
  var pl  = setup.plants;
  var sub = setup.substrate;
  var ft  = setup.filter.type;
  var fc  = setup.filter.cycled;
  var fm  = setup.filter.maint;
  var sp  = setup.stocking.species;
  var mates = setup.stocking.mates;
  var shrimpPerGal = setup.volume > 0 ? setup.stocking.count / setup.volume : 0;

  var scores = {};
  var strengths = [], concerns = [], flags = [], trajectory = [];

  // ── HELPER: clamp to 0-5 in 0.5 steps ──────────────
  function clamp(v) { return Math.max(0, Math.min(5, Math.round(v * 2) / 2)); }

  // ── 1. WATER CHEMISTRY (raw 0-5, capped by gates) ───
  var waterScore = 5;
  var waterGated = false;

  if (p.ammonia > 0) {
    waterScore = Math.min(waterScore, 1.5);
    waterGated = true;
    flags.push('Ammonia detected (' + p.ammonia + ' ppm) -- perform an immediate 30% water change with dechlorinated, temperature-matched water and identify the source before adding any more shrimp.');
  }
  if (p.nitrite > 0) {
    waterScore = Math.min(waterScore, 1.5);
    waterGated = true;
    flags.push('Nitrite detected (' + p.nitrite + ' ppm) -- the tank is not fully cycled or the biological filter has crashed. Hold all water changes above 20% until nitrite clears.');
  }
  if (p.ph < 6.5) {
    waterScore -= 2; waterGated = true;
    flags.push('pH ' + p.ph + ' is dangerously acidic for Neocaridina. Shrimp will be severely stressed or dying. Check substrate type and KH immediately.');
  } else if (p.ph > 8.0) {
    waterScore -= 1.5;
    flags.push('pH ' + p.ph + ' is above the safe ceiling. Check for high KH, evaporation concentration, or algae bloom driving pH up during the day.');
  } else if (p.ph < 7.0 || p.ph > 7.6) {
    waterScore -= 0.5;
    concerns.push('pH ' + p.ph + ' is within the acceptable range but outside the ideal 7.0-7.6 zone. Stable is more important than perfect -- do not correct aggressively.');
  }
  if (p.gh < 2) {
    waterScore = Math.min(waterScore, 1); waterGated = true;
    flags.push('GH ' + p.gh + ' dGH is critically low -- molt failure (WROD) is almost certain. Add Salty Shrimp GH+ immediately and do not add more shrimp until GH is above 6.');
  } else if (p.gh < 4) {
    waterScore -= 2;
    flags.push('GH ' + p.gh + ' dGH is below the safe minimum. WROD risk is high. Begin supplementing GH at every water change.');
  } else if (p.gh < 6) {
    waterScore -= 1;
    concerns.push('GH ' + p.gh + ' dGH is below the ideal range of 6-8. Increase gradually with remineralizer. Borderline GH becomes critical when the colony begins heavy breeding.');
  } else if (p.gh > 12) {
    waterScore -= 1;
    concerns.push('GH ' + p.gh + ' dGH is above the acceptable range. Shells may become too hard to split at molt. Dilute with RO or rain water at next change.');
  }
  if (p.kh < 0.5) {
    waterScore = Math.min(waterScore, 1.5); waterGated = true;
    flags.push('KH is effectively zero -- pH can crash overnight with no warning. Raise KH with crushed coral or sodium bicarbonate before the next feeding.');
  } else if (p.kh < 1) {
    waterScore -= 1.5;
    flags.push('KH ' + p.kh + ' dKH is dangerously low. pH stability cannot be maintained at this level. Add crushed coral to the filter or raise with bicarbonate slowly.');
  } else if (p.kh < 2) {
    waterScore -= 0.5;
    concerns.push('KH ' + p.kh + ' dKH is below the ideal range. pH may drift, especially in a tank with CO2 fluctuation or heavy organic load.');
  } else if (p.kh > 8) {
    waterScore -= 0.5;
    concerns.push('KH ' + p.kh + ' dKH is above the ideal range. Very high KH can interfere with molting in sensitive lines and makes pH very resistant to correction.');
  }
  if (p.tds < 100) {
    waterScore -= 1.5;
    flags.push('TDS ' + p.tds + ' ppm is critically low. Water is almost devoid of minerals -- osmotic stress and molt failure are likely. Remineralize immediately.');
  } else if (p.tds < 150) {
    waterScore -= 0.75;
    concerns.push('TDS ' + p.tds + ' ppm is below the acceptable range. Mineral content may be insufficient for healthy shell formation.');
  } else if (p.tds > 350) {
    waterScore -= 1;
    concerns.push('TDS ' + p.tds + ' ppm is above the acceptable range. High TDS from waste buildup makes shells too hard to split. A 20-25% water change is recommended.');
  } else if (p.tds > 300) {
    waterScore -= 0.5;
    concerns.push('TDS ' + p.tds + ' ppm is above the ideal zone. Monitor and perform a water change if it continues to rise.');
  }
  if (p.temp < 62) {
    waterScore -= 2; waterGated = true;
    flags.push('Temperature ' + p.temp + 'F is dangerously cold. Shrimp metabolism will shut down and immune function will be severely compromised.');
  } else if (p.temp < 65) {
    waterScore -= 1;
    concerns.push('Temperature ' + p.temp + 'F is below the safe range. Breeding will stop and shrimp will become lethargic. A small aquarium heater is recommended.');
  } else if (p.temp > 82) {
    waterScore = Math.min(waterScore, 1.5); waterGated = true;
    flags.push('Temperature ' + p.temp + 'F is in the danger zone. Oxygen levels are critically low at this temperature. Shrimp deaths are imminent. Add a surface fan immediately and check your heater.');
  } else if (p.temp > 78) {
    waterScore -= 1.5;
    concerns.push('Temperature ' + p.temp + 'F is above the safe ceiling. Oxygen solubility drops and shrimp show heat stress. Add surface agitation and shade the tank if possible.');
  }
  if (p.nitrate > 40) {
    waterScore -= 1.5;
    flags.push('Nitrate ' + p.nitrate + ' ppm is severely elevated. At this level, shrimp immunity is suppressed and molt failures increase. Perform a 25-30% water change and reduce feeding.');
  } else if (p.nitrate > 20) {
    waterScore -= 1;
    concerns.push('Nitrate ' + p.nitrate + ' ppm is above the 20 ppm safe limit. Increase water change frequency or add fast-growing plants. Shrimp are more nitrate-sensitive than most fish.');
  } else if (p.nitrate > 10) {
    waterScore -= 0.25;
    concerns.push('Nitrate ' + p.nitrate + ' ppm is within range but above the ideal 10 ppm target. Good plants and regular water changes will keep this in check.');
  }
  if (!waterGated && waterScore >= 4.5) strengths.push('Water chemistry is excellent and in the ideal zone for Neocaridina -- the most important foundation for a healthy colony.');
  else if (!waterGated && waterScore >= 3.5) strengths.push('Water parameters are mostly in range. Minor improvements will bring this to optimal.');
  scores.water = clamp(waterScore);

  // ── 2. MOLT SAFETY (capped by GH gate) ──────────────
  var moltScore = 5;
  var moltGated = false;

  if (sub === 'amazonia') { moltScore -= 1; concerns.push('ADA Amazonia actively lowers pH over months and is not recommended for Neocaridina long-term. Parameters that look fine today will drift.'); }
  if (sub === 'coral')    { moltScore -= 0.5; concerns.push('Coral substrate raises KH continuously. Monitor KH monthly -- it can push above the safe range as water evaporates and concentrates.'); }
  if (sub === 'stratum')  { moltScore -= 0.5; concerns.push('Fluval Stratum is designed for Caridina and lowers pH. Monitor closely with Neocaridina and be prepared to switch substrates if pH drops below 7.0.'); }
  if (p.gh < 2)  { moltScore = 0; moltGated = true; }
  else if (p.gh < 4)  { moltScore -= 3; moltGated = true; }
  else if (p.gh < 6)  { moltScore -= 1.5; }
  if (p.kh < 1)  { moltScore -= 1; }
  if (p.ammonia > 0 || p.nitrite > 0) { moltScore -= 1; }
  if (setup.maturity === 'new' || setup.maturity === 'cycling') { moltScore -= 0.5; concerns.push('Unstable parameters in a new or cycling tank significantly increase molt failure risk. Allow the tank to mature fully before expecting successful molts.'); }
  if (pl.leaflitter || pl.botanicals) strengths.push('Leaf litter and/or botanicals provide tannins and biofilm that support healthy molting and immunity.');
  if (!moltGated && moltScore >= 4.5) strengths.push('Molt safety conditions are excellent -- GH is adequate, KH is stable, and the tank is mature.');
  scores.molt = clamp(moltScore);

  // ── 3. FILTRATION ────────────────────────────────────
  var filtScore = 5;
  var filtGated = false;

  if (ft === 'none') {
    filtScore = 0; filtGated = true;
    flags.push('No filter present. An unfiltered tank accumulates ammonia from every feeding event. This is not survivable for shrimp long-term regardless of how good parameters look today.');
  } else if (ft === 'hob_open' || ft === 'canister_open') {
    filtScore -= 1.5;
    concerns.push('Unprotected filter intake will kill shrimplets and juveniles. Add a sponge pre-filter sleeve -- this is a cheap fix with a major impact on colony growth.');
  } else if (ft === 'sponge' || ft === 'dual_sponge') {
    strengths.push('Sponge filter is the ideal choice for shrimp tanks -- completely safe for shrimplets and provides an excellent biofilm-covered grazing surface.');
  }
  if (fc === 'no') {
    filtScore = Math.min(filtScore, 1.5); filtGated = true;
    flags.push('Filter is not cycled. Never add shrimp to an uncycled tank -- ammonia and nitrite will spike within days. Complete the cycle first (ammonia and nitrite both at 0 ppm for at least one week).');
  } else if (fc === 'partial') {
    filtScore -= 1;
    concerns.push('Filter is still cycling. Parameters are unstable. Delay adding new shrimp and monitor ammonia daily until the cycle is complete.');
  }
  if (fm === 'neglected') {
    filtScore -= 1;
    concerns.push('Filter has not been maintained in over 3 months. Rinse the sponge in old tank water (never tap water) to restore flow without destroying the bacterial colony.');
  } else if (fm === 'overdue') {
    filtScore -= 0.25;
  }
  if (!filtGated && filtScore >= 4.5) strengths.push('Filtration is well-maintained and appropriately configured for a shrimp tank.');
  scores.filter = clamp(filtScore);

  // ── 4. STOCKING SAFETY (exponential density penalty) ─
  var stockScore = 5;
  var stockGated = false;

  // Exponential density penalty
  if (shrimpPerGal > 50) {
    stockScore = 0; stockGated = true;
    flags.push('Catastrophic overstocking: ' + shrimpPerGal.toFixed(0) + ' shrimp per gallon. At this density, ammonia will spike within hours of feeding, oxygen will be depleted, and complete colony collapse is imminent. This tank cannot support this many shrimp under any conditions.');
  } else if (shrimpPerGal > 30) {
    stockScore = Math.min(stockScore, 0.5); stockGated = true;
    flags.push('Severe overstocking: ' + shrimpPerGal.toFixed(1) + ' shrimp per gallon. Bioload far exceeds what any filter can process. Immediate rehoming of most of the colony is required to prevent a crash.');
  } else if (shrimpPerGal > 20) {
    stockScore -= 3.5;
    flags.push('Heavy overstocking: ' + shrimpPerGal.toFixed(1) + ' shrimp per gallon. Even with perfect water changes, ammonia and nitrate will be difficult to control at this density. Reduce colony size significantly.');
  } else if (shrimpPerGal > 15) {
    stockScore -= 2.5;
    concerns.push('Significant overstocking at ' + shrimpPerGal.toFixed(1) + ' shrimp per gallon. Daily parameter monitoring is essential. Rehome a portion of the colony before breeding increases density further.');
  } else if (shrimpPerGal > 10) {
    stockScore -= 1;
    concerns.push('Stocking is on the high side at ' + shrimpPerGal.toFixed(1) + ' shrimp per gallon. Manageable with regular water changes, but watch nitrate closely -- it will rise faster than in a lighter tank.');
  } else if (shrimpPerGal > 7) {
    stockScore -= 0.25;
    concerns.push('Stocking is moderate at ' + shrimpPerGal.toFixed(1) + ' shrimp per gallon. Keep up regular water changes as the colony grows.');
  }

  // Tank mate penalties
  if (mates.indexOf('pred') !== -1) {
    stockScore = Math.min(stockScore, 0.5); stockGated = true;
    flags.push('Predatory fish (cichlids, goldfish, large fish) will systematically hunt and eliminate shrimp. There is no mitigation strategy -- they must be housed separately.');
  }
  if (mates.indexOf('risky') !== -1) {
    stockScore -= 1.5;
    concerns.push('Risky fish (betta, honey gourami, larger tetras) may eat shrimp -- especially at night and during vulnerable molts. Dense moss cover is essential. Monitor for active predation.');
  }
  if (mates.indexOf('nano') !== -1 && mates.indexOf('pred') === -1) {
    stockScore -= 0.25;
    concerns.push('Nano fish are generally safe with adult shrimp but will eat shrimplets. Dense moss and floating plants give shrimplets the refuge they need to survive.');
  }
  if (mates.indexOf('snails') !== -1) strengths.push('Snails are ideal shrimp companions -- they occupy different niches, clean up missed food, and contribute to a healthy tank ecosystem.');
  if (mates.length === 0 || mates.indexOf('none') !== -1) strengths.push('Shrimp-only tank -- the optimal environment for colony growth and maximum shrimplet survival.');

  // Species-specific checks
  if ((sp === 'bamboo' || sp === 'neo_bamboo') && setup.volume < 20) {
    stockScore -= 1;
    concerns.push('Bamboo/Vampire Shrimp need at least 20 gallons with consistent moderate flow. In a smaller tank they struggle to position themselves in the current and may slowly starve.');
  }
  if ((sp === 'bamboo' || sp === 'neo_bamboo') && (setup.maturity === 'new' || setup.maturity === 'cycling')) {
    stockScore = Math.min(stockScore, 1); stockGated = true;
    flags.push('Bamboo Shrimp require a mature, established tank with stable suspended particulate in the water column. They will slowly starve in a new or cycling tank even if parameters look fine.');
  }
  if (!stockGated && stockScore >= 4.5) strengths.push('Stocking density and tank mate selection are well-managed with no significant predation or bioload risk.');
  scores.stock = clamp(stockScore);

  // ── 5. HABITAT QUALITY ───────────────────────────────
  var habitatScore = 3;
  var habitatGated = false;

  if (pl.density === 'dense')    { habitatScore += 1.5; }
  else if (pl.density === 'moderate') { habitatScore += 0.75; }
  else if (pl.density === 'sparse')   { habitatScore -= 0.5; concerns.push('Sparse planting provides limited biofilm surface and little refuge for molting shrimp. Add java moss and a piece of driftwood as a minimum.'); }
  else if (pl.density === 'none')     {
    habitatScore -= 2; habitatGated = true;
    concerns.push('A bare tank has no biofilm surfaces, no cover for vulnerable molts, and no natural grazing. Shrimp in bare tanks are chronically stressed and show reduced breeding. Add live plants, IAL, and driftwood.');
  }
  if (pl.moss)       { habitatScore += 0.5; strengths.push('Live moss provides the finest biofilm surface in the hobby and is essential refuge for shrimplets during their most vulnerable weeks.'); }
  if (pl.leaflitter) { habitatScore += 0.4; strengths.push('Leaf litter replicates the natural allochthonous input shrimp evolved around, providing both direct food and a continuously renewing biofilm surface. See the Naturals & Botanicals page for species-specific guidance.'); }
  if (pl.botanicals) { habitatScore += 0.25; }
  if (pl.leaflitter && pl.botanicals) { habitatScore += 0.15; strengths.push('Combining leaf litter with botanicals creates a multi-zone foraging landscape -- fast-cycling leaves alongside long-lasting structural pieces -- rather than relying on one input alone.'); }
  if (pl.driftwood)  { habitatScore += 0.25; }
  if (pl.floaters)   { habitatScore += 0.25; strengths.push('Floating plants soften harsh surface light, absorb dissolved nutrients, and provide dangling roots for grazing and refuge.'); }
  if (pl.hides)      { habitatScore += 0.25; }
  if (setup.maturity === 'established' || setup.maturity === 'mature') { habitatScore += 0.25; }
  if (!pl.leaflitter && !pl.botanicals && !habitatGated) { concerns.push('No leaf litter or botanicals present. These provide continuous biofilm renewal that most shrimp tanks benefit from -- see the Naturals & Botanicals page for easy starting options like mulberry leaf or Indian almond leaf.'); }
  if (!habitatGated && habitatScore >= 4.5) strengths.push('Habitat is rich and diverse -- shrimp have excellent grazing, cover, and refuge throughout the tank.');
  scores.habitat = clamp(habitatScore);

  // ── WEIGHTED OVERALL (water 30, molt 25, filter 20, stock 15, habitat 10) ──
  var weighted = (scores.water * 0.30) + (scores.molt * 0.25) + (scores.filter * 0.20) + (scores.stock * 0.15) + (scores.habitat * 0.10);
  var pct = Math.round(weighted / 5 * 100);

  // Critical gate overrides: any zero dimension caps rating
  var zeroDims = ['water','molt','filter','stock','habitat'].filter(function(d) { return scores[d] === 0; });
  if (zeroDims.length >= 2) pct = Math.min(pct, 30);
  else if (zeroDims.length === 1) pct = Math.min(pct, 44);
  // Catastrophic stocking always caps at Needs Work or below
  if (shrimpPerGal > 30) pct = Math.min(pct, 25);
  else if (shrimpPerGal > 20) pct = Math.min(pct, 40);

  var rating = pct >= 90 ? 'Excellent' : pct >= 76 ? 'Good' : pct >= 60 ? 'Developing' : pct >= 44 ? 'Needs Work' : 'Critical';
  var ratingColor = pct >= 90 ? '#4a8a6a' : pct >= 76 ? '#5ab5a0' : pct >= 60 ? '#c9a84c' : pct >= 44 ? '#d4916e' : '#c0392b';

  // ── TRAJECTORY WARNINGS ──────────────────────────────
  // Each warning: { severity: 'imminent'|'nearterm'|'watch', text: '...' }
  var TW = [];

  // Overstocking + good water = imminent crash
  if (shrimpPerGal > 10 && scores.water >= 4) {
    var daysToSpike = shrimpPerGal > 30 ? 'hours to days' : shrimpPerGal > 20 ? '2-5 days' : shrimpPerGal > 15 ? '1-2 weeks' : '2-4 weeks';
    TW.push({ sev:'imminent', text: 'Your water parameters look good right now, but at ' + shrimpPerGal.toFixed(1) + ' shrimp per gallon the bioload will overwhelm your filter\'s capacity. Expect ammonia to become detectable within ' + daysToSpike + ' without intervention. Rehome shrimp before parameters deteriorate, not after.' });
  }

  // Active substrate + currently OK pH = future pH drift
  if (sub === 'amazonia' && p.ph >= 6.8) {
    TW.push({ sev:'nearterm', text: 'ADA Amazonia will continue acidifying the water as it buffers. A pH of ' + p.ph + ' today may drop to 6.4-6.6 over the next 4-8 weeks. Test pH weekly and be prepared to switch to an inert substrate or use pH-stable water at changes.' });
  }
  if (sub === 'stratum' && p.ph >= 7.0) {
    TW.push({ sev:'nearterm', text: 'Fluval Stratum is designed to lower pH. At ' + p.ph + ' the substrate is still working against you. Monitor weekly -- if pH drops below 6.8 consistently, consider switching to an inert substrate for a Neocaridina colony.' });
  }

  // Low KH + currently stable pH = future pH crash
  if (p.kh < 3 && p.ph >= 6.8 && scores.water >= 3) {
    TW.push({ sev:'nearterm', text: 'KH of ' + p.kh + ' dKH provides very little buffering capacity. As organic acids accumulate between water changes and CO2 builds up overnight, pH will become increasingly unstable. A pH crash can happen faster than your next scheduled test. Raise KH to 3-5 dKH for reliable stability.' });
  }

  // GH borderline + colony growing = future molt failures
  if (p.gh >= 4 && p.gh < 6 && setup.stocking.count > 10) {
    TW.push({ sev:'nearterm', text: 'GH of ' + p.gh + ' dGH is technically acceptable but marginal. As your colony grows and breeding frequency increases, more calcium and magnesium will be consumed per week. What is survivable for a small colony may produce increasing WROD failures as the colony matures. Raise GH to 6-8 dGH before breeding peaks.' });
  }

  // Good stocking but risky fish + growing colony = future predation bottleneck
  if (mates.indexOf('risky') !== -1 && setup.stocking.count > 15 && scores.stock >= 3) {
    TW.push({ sev:'nearterm', text: 'Risky fish are manageable now because adult shrimp are large enough to avoid easy predation. As the colony breeds and produces shrimplets, predation losses will increase. A dense colony that produces shrimplets constantly is also a colony that is constantly losing them to tank mates. Add moss and floating plant cover before breeding intensifies.' });
  }

  // No filter or uncycled + good params = temporary window
  if ((ft === 'none' || fc === 'no') && scores.water >= 3) {
    TW.push({ sev:'imminent', text: 'Your water parameters may look acceptable right now, but without established biological filtration every feeding event produces ammonia that has no bacterial colony to process it. This is a temporary window. Ammonia will accumulate with each feeding. Establish a cycled filter before the parameters begin to degrade -- which could happen within the next 24-48 hours depending on feeding and stocking.' });
  }

  // High nitrate approaching threshold + overstocking
  if (p.nitrate >= 15 && p.nitrate <= 20 && shrimpPerGal > 8) {
    TW.push({ sev:'nearterm', text: 'Nitrate is at ' + p.nitrate + ' ppm -- within range but approaching the 20 ppm ceiling. At your current stocking density, nitrate will likely exceed the safe limit before your next scheduled water change. Increase water change frequency to weekly or add fast-growing stem plants or duckweed to absorb nitrate between changes.' });
  }

  // Dense colony + no plants = overfeeding risk and ammonia spikes
  if (pl.density === 'none' && setup.stocking.count > 10 && scores.water >= 3) {
    TW.push({ sev:'nearterm', text: 'Without live plants, there is no nutrient buffer between your shrimp and the water column. Every feeding event that leaves uneaten food goes directly to ammonia with no plant uptake to slow it. A tank this size with this many shrimp and no plants is highly sensitive to overfeeding. Any missed food removal within 24 hours carries a real risk of an ammonia event.' });
  }

  // Good water + no botanicals/leaf litter + mature colony = future biofilm deficit
  if (!pl.botanicals && !pl.leaflitter && !pl.moss && setup.stocking.count > 20 && scores.water >= 4) {
    TW.push({ sev:'watch', text: 'A growing colony of this size depends heavily on biofilm as a primary food source. Without moss, leaf litter, botanicals, or driftwood providing biofilm surfaces, shrimp become entirely dependent on supplemental feeding. As colony size increases, the gap between biofilm availability and colony demand grows -- watch for increased aggression around food and consider adding mulberry leaf, IAL, cholla wood, or java moss.' });
  }

  // High temperature trend risk
  if (p.temp >= 76 && p.temp <= 78) {
    TW.push({ sev:'watch', text: 'Temperature is at the upper end of the acceptable range. A warm day, a room without air conditioning, or a malfunctioning heater could push this above 80F quickly. At 82F+ shrimp will begin dying. Set up a small fan aimed at the water surface now -- it can reduce tank temperature by 3-5F passively and provides cheap insurance against a heat event.' });
  }

  // Coral substrate + high KH = creeping hardness
  if (sub === 'coral' && p.kh >= 6) {
    TW.push({ sev:'watch', text: 'Coral substrate continuously dissolves into the water as calcium and carbonate. With KH already at ' + p.kh + ' dKH, this will continue to rise as water evaporates and concentrates. Very high KH (above 10) makes pH resistant to correction and can interfere with molting. Top off with RO or distilled water instead of tap to slow the concentration effect.' });
  }

  // Bamboo shrimp in established tank but no flow mention
  if ((sp === 'bamboo' || sp === 'neo_bamboo') && scores.filter >= 3 && !pl.floaters && setup.volume < 30) {
    TW.push({ sev:'watch', text: 'Bamboo Shrimp are filter feeders and need consistent current carrying fine particulate to their fan positions. Without floating plants or deliberately directed flow, they may not receive enough suspended food. Add a second air stone or position the filter output to create gentle flow across areas where they tend to perch.' });
  }

  return {
    scores: scores, pct: pct, rating: rating, ratingColor: ratingColor,
    strengths: strengths, concerns: concerns, flags: flags, trajectory: TW,
    weighted: parseFloat(weighted.toFixed(2))
  };
}

function evRunEvaluation() {
  var setup = evGatherSetup();
  var r     = evScore(setup);
  window._evSetup  = setup;
  window._evResult = r;

  var dimOrder  = ['water','molt','filter','stock','habitat'];
  var dimLabels = { water:'Water Chemistry', molt:'Molt Safety', filter:'Filtration', stock:'Stocking Safety', habitat:'Habitat Quality' };
  var dimWeights = { water:'30%', molt:'25%', filter:'20%', stock:'15%', habitat:'10%' };

  function scoreColor(s) { return s >= 4.5 ? '#4a8a6a' : s >= 3.5 ? '#5ab5a0' : s >= 2.5 ? '#c9a84c' : s >= 1.5 ? '#d4916e' : '#c0392b'; }

  var dimRows = dimOrder.map(function(d) {
    var s = r.scores[d]; var col = scoreColor(s); var w = (s/5*100)+'%';
    return '<div class="report-dim">' +
      '<span class="report-dim-name">' + dimLabels[d] + ' <span style="font-size:0.65rem;color:var(--light-text);font-weight:400">(' + dimWeights[d] + ')</span></span>' +
      '<div class="report-dim-bar-wrap"><div class="report-dim-bar" style="width:'+w+';background:'+col+'"></div></div>' +
      '<span class="report-dim-score" style="color:'+col+'">'+s+'/5</span>' +
    '</div>';
  }).join('');

  function listItems(arr, cls, icon) {
    if (!arr.length) return '';
    return '<ul class="ev-list ev-list-'+cls+'">' + arr.map(function(i) { return '<li><span class="ev-list-icon">'+icon+'</span>'+i+'</li>'; }).join('') + '</ul>';
  }

  // Trajectory section
  var trajHtml = '';
  if (r.trajectory.length) {
    var sevOrder = ['imminent','nearterm','watch'];
    var sevConfig = {
      imminent: { icon:'&#128308;', label:'Imminent (days)', col:'#c0392b', bg:'rgba(192,57,43,0.06)', border:'rgba(192,57,43,0.2)' },
      nearterm: { icon:'&#128993;', label:'Near-term (weeks)', col:'#c9a84c', bg:'rgba(201,168,76,0.06)', border:'rgba(201,168,76,0.2)' },
      watch:    { icon:'&#128309;', label:'Watch (months)', col:'#2a5298', bg:'rgba(42,82,152,0.06)', border:'rgba(42,82,152,0.2)' }
    };
    var grouped = { imminent:[], nearterm:[], watch:[] };
    r.trajectory.forEach(function(t) { if (grouped[t.sev]) grouped[t.sev].push(t.text); });
    var twItems = '';
    sevOrder.forEach(function(sev) {
      if (!grouped[sev].length) return;
      var cfg = sevConfig[sev];
      grouped[sev].forEach(function(txt) {
        twItems += '<div style="background:'+cfg.bg+';border:1px solid '+cfg.border+';border-left:3px solid '+cfg.col+';border-radius:0 8px 8px 0;padding:0.75rem 1rem;margin:0.5rem 0">' +
          '<div style="font-size:0.68rem;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:'+cfg.col+';margin-bottom:0.3rem">'+cfg.icon+' '+cfg.label+'</div>' +
          '<div style="font-size:0.82rem;line-height:1.65;color:#3a4e65">'+txt+'</div>' +
        '</div>';
      });
    });
    trajHtml = '<div style="margin-top:1.5rem">' +
      '<h3 style="font-family:\'Lora\',serif;font-size:0.95rem;margin-bottom:0.4rem;color:var(--blue-deep)">&#9201; What to Watch For</h3>' +
      '<p style="font-size:0.76rem;color:var(--mid-text);margin-bottom:0.75rem">These are predictive warnings based on how your current conditions are likely to evolve -- not current problems.</p>' +
      twItems +
    '</div>';
  }

  var html = '<div class="report-card">' +
    '<div class="ev-overall" style="border-color:'+r.ratingColor+';background:'+r.ratingColor+'18">' +
      '<div><div style="font-size:0.65rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--mid-text);margin-bottom:0.25rem">Overall Assessment</div>' +
      '<div style="font-family:\'Lora\',serif;font-size:1.6rem;font-weight:600;color:'+r.ratingColor+'">'+r.rating+'</div>' +
      '<div style="font-size:0.7rem;color:var(--mid-text);margin-top:0.2rem">Weighted score across 5 dimensions</div></div>' +
      '<div style="text-align:right"><div style="font-family:\'DM Mono\',monospace;font-size:2.2rem;font-weight:500;color:'+r.ratingColor+'">'+r.pct+'%</div>' +
      '<div style="font-size:0.75rem;color:var(--mid-text)">('+r.weighted.toFixed(2)+' / 5.00 weighted)</div></div>' +
    '</div>' +
    '<h3 style="font-family:\'Lora\',serif;font-size:0.95rem;margin:1.2rem 0 0.6rem">Dimension Scores</h3>' +
    dimRows +
    (r.strengths.length ? '<h3 style="font-family:\'Lora\',serif;font-size:0.95rem;margin:1.2rem 0 0.5rem;color:#4a8a6a">&#10003; Working Well</h3>'+listItems(r.strengths,'good','&#10003;') : '') +
    (r.concerns.length  ? '<h3 style="font-family:\'Lora\',serif;font-size:0.95rem;margin:1.2rem 0 0.5rem;color:#c9a84c">&#9888; Concerns</h3>'         +listItems(r.concerns,'warn','&#9888;') : '') +
    (r.flags.length     ? '<h3 style="font-family:\'Lora\',serif;font-size:0.95rem;margin:1.2rem 0 0.5rem;color:#c0392b">&#10007; Critical Issues</h3>'   +listItems(r.flags,'bad','&#10007;') : '') +
    trajHtml +
  '</div>' +
  '<div class="ev-action-row">' +
    '<button class="ev-action-btn ev-btn-primary" onclick="evDownloadReport()">&#128196; Download Report</button>' +
    '<button class="ev-action-btn" onclick="evDownloadData()">&#128190; Download Data</button>' +
    '<button class="ev-action-btn ev-btn-reset" onclick="evReset()">&#8635; Start Over</button>' +
  '</div>';

  var resultsEl = document.getElementById('ev-results');
  resultsEl.innerHTML = html;
  resultsEl.style.display = 'block';
  resultsEl.scrollIntoView({ behavior:'smooth', block:'start' });
  evRenderHistory(setup, r);
}

function evLoadFiles(input) {
  var files = Array.from(input.files);
  if (!files.length) return;
  var pending = files.length;
  files.forEach(function(file) {
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var data = JSON.parse(e.target.result);
        if (data.app === 'shrimp-shelf' && data.date) {
          // Dedupe by datetime if present, fall back to date+label
          var dupKey = data.datetime || (data.date + '|' + data.label);
          var exists = evHistorySessions.some(function(s) {
            return (s.datetime || (s.date + '|' + s.label)) === dupKey;
          });
          if (!exists) evHistorySessions.push(data);
        }
      } catch(err) {}
      pending--;
      if (pending === 0) {
        // Reset input so the same file can be selected again in a future click
        input.value = '';
        evShowSessionList();
      }
    };
    reader.readAsText(file);
  });
}

function evShowSessionList() {
  evHistorySessions.sort(function(a, b) {
    var ka = a.datetime || a.date;
    var kb = b.datetime || b.date;
    return ka < kb ? -1 : ka > kb ? 1 : 0;
  });
  var list = document.getElementById('ev-sessions-list');
  if (!list) return;
  if (!evHistorySessions.length) { list.style.display = 'none'; return; }
  list.style.display = 'block';
  list.innerHTML =
    '<div style="font-size:0.75rem;color:var(--mid-text);margin-bottom:0.4rem">' +
      evHistorySessions.length + ' session(s) loaded - click Upload again to add more:' +
    '</div>' +
    evHistorySessions.map(function(s) {
      var timeStr = '';
      if (s.datetime && s.datetime.length > 10) {
        timeStr = ' \u00b7 ' + s.datetime.slice(11, 16);
      }
      return '<div style="font-size:0.78rem;background:rgba(42,82,152,0.07);border-radius:6px;padding:0.3rem 0.6rem;margin:0.2rem 0;display:flex;justify-content:space-between;align-items:center">' +
        '<span>' + s.date + timeStr + ' - ' + (s.label || 'Unnamed') + '</span>' +
        '<span style="color: var(--link);font-weight:600">' + (s.scores && s.scores.overall !== undefined ? s.scores.overall + '%' : '?') + '</span>' +
      '</div>';
    }).join('');
}

function evRenderHistory(currentSetup, currentResult) {
  var hist = document.getElementById('ev-history');
  if (!hist) return;
  if (!evHistorySessions.length) { hist.style.display = 'none'; return; }
  hist.style.display = 'block';

  // Build current session object in same shape as uploaded sessions
  var currentSession = {
    date:   currentSetup.date,
    label:  currentSetup.label,
    params: currentSetup.params,
    scores: {
      water:   currentResult.scores.water,
      molt:    currentResult.scores.molt,
      filter:  currentResult.scores.filter,
      stock:   currentResult.scores.stock,
      habitat: currentResult.scores.habitat,
      weighted: currentResult.weighted,
      overall: currentResult.pct
    },
    rating:     currentResult.rating,
    ratingColor: currentResult.ratingColor,
    trajectory: currentResult.trajectory || [],
    isCurrent:  true
  };

  var allSessions = evHistorySessions.concat([currentSession]);
  // Sort by datetime if available, date otherwise; current always last on tie
  allSessions.sort(function(a, b) {
    var ka = a.datetime || a.date;
    var kb = b.datetime || b.date;
    if (ka < kb) return -1;
    if (ka > kb) return 1;
    // Equal timestamps: current session goes last (rightmost = most recent)
    if (a.isCurrent && !b.isCurrent) return 1;
    if (!a.isCurrent && b.isCurrent) return -1;
    return 0;
  });

  // Detect whether any sessions share a date - if so, show time in headers
  var dateCounts = {};
  allSessions.forEach(function(s) { dateCounts[s.date] = (dateCounts[s.date] || 0) + 1; });
  var showTime = Object.keys(dateCounts).some(function(d) { return dateCounts[d] > 1; });

  var paramKeys   = ['ph','gh','kh','tds','temp','ammonia','nitrite','nitrate'];
  var paramLabels = { ph:'pH', gh:'GH (dGH)', kh:'KH (dKH)', tds:'TDS (ppm)', temp:'Temp (°F)', ammonia:'Ammonia', nitrite:'Nitrite', nitrate:'Nitrate' };
  // Ideal ranges for color-coding cells
  var paramIdeal  = {
    ph:      [7.0, 7.6],  gh:      [6, 8],
    kh:      [2, 5],      tds:     [200, 250],
    temp:    [68, 74],    ammonia: [0, 0],
    nitrite: [0, 0],      nitrate: [0, 10]
  };
  var paramAcc = {
    ph:      [6.5, 8.0], gh:      [4, 12],
    kh:      [1, 8],     tds:     [150, 300],
    temp:    [65, 78],   ammonia: [0, 0],
    nitrite: [0, 0],     nitrate: [0, 20]
  };

  var dimKeys   = ['water','molt','filter','stock','habitat'];
  var dimLabels = { water:'Water Chemistry', molt:'Molt Safety', filter:'Filtration', stock:'Stocking Safety', habitat:'Habitat Quality' };

  // Trend arrow
  function trend(vals) {
    var clean = vals.filter(function(v) { return v !== null && !isNaN(v); });
    if (clean.length < 2) return '';
    var last = clean[clean.length - 1], prev = clean[clean.length - 2];
    if (last > prev + 0.05) return '<span style="color:#4a8a6a;font-weight:900;font-size:1.15rem;line-height:1">&#9650;</span>';
    if (last < prev - 0.05) return '<span style="color:#c0392b;font-weight:900;font-size:1.15rem;line-height:1">&#9660;</span>';
    return '<span style="color:#c9a84c;font-weight:900;font-size:1.15rem;line-height:1">&#9654;</span>';
  }

  // Color a param cell based on ideal/acceptable ranges
  function paramCellColor(key, v) {
    if (v === null) return '';
    var id = paramIdeal[key], ac = paramAcc[key];
    if (!id || !ac) return '';
    // Zero-tolerance params
    if (id[0] === 0 && id[1] === 0) return v === 0 ? '#4a8a6a' : '#c0392b';
    if (v >= id[0] && v <= id[1]) return '#4a8a6a';
    if (v >= ac[0] && v <= ac[1]) return '#c9a84c';
    return '#c0392b';
  }

  // Column headers - show time when same-day sessions exist, current always last
  var colH = '<th style="text-align:left;padding:0.45rem 0.7rem;white-space:nowrap">Metric</th>' +
    allSessions.map(function(s) {
      var isCur   = s.isCurrent;
      var bg      = isCur ? 'rgba(42,82,152,0.15)' : 'transparent';
      var timeStr = (showTime && s.datetime && s.datetime.length > 10)
        ? '<br><span style="font-weight:400;font-size:0.65rem;opacity:0.75">' + s.datetime.slice(11,16) + '</span>'
        : '';
      var lbl = isCur
        ? s.date + timeStr + '<br><span style="font-weight:600;font-size:0.68rem;color:var(--cerulean-lt)">&#9733; Current</span>'
        : s.date + timeStr + '<br><span style="font-weight:400;font-size:0.68rem;opacity:0.7">' + (s.label || '') + '</span>';
      return '<th style="padding:0.45rem 0.7rem;text-align:center;background:'+bg+';white-space:nowrap">' + lbl + '</th>';
    }).join('') +
    '<th style="padding:0.45rem 0.7rem;text-align:center">Trend</th>';

  // Parameter rows
  var pRows = paramKeys.map(function(k) {
    var vals  = allSessions.map(function(s) { return s.params && s.params[k] !== undefined ? s.params[k] : null; });
    var cells = vals.map(function(v, si) {
      var isCur = allSessions[si].isCurrent;
      var col   = paramCellColor(k, v);
      var bg    = isCur ? 'rgba(42,82,152,0.06)' : '';
      var style = 'text-align:center;padding:0.35rem 0.6rem;' + (col ? 'color:'+col+';font-weight:600;' : '') + (bg ? 'background:'+bg+';' : '');
      return '<td style="' + style + '">' + (v !== null ? v : '<span style="opacity:0.3">--</span>') + '</td>';
    }).join('');
    return '<tr><td style="padding:0.35rem 0.6rem;font-weight:500;white-space:nowrap;color:var(--blue-deep)">' + paramLabels[k] + '</td>' + cells +
      '<td style="text-align:center;padding:0.35rem 0.6rem;font-size:1rem">' + trend(vals) + '</td></tr>';
  }).join('');

  // Dimension score rows
  var dRows = dimKeys.map(function(k) {
    var vals  = allSessions.map(function(s) { return s.scores && s.scores[k] !== undefined ? s.scores[k] : null; });
    var cells = vals.map(function(v, si) {
      var isCur = allSessions[si].isCurrent;
      var col   = v === null ? '' : v >= 4 ? '#4a8a6a' : v >= 3 ? '#c9a84c' : '#c0392b';
      var bg    = isCur ? 'rgba(42,82,152,0.06)' : '';
      var style = 'text-align:center;padding:0.35rem 0.6rem;font-weight:600;' + (col ? 'color:'+col+';' : '') + (bg ? 'background:'+bg+';' : '');
      return '<td style="' + style + '">' + (v !== null ? v + '/5' : '<span style="opacity:0.3">--</span>') + '</td>';
    }).join('');
    return '<tr><td style="padding:0.35rem 0.6rem;font-weight:500;white-space:nowrap;color:var(--blue-deep)">' + dimLabels[k] + '</td>' + cells +
      '<td style="text-align:center;padding:0.35rem 0.6rem;font-size:1rem">' + trend(vals) + '</td></tr>';
  }).join('');

  // Overall score row
  var oVals  = allSessions.map(function(s) { return s.scores && s.scores.overall !== undefined ? s.scores.overall : null; });
  var oCells = oVals.map(function(v, si) {
    var isCur = allSessions[si].isCurrent;
    var col   = v === null ? '' : v >= 80 ? '#4a8a6a' : v >= 60 ? '#c9a84c' : '#c0392b';
    var bg    = isCur ? 'rgba(42,82,152,0.08)' : '';
    var style = 'text-align:center;padding:0.4rem 0.6rem;font-weight:700;' + (col ? 'color:'+col+';' : '') + (bg ? 'background:'+bg+';' : '');
    return '<td style="' + style + '">' + (v !== null ? v + '%' : '<span style="opacity:0.3">--</span>') + '</td>';
  }).join('');
  var oRow = '<tr style="border-top:2px solid var(--border)">' +
    '<td style="padding:0.4rem 0.6rem;font-weight:700;color:var(--blue-deep)">Overall Score</td>' + oCells +
    '<td style="text-align:center;padding:0.35rem 0.6rem;font-size:1rem">' + trend(oVals) + '</td></tr>';

  // Rating row
  var rCells = allSessions.map(function(s, si) {
    var isCur = allSessions[si].isCurrent;
    var col   = s.ratingColor || (s.scores && s.scores.overall >= 80 ? '#4a8a6a' : s.scores && s.scores.overall >= 60 ? '#c9a84c' : '#c0392b');
    var bg    = isCur ? 'rgba(42,82,152,0.06)' : '';
    var rating = s.rating || (s.scores && s.scores.overall >= 90 ? 'Excellent' : s.scores && s.scores.overall >= 76 ? 'Good' : s.scores && s.scores.overall >= 60 ? 'Developing' : s.scores && s.scores.overall >= 44 ? 'Needs Work' : 'Critical');
    var style = 'text-align:center;padding:0.35rem 0.6rem;font-weight:600;font-size:0.78rem;' + (col ? 'color:'+col+';' : '') + (bg ? 'background:'+bg+';' : '');
    return '<td style="' + style + '">' + (rating || '<span style="opacity:0.3">--</span>') + '</td>';
  }).join('');
  var rRow = '<tr><td style="padding:0.35rem 0.6rem;font-weight:500;color:var(--blue-deep)">Rating</td>' + rCells +
    '<td style="padding:0.35rem 0.4rem"></td></tr>';

  // Trajectory warning count row
  var twCells = allSessions.map(function(s, si) {
    var isCur = allSessions[si].isCurrent;
    var traj  = s.trajectory || [];
    var imm   = traj.filter(function(t) { return t.sev === 'imminent'; }).length;
    var near  = traj.filter(function(t) { return t.sev === 'nearterm'; }).length;
    var watch = traj.filter(function(t) { return t.sev === 'watch'; }).length;
    var bg    = isCur ? 'rgba(42,82,152,0.06)' : '';
    var content = traj.length === 0 ? '<span style="color:#4a8a6a;font-size:0.75rem">None</span>' :
      (imm  ? '<span style="color:#c0392b;font-size:0.72rem;margin-right:0.3rem">&#128308;' + imm + '</span>' : '') +
      (near ? '<span style="color:#c9a84c;font-size:0.72rem;margin-right:0.3rem">&#128993;' + near + '</span>' : '') +
      (watch ? '<span style="color:#2a5298;font-size:0.72rem">&#128309;' + watch + '</span>' : '');
    return '<td style="text-align:center;padding:0.35rem 0.6rem;' + (bg ? 'background:'+bg+';' : '') + '">' + content + '</td>';
  }).join('');
  var twRow = '<tr><td style="padding:0.35rem 0.6rem;font-weight:500;color:var(--blue-deep);white-space:nowrap">Warnings</td>' + twCells +
    '<td style="padding:0.35rem 0.4rem"></td></tr>';

  // Legend
  var legend = '<div style="display:flex;gap:1.2rem;font-size:0.72rem;color:var(--mid-text);margin-top:0.85rem;flex-wrap:wrap">' +
    '<span><span style="color:#4a8a6a;font-weight:600">Green</span> = Ideal</span>' +
    '<span><span style="color:#c9a84c;font-weight:600">Amber</span> = Acceptable / Moderate</span>' +
    '<span><span style="color:#c0392b;font-weight:600">Red</span> = Out of range / Critical</span>' +
    '<span>&#128308; Imminent &nbsp;&#128993; Near-term &nbsp;&#128309; Watch</span>' +
  '</div>';

  hist.innerHTML =
    '<div class="report-card" style="overflow-x:auto">' +
      '<h3 style="font-family:\'Lora\',serif;font-size:1rem;margin-bottom:0.25rem">&#128200; Progress Over Time</h3>' +
      '<p style="font-size:0.76rem;color:var(--mid-text);margin-bottom:1rem">' + allSessions.length + ' sessions compared - current session highlighted. Color-coded cells show parameter status against shrimp-optimized ranges.</p>' +
      '<h4 style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--mid-text);margin-bottom:0.5rem">Water Parameters</h4>' +
      '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:0.8rem;margin-bottom:1.4rem">' +
        '<thead style="background:var(--ink);color:rgba(255,255,255,0.85)">' + colH + '</thead>' +
        '<tbody>' + pRows + '</tbody>' +
      '</table></div>' +
      '<h4 style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--mid-text);margin-bottom:0.5rem">Evaluation Scores</h4>' +
      '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:0.8rem">' +
        '<thead style="background:var(--ink);color:rgba(255,255,255,0.85)">' + colH + '</thead>' +
        '<tbody>' + dRows + oRow + rRow + twRow + '</tbody>' +
      '</table></div>' +
      legend +
    '</div>';
}

function evDownloadData() {
  var setup = window._evSetup, r = window._evResult;
  if (!setup || !r) { alert('Please run the evaluation first.'); return; }
  var payload = JSON.parse(JSON.stringify(setup));
  payload.app = 'shrimp-shelf';
  payload.version = APP_VERSION;
  payload.scores = { water:r.scores.water, molt:r.scores.molt, filter:r.scores.filter, stock:r.scores.stock, habitat:r.scores.habitat, weighted:r.weighted, overall:r.pct };
  payload.rating = r.rating;
  payload.trajectory = r.trajectory || [];
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'shrimp-shelf-' + APP_VERSION + '-' + setup.date + '-' + (setup.fileTimePart || '') + '-' + setup.label.replace(/[^a-z0-9]/gi,'-').toLowerCase() + '.json';
  a.click();
}

function evDownloadReport() {
  var setup = window._evSetup, r = window._evResult;
  if (!setup || !r) { alert('Please run the evaluation first.'); return; }
  var date = new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  var p = setup.params, pl = setup.plants;
  var dimOrder  = ['water','molt','filter','stock','habitat'];
  var dimLabels = { water:'Water Chemistry', molt:'Molt Safety', filter:'Filtration', stock:'Stocking Safety', habitat:'Habitat Quality' };
  function scoreCol(s) { return s>=4.5?'#4a8a6a':s>=3.5?'#5ab5a0':s>=2.5?'#c9a84c':s>=1.5?'#d4916e':'#c0392b'; }
  var dimRowsHtml = dimOrder.map(function(d) {
    var s=r.scores[d],col=scoreCol(s),w=(s/5*100)+'%';
    return '<div class="dim-row"><div class="dim-label">'+dimLabels[d]+'</div><div class="dim-bar-outer"><div class="dim-bar-inner" style="width:'+w+';background:'+col+'"></div></div><div class="dim-score" style="color:'+col+'">'+s+'</div></div>';
  }).join('');
  function makeList(arr,icon,col) {
    if(!arr.length) return '<p style="color:#888;font-style:italic">None identified.</p>';
    return '<ul>'+arr.map(function(i){return '<li><span style="color:'+col+'">'+icon+'</span> '+i+'</li>';}).join('')+'</ul>';
  }
  var subLabels={inert_gravel:'Inert gravel',inert_sand:'Pool filter sand',lava:'Crushed lava rock',stratum:'Fluval Stratum',amazonia:'ADA Amazonia',coral:'Coral sand',other:'Other'};
  var matLabels={new:'New (under 4 weeks)',cycling:'Cycling (4-8 weeks)',young:'Young (2-3 months)',mature:'Mature (3+ months)',established:'Well established (6+ months)'};
  var filtLabels={sponge:'Sponge filter',dual_sponge:'Dual sponge filters',hob_covered:'HOB + pre-filter sponge',hob_open:'HOB (unprotected)',canister_covered:'Canister + pre-filter',canister_open:'Canister (unprotected)',none:'No filter'};

// ── RENDERER ──────────────────────────────────────────
function renderPage(p, i) {
  let body = '';
  if (p.type === 'welcome') body = renderWelcome();
  else if (p.type === 'setup') body = renderSetup();
  else if (p.type === 'species') body = renderSpecies();
  else if (p.type === 'plants') body = renderPlants();
  else if (p.type === 'feeding') body = renderFeeding();
  else if (p.type === 'naturals') body = renderNaturals();
  else if (p.type === 'breeding') body = renderBreeding();
  else if (p.type === 'health') body = renderHealth();
  else if (p.type === 'compatibility') body = renderCompatibility();
  else if (p.type === 'gear') body = renderGear();
  else if (p.type === 'troubleshooting') body = renderTroubleshooting();
  else if (p.type === 'glossary') body = renderGlossary();
  else if (p.type === 'parameters') body = renderParameters();
  else if (p.type === 'tools') body = renderTools();
  else if (p.type === 'evaluator') body = renderEvaluator();
  else body = renderStub(p);
  return '<div class="page' + (i === 0 ? ' active' : '') + '" id="page-' + p.id + '">' +
    buildPageHeader(p, i) + body + buildPageNav(i) + '</div>';
}

function triggerReveal() {

    .forEach(function(el) { el.classList.add('visible'); });
}

function toggleFaq(btn) {
  const item = btn.parentElement;
  const isOpen = item.classList.contains('open');
  item.closest('.faq-list').querySelectorAll('.faq-item')
    .forEach(function(i) { i.classList.remove('open'); });
  if (!isOpen) item.classList.add('open');
}
