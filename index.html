    '<h3 class="section-heading reveal" style="font-size:1rem;margin-bottom:0.75rem">Preparation before use</h3>' +
    '<div class="param-grid reveal" style="margin-bottom:1.25rem">' +
      '<div class="param-card"><div class="param-name">Dried leaves</div><div class="param-range ideal">Rinse + 30 min soak</div><p style="font-size:0.8rem;color:var(--m-text);margin:0.4rem 0 0">Rinse under tap, soak 30 minutes to check for mould or hitchhikers. Add directly or after a brief hot soak to help them sink.</p></div>' +
      '<div class="param-card"><div class="param-name">Fresh mulberry / nettle</div><div class="param-range ideal">Blanch 60&ndash;90 sec</div><p style="font-size:0.8rem;color:var(--m-text);margin:0.4rem 0 0">Wash thoroughly, blanch 60\u201390 seconds in boiling water, cool completely before adding.</p></div>' +
      '<div class="param-card"><div class="param-name">Boiling (optional)</div><div class="param-range acceptable">Reduces tannins</div><p style="font-size:0.8rem;color:var(--m-text);margin:0.4rem 0 0">Kills surface organisms and helps leaves sink but leaches tannins. Use when you want food value without water tinting.</p></div>' +
      '<div class="param-card"><div class="param-name">Oven method</div><div class="param-range ideal">Best of both</div><p style="font-size:0.8rem;color:var(--m-text);margin:0.4rem 0 0">120\u00b0C / 250\u00b0F for 20\u201340 min. Sterilises without leaching tannins \u2014 best of both approaches.</p></div>' +
    '</div>' +

    '<div class="highlight-box amber reveal">' +
      '<strong>Dosing:</strong> 1 medium leaf per 10 gallons as a starting point. Replace when only the leaf skeleton (veins) remains \u2014 leave the skeleton one more week as it is still a biofilm surface. Fresh mulberry can be offered as a small piece every 1\u20132 days as a direct food supplement.' +
    '</div>' +

    '<h2 class="section-heading reveal">Managing snail competition at feeding time</h2>' +
    '<p class="prose reveal">Mystery snails and shrimp coexist well ecologically \u2014 snails process detritus and algae that shrimp ignore. The problem is competitive feeding: mystery snails are large and persistent and will monopolise a mulberry leaf before smaller shrimp can access it. The goal is not to remove snails from the equation but to ensure shrimp get adequate access while snails handle cleanup, which is what they do best.</p>' +

    strategyCard('&#9201;', 'Feed at lights-out',
      'Shrimp are most active and bold in low light and after dark. Mystery snails are more active during daylight and shortly after lights come on. Adding leaves as the photoperiod ends gives shrimp a significant head start before snails fully mobilise. This alone shifts the dynamic noticeably.') +

    strategyCard('&#128336;', 'Distract snails separately',
      'Drop a piece of blanched zucchini or cucumber for the snails at one end of the tank immediately before adding shrimp leaves at the other end. Snails fixate on the vegetable; shrimp get the leaves undisturbed. Zucchini softens quickly and snails find it irresistible.') +

    strategyCard('&#127807;', 'Multiple leaves simultaneously',
      'A single mystery snail can monopolise a single leaf. Two or three leaves added at the same time mean no snail can cover all locations. Shrimp scatter and access whichever leaf the snail is not on. Add several small pieces of mulberry rather than one large one.') +

    strategyCard('&#128070;', 'Submerged feeding platforms',
      'A platform suspended several centimetres below the surface creates a depth barrier that exploits a fundamental difference between shrimp and snails: shrimp navigate three-dimensionally in open water, while snails require continuous surface contact to move. A platform held by a floating ring at the surface has no surface path leading to it \u2014 effectively snail-proof even if the float drifts to the glass. Shrimp swim straight to it. Such feeders exist commercially and as printable designs.') +

    strategyCard('&#129519;', 'Feeding clips positioned high',
      'Suction-cup feeding clips on the glass above substrate level give shrimp easy access while making snail navigation challenging. Snails must climb the glass and navigate laterally to the clip \u2014 possible but slow. Combined with lights-out timing this is often sufficient for small snail populations.') +

    strategyCard('&#127807;', 'Choose less-attractive leaves for the main tank',
      'Snails prefer the softest, most nutritious leaves. Dried catappa, oak, beech, and birch are less immediately attractive because of their tannin bitterness and tougher initial texture. Offering tannin leaves in the main tank while reserving mulberry for a targeted shrimp feed using another strategy lets shrimp access both food types without constant competition.') +

    strategyCard('&#127922;', 'Manage snail colony size',
      'A single mystery snail in a 20-gallon tank is a manageable grazer. A large colony will overwhelm any feeding strategy. If snails consistently outcompete shrimp regardless of technique, colony size is the root cause \u2014 rehome surplus snails to restore the balance.') +

    '<div class="highlight-box teal reveal">' +
      '<strong>The right role for snails:</strong> mystery snails are excellent at processing algae, consuming leftover food before it decays, and keeping glass and hardscape clean. Used as the cleanup crew they genuinely are, they contribute positively. The strategies above are about channelling that energy rather than fighting it.' +
    '</div>' +

  '</div>';
}

function renderBreeding() {
  return '<div class="page-body">' +

    '<div class="highlight-box blue reveal">Neocaridina breed readily in stable, well-fed tanks — often without any deliberate intervention. The more common challenge is slowing them down once a colony is established, or managing colour quality as the population grows. Understanding the cycle helps you guide the colony rather than just watch it happen.</div>' +

    '<h2 class="section-heading reveal">The breeding cycle</h2>' +
    '<table class="data-table reveal"><thead><tr><th>Stage</th><th>What to look for</th><th>Duration</th></tr></thead><tbody>' +
      '<tr><td><strong>Saddle</strong></td><td>Yellowish patch behind the head on the female\'s back — unfertilised eggs waiting in the ovaries</td><td>Ongoing in mature females</td></tr>' +
      '<tr><td><strong>Moulting &amp; mating</strong></td><td>Female moults and releases pheromones; males become hyperactive and swim frantically — called a "mating swarm"</td><td>Minutes to hours</td></tr>' +
      '<tr><td><strong>Berried</strong></td><td>Fertilised eggs visible under the tail, fanned constantly by the female\'s swimmerets. Green, yellow, or brown depending on colour morph.</td><td>25–35 days at 72–76°F</td></tr>' +
      '<tr><td><strong>Shrimplets</strong></td><td>Miniature fully-formed shrimp, 1–2mm. Born directly as shrimp — no larval stage in freshwater Neocaridina.</td><td>Reach adult size in 3–4 months</td></tr>' +
      '<tr><td><strong>Sexual maturity</strong></td><td>Females develop a saddle; males are slightly smaller and slimmer. Females begin breeding cycle.</td><td>~3 months from hatching</td></tr>' +
    '</tbody></table>' +

    '<div class="info-card reveal"><div class="info-card-title">Why aren\'t they breeding?</div><div class="info-card-body">The most common reasons: tank is too new (under 3 months), parameters are unstable, temperature is below 70°F, the colony is all-female or all-male, or the tank was recently treated with medication. A healthy, mixed, mature colony in stable water will breed without any prompting. If they still aren\'t after 3 months, check sex ratio — females are larger with a rounder belly and visible saddle; males are slim and smaller.</div></div>' +

    '<h2 class="section-heading reveal">Caring for shrimplets</h2>' +
    '<p class="prose reveal">Shrimplets are miniature adults from birth and need no special care beyond what the colony already gets. The most important things: <strong>no predators</strong> (even small fish will eat shrimplets), <strong>no strong intake flow</strong> (cover filter intakes with sponge), and <strong>fine food</strong> — powdered foods and biofilm are easier to eat than large wafers at 1–2mm.</p>' +
    '<p class="prose reveal">Shrimplets spend most of their first weeks hiding in moss, java fern roots, and leaf litter. A tank that looks shrimp-empty after a birth event is usually just a tank full of shrimplets hiding well. Resistance to handling and water quality is lower in the first two weeks — avoid water changes larger than 10% while shrimplets are very young.</p>' +

    '<h2 class="section-heading reveal">Colony management &amp; culling</h2>' +
    '<p class="prose reveal">A Neocaridina colony will double roughly every 3 months under good conditions. A 10-gallon tank comfortably holds 50–80 adults; beyond that, bioload increases and colour quality can decline without selective pressure.</p>' +
    '<div class="highlight-box moss reveal"><strong>Culling for colour</strong> means removing (rehoming, returning to a store, or using as feeders) shrimp that show undesirable colour expression — translucency, off-colour patches, or fading. Remove these before they breed, not after. A well-culled colony maintains and intensifies colour over generations; an unmanaged colony drifts toward the ancestral wild-type.</div>' +

    '<h2 class="section-heading reveal">Sex ratio &amp; colony health</h2>' +
    '<table class="data-table reveal"><thead><tr><th>Topic</th><th>Detail</th></tr></thead><tbody>' +
      '<tr><td><strong>Ideal sex ratio</strong></td><td>~1 male to 3 females. More females = more breeding capacity; too many males causes stress through constant pursuit.</td></tr>' +
      '<tr><td><strong>Starting colony size</strong></td><td>10–15 shrimp minimum to establish a healthy gene pool. Smaller groups can be slow to take off.</td></tr>' +
      '<tr><td><strong>Keeping one colour form</strong></td><td>Essential for maintaining colour. Mixing Neo colour forms produces brown/wild-type offspring within 1–2 generations.</td></tr>' +
      '<tr><td><strong>Population control</strong></td><td>Overstock triggers slower breeding naturally, but also stresses the colony. Better to rehome excess regularly.</td></tr>' +
      '<tr><td><strong>Berried female stress</strong></td><td>Avoid large water changes, medication, or temperature swings while females are berried — stress can cause egg drops.</td></tr>' +
    '</tbody></table>' +

    '<h2 class="section-heading reveal">Ghost &amp; Bamboo Shrimp breeding</h2>' +
    '<div class="info-card reveal"><div class="info-card-title">Ghost Shrimp</div><div class="info-card-body">Females carry eggs for 3–4 weeks. Larvae hatch as zooplankton and require brackish water (SG 1.005–1.010) to develop — they die within days in freshwater. Captive breeding in a standard tank is not practical. This is a feature for display tanks where you want a stable, non-exploding population.</div></div>' +
    '<div class="info-card reveal"><div class="info-card-title">Bamboo / Vampire Shrimp</div><div class="info-card-body">Rarely breed in captivity — larvae require estuarine conditions and specific planktonic food. Almost all Bamboo Shrimp in the hobby are wild-caught. Treat each one as irreplaceable and focus on longevity (3–5 years in good conditions) rather than breeding.</div></div>' +

  '</div>';
}

// ── MOLT & HEALTH ─────────────────────────────────────
function renderHealth() {
  return '<div class="page-body">' +

    '<div class="highlight-box water reveal">Molting is the most vulnerable moment in a shrimp\'s life. Understanding the molt cycle — and what disrupts it — is the single most useful thing you can learn about shrimp keeping. Most unexplained deaths are molt-related.</div>' +

    '<h2 class="section-heading reveal">The molt cycle</h2>' +
    '<p class="prose reveal">Shrimp cannot grow without molting. They shed their entire exoskeleton — including gill covers, eye covers, and the lining of the digestive tract — and must expand their new soft shell before it hardens. This process takes 1–4 hours. During that window, the shrimp is completely defenceless.</p>' +
    '<table class="data-table reveal"><thead><tr><th>Phase</th><th>Signs</th><th>Duration</th></tr></thead><tbody>' +
      '<tr><td><strong>Pre-molt</strong></td><td>Shrimp hides, stops eating, may appear dull or slightly pale. Calcium and minerals are reabsorbed from the old shell.</td><td>Days to a week</td></tr>' +
      '<tr><td><strong>The molt</strong></td><td>Old shell splits at the back of the head. Shrimp wriggles free in seconds to minutes. Discarded shell looks like a ghost shrimp.</td><td>Minutes</td></tr>' +
      '<tr><td><strong>Post-molt</strong></td><td>Shrimp is soft, pale, and motionless. It will often eat its own shed shell — this replenishes calcium. Hides for several hours while new shell hardens.</td><td>4–24 hours</td></tr>' +
      '<tr><td><strong>Inter-molt</strong></td><td>Normal active behaviour. Shell fully hardened. Shrimp feeds and grows until the next cycle begins.</td><td>Days to weeks</td></tr>' +
    '</tbody></table>' +

    '<div class="info-card reveal"><div class="info-card-title">Leave the shed shell in the tank</div><div class="info-card-body">A discarded molt shell is not waste — it is a calcium-rich resource. Shrimp will eat it within 24–48 hours. Only remove it if it is still there after 3 days and starting to foul. Tanks with many shrimp molting regularly rarely need shells removed at all.</div></div>' +

    '<h2 class="section-heading reveal">White Ring of Death (WROD)</h2>' +
    '<p class="prose reveal">The White Ring of Death is a failed molt where the shrimp cannot free itself from the old shell. A visible white ring appears around the junction between head and body — the shell has hardened in the wrong position, trapping the shrimp. It is almost always fatal once visible.</p>' +
    '<div class="highlight-box gold reveal"><strong>Causes of WROD:</strong> Low GH (insufficient calcium/magnesium for shell formation), sudden parameter change during pre-molt, copper contamination, or unstable KH causing pH swings. The most preventable cause is low GH — keep GH above 6 dGH for Neocaridina and test it regularly.</div>' +
    '<p class="prose reveal">If you see a WROD shrimp, do not attempt to help it shed by force — this almost always causes fatal injury. Ensure other shrimp cannot stress it, and monitor. Very rarely a shrimp will free itself from an early-stage WROD. More often it will not survive.</p>' +

    '<h2 class="section-heading reveal">Other common health issues</h2>' +
    '<table class="data-table reveal"><thead><tr><th>Problem</th><th>Signs</th><th>Likely cause</th><th>Action</th></tr></thead><tbody>' +
      '<tr><td><strong>Sudden mass death</strong></td><td>Multiple shrimp dead within hours</td><td>Ammonia/nitrite spike, copper exposure, temperature shock</td><td>Test water immediately. 20% water change with dechlorinated water. Check for copper sources (medications, pipes, fertilisers).</td></tr>' +
      '<tr><td><strong>Gradual die-off</strong></td><td>1–2 deaths per week over several weeks</td><td>Unstable parameters, low GH, bacterial infection, old age</td><td>Test GH, KH, pH trend. Check for molt failures. Increase water change frequency temporarily.</td></tr>' +
      '<tr><td><strong>Lethargy / not eating</strong></td><td>Shrimp sits still, ignores food</td><td>Pre-molt (normal), or poor water quality</td><td>Test parameters. If parameters are fine and shrimp molts within a week, it was pre-molt behaviour.</td></tr>' +
      '<tr><td><strong>Milky / opaque body</strong></td><td>Shrimp body turns white or cloudy</td><td>Bacterial infection (Milky Disease), or pre-death stress response</td><td>Isolate affected shrimp. No reliable treatment — remove and euthanise humanely (clove oil) to prevent spread.</td></tr>' +
      '<tr><td><strong>Spinning / erratic swimming</strong></td><td>Shrimp swims in circles or corkscrews</td><td>Ammonia poisoning, copper, or neurological stress</td><td>Emergency 30% water change. Test immediately. Likely fatal if prolonged.</td></tr>' +
      '<tr><td><strong>Vorticella (fuzzy patches)</strong></td><td>White fuzzy tufts on shell or head</td><td>Vorticella protozoan — opportunistic in poor water</td><td>Salt dip (1 tsp non-iodised salt per litre for 30 seconds) or hydrogen peroxide dip. Improve water quality.</td></tr>' +
    '</tbody></table>' +

    '<h2 class="section-heading reveal">Copper — the silent killer</h2>' +
    '<div class="highlight-box gold reveal"><strong>Shrimp are extremely sensitive to copper.</strong> Even trace amounts lethal to shrimp are well below levels harmful to fish. Common copper sources: most fish medications (check labels), some plant fertilisers (especially cheap all-in-ones), old copper plumbing, and some tap water supplies. Always use a dechlorinator that binds heavy metals, and test any new product in a small container before adding it to the tank.</div>' +

    '<h2 class="section-heading reveal">Quarantine</h2>' +
    '<p class="prose reveal">New shrimp should ideally be quarantined for 2–4 weeks before introduction. A simple 5-gallon bucket with a cycled sponge filter is sufficient. This catches visible parasites, bacterial infections, and allows the shrimp to settle before the stress of introduction to a new colony. It also protects your established colony from any pathogens the new arrivals may carry.</p>' +

  '</div>';
}

// ── TROUBLESHOOTING ───────────────────────────────────
function renderTroubleshooting() {

  var categories = [
    {
      icon: '💧',
      title: 'Water & Parameters',
      faqs: [
        {
          q: 'My shrimp are dying after a water change — what happened?',
          a: 'This is the single most reported shrimp-keeping problem and almost always comes down to one of four causes. (1) Temperature shock — even a 2-3 degree difference can trigger a fatal molt. Always match new water temperature precisely to the tank before adding. (2) Tap water chemistry is dramatically different from tank water — if your GH, KH, or pH differ significantly, the sudden shift stresses shrimp into premature molting. Use drip acclimation for water changes: run new water in slowly over 15-20 minutes rather than pouring it in. (3) Chloramine in tap water — chloramine is a compound of chlorine and ammonia used by many municipal water supplies. Unlike chlorine, it does not off-gas and requires a dechlorinator that specifically binds it. Seachem Prime works; cheap generic dechlorinators often do not. (4) Changing too much at once — never change more than 25-30% in a single water change in a shrimp tank. The parameter shift from a 50% change can be fatal even with perfectly matched water.'
        },
        {
          q: 'How often should I do water changes in a shrimp tank?',
          a: 'For an established, lightly stocked shrimp tank, 10-15% weekly or 20-25% every two weeks is a common and effective routine. The cardinal principle is consistency — shrimp tolerate a stable, slightly imperfect environment far better than an inconsistent one with large, infrequent changes. Always use dechlorinated, temperature-matched water. If your tap water has significantly different GH or KH from your tank, add new water slowly — drip it in or pour it in small amounts over several minutes. Never change more than 30% at once. For tanks using RO water remineralised to target parameters, water changes are also an opportunity to recalibrate GH and KH, so dose your remineraliser in the new water before adding it, not after.'
        },
        {
          q: 'My water is cloudy — will this hurt my shrimp?',
          a: 'It depends entirely on the type of cloudiness. White or milky cloudiness in a new tank is a bacterial bloom — harmless and self-resolving within a week or two as the nitrogen cycle establishes. Do not do large water changes to fix it; that only prolongs it. Green cloudiness is free-floating algae (phytoplankton), most common in new tanks or after a nutrient spike — not dangerous, but reduce photoperiod to 6-7 hours and add fast-growing floating plants. Brown cloudiness from new driftwood or botanicals is tannins — completely harmless and actually beneficial; tannins have mild antibacterial properties and shrimp thrive in light tannin-stained water. Yellow-brown cloudiness with a smell means decomposing organic matter — find and remove the source (uneaten food, a dead shrimp, rotting plant material), do a 20% water change, and test ammonia immediately.'
        },
        {
          q: 'Can I use CO2 injection in a Neocaridina tank?',
          a: 'You can, but with significant caution. CO2 injection directly lowers pH by forming carbonic acid in the water. During the photoperiod the drop is gradual and manageable; but when the CO2 supply shuts off overnight, pH rises again — creating a daily pH swing that stresses shrimp. If your KH is low (below 3 dKH), these swings can be dramatic and fatal. The greater risk is accidental overdose — CO2 can suffocate shrimp far faster than fish because shrimp are more sensitive to dissolved gas imbalance. If you use CO2, run a drop checker, never inject at night, keep KH above 3 dKH to buffer swings, and watch shrimp behaviour closely (gasping at the surface or sitting motionless at the bottom are emergency signs). Most Neocaridina keepers skip CO2 entirely — the plants they need thrive without it.'
        },
        {
          q: 'Does driftwood or cholla wood affect my water parameters?',
          a: 'Yes, but in ways that are mostly beneficial for shrimp. Driftwood leaches tannins — natural polyphenol compounds that gently lower pH and KH over time, add a light tea colour to the water, and have mild antibacterial properties. In a well-buffered tank (KH above 3 dKH) this effect is modest and shrimp genuinely thrive in tannin-stained water. Boiling driftwood before adding it releases the first heavy burst of tannins more quickly, reducing staining, but many keepers skip boiling and just let it settle naturally. Cholla wood has a negligible effect on parameters but provides enormous biofilm surface area as it slowly decomposes — shrimp graze on it constantly. Replace cholla wood when it fully breaks down (typically after several months). Neither wood type affects GH significantly.'
        }
      ]
    },
    {
      icon: '🦐',
      title: 'Behavior & Appearance',

    { term: 'Ammonia (NH3/NH4+)', def: 'Toxic waste product produced by shrimp, decomposing food, and plant matter. Should read 0 ppm in any established tank. Even 0.25 ppm is stressful; 1 ppm can be lethal.' },
    { term: 'Berried', def: 'A female shrimp carrying fertilised eggs under her tail, which she fans constantly with her swimmerets. Named for the egg cluster\'s resemblance to a bunch of berries.' },
    { term: 'Biofilm', def: 'A thin layer of bacteria, microalgae, fungi, and organic matter that colonises every surface in an established tank. The primary natural diet of dwarf shrimp — far more nutritious than most commercial foods.' },
    { term: 'Buffering capacity', def: 'The ability of water to resist pH change, determined by KH (carbonate hardness). High KH = stable pH; low KH = pH can swing rapidly with CO2 changes or acid inputs.' },
    { term: 'Caridina', def: 'A genus of dwarf shrimp that includes Crystal Red, Crystal Black, Bee, and Tiger shrimp. Generally requires softer, lower pH water than Neocaridina and is more sensitive to parameter swings. Not covered in detail in this guide.' },
    { term: 'Colony', def: 'An established, breeding population of shrimp in a tank. A healthy colony self-sustains with births outnumbering deaths.' },
    { term: 'Copper (Cu)', def: 'A heavy metal that is toxic to shrimp at very low concentrations — levels harmless to fish can kill shrimp within hours. Common sources: medications, cheap fertilisers, old plumbing.' },
    { term: 'Culling', def: 'Selectively removing shrimp from the colony — usually those with undesirable colour, pattern, or size — to maintain or improve the quality of future generations.' },
    { term: 'Cycling', def: 'The process of establishing a colony of beneficial nitrogen-cycle bacteria (Nitrosomonas and Nitrobacter) in a new tank before adding shrimp. Takes 4–6 weeks fishless, or 1–2 weeks with a seeded filter.' },
    { term: 'dGH / dKH', def: 'Degrees of General Hardness and Carbonate Hardness — the unit used to measure GH and KH in the hobby. 1 dGH/dKH ≈ 17.9 ppm.' },
    { term: 'Drip acclimation', def: 'A slow method of introducing shrimp to new water by dripping new water into the transport bag or a small container over 30–60 minutes. Reduces parameter shock.' },
    { term: 'GH (General Hardness)', def: 'A measure of dissolved calcium and magnesium in water. Critical for shell formation and successful molting. Neocaridina prefer 7–15 dGH. Too low GH = failed molts and WROD.' },
    { term: 'Grade', def: 'A quality descriptor for colour density and coverage in selectively bred shrimp. Higher grades have more opaque, consistent colour. Examples: Sakura (entry) → Fire Red → Painted Fire Red for cherry shrimp.' },
    { term: 'IAL (Indian Almond Leaf)', def: 'Dried leaves of Terminalia catappa, commonly used in shrimp tanks. Release tannins that lower pH slightly, have mild antibacterial properties, and provide an excellent biofilm grazing surface.' },
    { term: 'Inert substrate', def: 'A substrate that does not affect water chemistry — plain gravel, sand, or lava rock. Preferred for Neocaridina tanks where stable, neutral-to-alkaline parameters are needed.' },
    { term: 'Inter-molt', def: 'The period between molts when a shrimp\'s shell is fully hardened and it is actively feeding, growing, and behaving normally.' },
    { term: 'KH (Carbonate Hardness)', def: 'A measure of dissolved carbonates and bicarbonates in water. Acts as a pH buffer — higher KH means more stable pH. Neocaridina prefer 2–8 dKH.' },
    { term: 'Mating swarm', def: 'The frantic swimming behaviour of male shrimp immediately after a female molts and releases pheromones. Males swim rapidly in all directions searching for the female. Normal and expected behaviour.' },
    { term: 'Meiofauna', def: 'Microscopic organisms (copepods, nematodes, rotifers, ostracods) that live in the substrate and water column. Contribute to biofilm complexity and provide supplemental food for shrimplets.' },
    { term: 'Neocaridina', def: 'A genus of dwarf freshwater shrimp originating from eastern Asia. All common colour forms (cherry, blue dream, snowball, etc.) are the same species, Neocaridina davidi. Hardy, beginner-friendly, and widely kept.' },
    { term: 'Nitrate (NO3)', def: 'The end product of the nitrogen cycle. Less toxic than ammonia or nitrite but stressful at high levels. Keep below 20 ppm in a shrimp tank; ideally below 10. Reduced by water changes and plant uptake.' },
    { term: 'Nitrite (NO2)', def: 'An intermediate product of the nitrogen cycle, produced by Nitrosomonas bacteria breaking down ammonia. Highly toxic — should read 0 ppm in an established tank.' },
    { term: 'Nitrogen cycle', def: 'The biological process by which ammonia (from waste) is converted to nitrite by Nitrosomonas bacteria, then to nitrate by Nitrobacter bacteria. A cycled tank maintains 0 ammonia and 0 nitrite continuously.' },
    { term: 'Parameters', def: 'Shorthand for water chemistry values — pH, GH, KH, TDS, ammonia, nitrite, nitrate, and temperature. Testing parameters is the first step in diagnosing any shrimp problem.' },
    { term: 'pH', def: 'A measure of water acidity or alkalinity on a scale of 0–14. 7.0 is neutral. Neocaridina prefer 6.8–7.8. pH is influenced by KH, CO2, and certain substrates.' },
    { term: 'Planaria', def: 'Flat, triangular-headed white worms that can appear in shrimp tanks. Harmless to adult shrimp but can attack eggs and newly molted individuals. Treated with Planaria Zero.' },
    { term: 'Pre-molt', def: 'The period before a molt when a shrimp stops eating, may appear pale or dull, and begins reabsorbing calcium from its old shell. Can last days to a week.' },
    { term: 'Remineraliser', def: 'A product added to RO or distilled water to restore GH and KH. Salty Shrimp GH+ is the most widely used for Neocaridina. Allows precise control of water hardness.' },
    { term: 'RO water', def: 'Reverse Osmosis water — water purified by forcing it through a semipermeable membrane, removing nearly all dissolved minerals. Used by experienced keepers who want precise control of water chemistry by remineralising from zero.' },
    { term: 'Saddle', def: 'A yellowish patch visible behind the head of a mature female shrimp, under the dorsal shell. Unfertilised eggs waiting in the ovaries. When the female molts and is fertilised, the saddle becomes a clutch of eggs carried under the tail.' },
    { term: 'Shrimplet', def: 'A newly hatched or juvenile shrimp. Neocaridina shrimplets are born as fully formed miniature shrimp (1–2mm) with no larval stage in freshwater.' },
    { term: 'Sponge filter', def: 'A simple filter that draws water through a sponge using an air pump and uplift tube. Provides biological filtration with gentle flow and zero risk of sucking up shrimplets — the standard for shrimp tanks.' },
    { term: 'TDS (Total Dissolved Solids)', def: 'A measure of all dissolved substances in water, in parts per million (ppm). Neocaridina prefer 150–250 ppm. TDS rises with mineral content and falls with RO or rain water addition. Measured with an inexpensive pen meter.' },
    { term: 'Tannins', def: 'Natural polyphenol compounds released by botanicals, driftwood, and leaves. They stain water a tea colour, lower pH slightly, and have mild antibacterial properties. Beneficial in shrimp tanks; loved by shrimp.' },
    { term: 'Vorticella', def: 'A stalked ciliate protozoan that attaches to shrimp shells, appearing as white fuzzy tufts. Opportunistic in high-waste tanks. Treated with salt or hydrogen peroxide dips; not directly fatal but stressful.' },
    { term: 'WROD (White Ring of Death)', def: 'A failed molt where the new shell hardens in the wrong position, trapping the shrimp at the junction of head and body. Visible as a white ring around the shrimp\'s midsection. Almost always fatal. Primary cause: low GH.' }
  ];

  var glossHtml = terms.map(function(t) {
    return '<div class="info-card" style="margin:0.5rem 0;padding:0.85rem 1.1rem">' +
      '<div class="info-card-title">' + t.term + '</div>' +
      '<div class="info-card-body">' + t.def + '</div>' +
    '</div>';
  }).join('');

  return '<div class="page-body">' +
    '<p class="prose reveal">Every abbreviation, piece of jargon, and technical term you\'ll encounter in the shrimp hobby — defined plainly.</p>' +
    '<div class="reveal">' + glossHtml + '</div>' +
  '</div>';
}

// ── WATER PARAMETERS ──────────────────────────────────
function renderParameters() {

  // Dual-range bar: shows acceptable zone (muted) + ideal zone (vivid) overlaid
  // All positions as % of the display scale (scaleMin to scaleMax)
  function paramBar(cfg) {
    var span   = cfg.scaleMax - cfg.scaleMin;
    var accL   = ((cfg.accMin  - cfg.scaleMin) / span * 100).toFixed(2);
    var accW   = ((cfg.accMax  - cfg.accMin)   / span * 100).toFixed(2);
    var ideL   = ((cfg.ideMin  - cfg.scaleMin) / span * 100).toFixed(2);
    var ideW   = ((cfg.ideMax  - cfg.ideMin)   / span * 100).toFixed(2);
    var labelL = cfg.scaleMin + (cfg.scaleMax - cfg.scaleMin) * 0.01;
    var labelR = cfg.scaleMax;

    return '<div class="param-row reveal">' +
      '<div class="param-header">' +
        '<span class="param-label">' + cfg.label + '</span>' +
        '<span class="param-badges">' +
          '<span class="param-badge param-badge-ideal">Ideal: ' + cfg.ideMin + '–' + cfg.ideMax + ' ' + cfg.unit + '</span>' +
          '<span class="param-badge param-badge-acc">OK: ' + cfg.accMin + '–' + cfg.accMax + ' ' + cfg.unit + '</span>' +
        '</span>' +
      '</div>' +
      '<div class="param-track">' +
        '<div class="param-zone-acc"  style="left:' + accL + '%;width:' + accW + '%"></div>' +
        '<div class="param-zone-ideal" style="left:' + ideL + '%;width:' + ideW + '%"></div>' +
        '<span class="param-tick-label param-tick-l">' + cfg.scaleMin + '</span>' +
        '<span class="param-tick-label param-tick-r">' + cfg.scaleMax + '</span>' +
      '</div>' +
      '<div class="param-note">' + cfg.note + '</div>' +
    '</div>';
  }

  var legend = '<div class="param-legend reveal">' +
    '<span class="legend-swatch legend-ideal"></span><span class="legend-text">Ideal range</span>' +
    '<span class="legend-swatch legend-acc"></span><span class="legend-text">Acceptable range</span>' +
  '</div>';

  var bars = '<div class="params-wrap reveal">' +
    paramBar({ label:'pH', unit:'', scaleMin:5.5, scaleMax:9.0,
      accMin:6.5, accMax:8.0, ideMin:7.0, ideMax:7.6,
      note:'Prefers slightly alkaline, stable water. Avoid swift fluctuations — even within the acceptable range, rapid swings cause more harm than a steady value at the edge.' }) +
    paramBar({ label:'GH — General Hardness', unit:'dGH', scaleMin:0, scaleMax:16,
      accMin:4, accMax:12, ideMin:6, ideMax:8,
      note:'Calcium and magnesium for shell-building. Below 4 dGH risks the White Ring of Death. Above 12 can harden shells excessively, making them difficult to split at molt.' }) +
    paramBar({ label:'KH — Carbonate Hardness', unit:'dKH', scaleMin:0, scaleMax:12,
      accMin:1, accMax:8, ideMin:2, ideMax:5,
      note:'Acts as a pH buffer. Below 1 dKH means pH can crash overnight. Above 8 dKH can suppress molting in sensitive lines.' }) +
    paramBar({ label:'TDS — Total Dissolved Solids', unit:'ppm', scaleMin:50, scaleMax:400,
      accMin:150, accMax:300, ideMin:200, ideMax:250,
      note:'Reflects overall mineral density. Below 150 ppm risks osmotic shock and WROD. Above 350 ppm suggests waste buildup or overly hard tap water.' }) +
    paramBar({ label:'Temperature', unit:'°F', scaleMin:60, scaleMax:85,
      accMin:65, accMax:78, ideMin:68, ideMax:74,
      note:'Cooler water extends lifespan and reduces metabolic stress; warmer water speeds breeding and the life cycle. Above 80°F causes dangerous oxygen depletion.' }) +
    paramBar({ label:'Nitrate (NO₃)', unit:'ppm', scaleMin:0, scaleMax:40,
      accMin:0, accMax:20, ideMin:0, ideMax:10,
      note:'Shrimp are far more sensitive to nitrate than most tropical fish. Above 20 ppm weakens immune systems and causes failed molts over time. Manage with water changes and fast-growing plants.' }) +
  '</div>';

  var zeroParams =
    '<div class="zero-params-grid reveal">' +
      '<div class="zero-param-card">' +
        '<div class="zero-param-icon">&#9888;&#65039;</div>' +
        '<div class="zero-param-name">Ammonia (NH&#8323;/NH&#8324;&#8314;)</div>' +
        '<div class="zero-param-value">0 ppm — always</div>' +
        '<div class="zero-param-note">Highly toxic. Even 0.25 ppm causes stress; 1 ppm can kill within hours. Any reading above zero means the tank is not fully cycled or has crashed.</div>' +
      '</div>' +
      '<div class="zero-param-card">' +
        '<div class="zero-param-icon">&#9888;&#65039;</div>' +
        '<div class="zero-param-name">Nitrite (NO&#8322;&#8315;)</div>' +
        '<div class="zero-param-value">0 ppm — always</div>' +
        '<div class="zero-param-note">Blocks oxygen transport in shrimp hemolymph. Equally toxic to ammonia. A cycled, established tank should permanently read zero for both.</div>' +
      '</div>' +
    '</div>';

  return '<div class="page-body">' +

    '<div class="highlight-box water reveal">Water chemistry is the foundation of shrimp keeping. Get this right and most other problems solve themselves. The ranges below apply to Neocaridina — Ghost Shrimp tolerate similar values; Bamboo Shrimp prefer the softer end of these ranges.</div>' +

    '<h2 class="section-heading reveal">Visual Parameter Ranges</h2>' +
    '<p class="prose reveal">Each bar shows two zones: the <strong>acceptable range</strong> (light blue — shrimp can survive here) and the <strong>ideal range</strong> (vivid blue — where shrimp thrive, breed consistently, and molt safely). Stability within your chosen range matters more than hitting a precise number.</p>' +

    legend + bars +

    '<h2 class="section-heading reveal">Zero-tolerance parameters</h2>' +
    '<p class="prose reveal">These two have no acceptable non-zero value. Both should read 0 ppm permanently in any established tank.</p>' +
    zeroParams +

    '<h2 class="section-heading reveal">Three key takeaways</h2>' +
    '<div class="highlight-box blue reveal"><strong>Zero tolerance for nitrogen waste.</strong> In an established tank, ammonia and nitrite must be 0 ppm. Nitrate below 10 ppm is optimal — levels above 20 ppm weaken immune systems and cause failed molts over time, even when other parameters look fine.</div>' +
    '<div class="highlight-box gold reveal"><strong>TDS and GH protect molting.</strong> Low TDS (below 150 ppm) or low GH (below 4 dGH) leads to the White Ring of Death — the shrimp cannot break free from its old exoskeleton because the new shell is too soft. High TDS (above 350 ppm) can make shells too hard to split. Both extremes kill at molting time.</div>' +
    '<div class="highlight-box moss reveal"><strong>Stability beats perfection.</strong> Neocaridina adapt remarkably well to values slightly outside the ideal zone as long as parameters stay consistent. Rapid shifts in water chemistry cause far more stress than being steadily at the edge of acceptable. Test regularly, change water gradually, and avoid sudden additions.</div>' +

    '<h2 class="section-heading reveal">Parameter deep-dives</h2>' +

    '<div class="info-card reveal"><div class="info-card-title">pH — what it means and what moves it</div><div class="info-card-body">pH measures hydrogen ion concentration on a logarithmic scale — each full point is a 10× change. In a shrimp tank, pH is primarily controlled by KH (buffering) and CO2. Higher CO2 lowers pH; lower CO2 raises it. Active substrates like ADA Amazonia release acids that push pH down significantly over time — avoid for Neocaridina. The most stable pH comes from maintaining consistent KH and making water changes slowly.</div></div>' +

    '<div class="info-card reveal"><div class="info-card-title">GH — why it matters more than most keepers realise</div><div class="info-card-body">GH measures dissolved calcium and magnesium — the minerals shrimp use to build and repair their exoskeleton at every molt. Low GH is the most common preventable cause of WROD. Many tap water supplies have adequate GH; others (soft-water regions, municipal softening, or RO filtration) have very low GH. Test your tap water directly. If GH is below 4, supplement with Salty Shrimp GH+ at water changes to reach 6–8 dGH.</div></div>' +

    '<div class="info-card reveal"><div class="info-card-title">KH — the buffer that protects pH stability</div><div class="info-card-body">KH absorbs acid inputs (CO2, decomposition, tannins) before they can shift pH. A tank with KH below 1 dKH can swing from pH 7.5 to 6.0 overnight; a tank with KH of 3+ holds steady through most inputs. Aim for 2–5 dKH for Neocaridina. The relationship is simple: KH keeps pH stable; GH keeps shrimp shells strong. Both matter independently.</div></div>' +

    '<div class="info-card reveal"><div class="info-card-title">TDS — a useful flag, not a precise target</div><div class="info-card-body">TDS measures everything dissolved in water as a single number. It is a useful quick-check: rising TDS between water changes suggests accumulating waste; a sudden drop may indicate a parameter shift. The ideal 200–250 ppm zone reflects the mineral density Neocaridina evolved in. A TDS pen meter costs around $10 and gives you a daily reading without test tubes — well worth having.</div></div>' +

    '<div class="info-card reveal"><div class="info-card-title">Temperature — lifespan vs breeding rate trade-off</div><div class="info-card-body">Cooler water (68–70°F) slows metabolism, extends lifespan, and produces shrimp that often show more intense colour. Warmer water (72–76°F) speeds up the breeding cycle and increases activity — useful for building a colony faster. Above 78°F, oxygen solubility drops and shrimp begin to show heat stress. Above 82°F, mass deaths become likely. In summer, monitor tank temperature and consider a small fan aimed at the water surface to keep temperatures down.</div></div>' +

    '<h2 class="section-heading reveal">What goes wrong when parameters drift</h2>' +
    '<table class="data-table reveal"><thead><tr><th>Symptom</th><th>Most likely parameter issue</th></tr></thead><tbody>' +
      '<tr><td>Failed molts / WROD</td><td>GH below 4 dGH, or TDS below 150 ppm</td></tr>' +
      '<tr><td>Shells too hard to split</td><td>TDS above 350 ppm or GH above 12 dGH</td></tr>' +
      '<tr><td>pH swings day to night</td><td>KH below 1–2 dKH</td></tr>' +
      '<tr><td>Shrimp dying after water change</td><td>Temperature shock, or new water GH/KH very different from tank</td></tr>' +
      '<tr><td>Breeding stops</td><td>Temperature below 65°F, GH below 4, nitrate above 20 ppm</td></tr>' +
      '<tr><td>Lethargy / not eating</td><td>Ammonia or nitrite detectable, or pre-molt (normal)</td></tr>' +
      '<tr><td>Erratic swimming / spinning</td><td>Ammonia spike, copper contamination, or acute pH crash</td></tr>' +
      '<tr><td>Colour fading gradually</td><td>Chronic nitrate above 20 ppm, or stress from unstable parameters</td></tr>' +
    '</tbody></table>' +

    '<h2 class="section-heading reveal">Testing kit recommendations</h2>' +
    '<div class="highlight-box moss reveal"><strong>Minimum kit:</strong> API Freshwater Master Test Kit (ammonia, nitrite, nitrate, pH) + a GH/KH drop test kit (API or Salifert) + a TDS pen meter. The pen is inexpensive (~$10) and gives a daily quick-check in seconds. Test full parameters weekly while the tank is new; monthly once stable. Always test before and after changing anything significant.</div>' +

  '</div>';
}

        evParamInput('ev-nitrate', 'Nitrate (NO3)',   '8',  'ppm',  0, 20,   0,  10,   false) +

    '<div class="eval-step reveal">' +

      '<div id="ev-photo-result" style="margin-top:0.5rem"></div>' +

    '<div class="eval-step reveal">' +
      '<div class="eval-step-title"><span class="eval-step-num">4</span>Remineraliser Dosing</div>' +
      '<p style="font-size:0.79rem;color:var(--mid-text);margin-bottom:1rem">Volume auto-fills from Tank Setup. Calculates Salty Shrimp GH+ dose for RO or distilled water changes.</p>' +
      '<div class="tool-row"><label class="tool-label">Change volume</label>' +
        '<div class="tool-input-group"><input class="tool-input" id="ev-rem-vol" type="number" value="2" min="0.1" step="0.5" oninput="evRemCalc()"><span class="tool-unit">US gal</span></div></div>' +
      '<div class="tool-row"><label class="tool-label">Starting GH (RO = 0)</label>' +

function evParamInput(id, label, def, unit, accLo, accHi, ideLo, ideHi, isZero) {

    '<div class="ev-param-label">' + label + (unit ? ' <span style="color:var(--mid-text);font-weight:400">(' + unit + ')</span>' : '') + '</div>' +
    '<div style="display:flex;align-items:center;gap:0.6rem">' +
      '<input class="tool-input ev-param-input" id="' + id + '" type="number" value="' + def + '" step="' + (id === 'ev-ph' ? '0.1' : '1') + '"' +
        ' data-acc-lo="' + accLo + '" data-acc-hi="' + accHi + '" data-ide-lo="' + ideLo + '" data-ide-hi="' + ideHi + '" data-zero="' + (isZero ? 'true' : 'false') + '"' +
        ' oninput="evParamFeedback(this)">' +
      '<span class="tool-unit">' + unit + '</span>' +
      '<span class="ev-param-status" id="' + id + '-status"></span>' +
    '</div>' +
  '</div>';
