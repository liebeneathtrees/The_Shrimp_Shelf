<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Shrimp Shelf — Freshwater Shrimp Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --blue-deep:    #0a1828;
  --blue-mid:     #0e2240;
  --blue-panel:   #122a50;
  --sapphire:     #2a5298;
  --cerulean:     #4a9fd4;
  --cerulean-lt:  #7ec0e8;
  --cerulean-pale:#d0eaf8;
  --sand:         #f7f4ef;
  --sand-dark:    #ede8e0;
  --gold:         #c9a84c;
  --gold-pale:    #f7f0dc;
  --moss:         #4a8a6a;
  --moss-pale:    #e0f0e8;
  --white:        #ffffff;
  --mid-text:     #5a6e85;
  --light-text:   #8aa0bb;
  --border:       rgba(42,82,152,0.12);
  --border-soft:  rgba(42,82,152,0.06);
  --sidebar-w:    245px;
  --ease:         cubic-bezier(0.4,0,0.2,1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--blue-deep);
  color: var(--blue-deep);
  min-height: 100vh;
  display: flex;
  overflow-x: hidden;
}

/* ── SIDEBAR ─────────────────────────────────────────── */
.sidebar {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: var(--sidebar-w);
  background: linear-gradient(180deg, #0a1828 0%, #0e2240 60%, #0a1e3a 100%);
  border-right: 1px solid rgba(74,159,212,0.13);
  display: flex;
  flex-direction: column;
  z-index: 200;
  transition: transform 0.32s var(--ease);
  overflow-y: auto;
  overflow-x: hidden;
}

.sidebar::-webkit-scrollbar { width: 3px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: rgba(74,159,212,0.2); border-radius: 2px; }

/* Bubbles in sidebar */
.sidebar-bubbles {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

.sidebar-brand {
  padding: 1.5rem 1.25rem 1.1rem;
  border-bottom: 1px solid rgba(74,159,212,0.1);
  position: relative;
  z-index: 1;
}

.brand-name {
  font-family: 'Lora', serif;
  font-size: 1.2rem;
  font-weight: 600;
  color: var(--white);
  letter-spacing: -0.01em;
  line-height: 1.2;
}

.brand-tag {
  font-size: 0.67rem;
  color: var(--cerulean-lt);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-top: 0.2rem;
  font-weight: 400;
  opacity: 0.85;
}

.brand-shimmer {
  height: 2px;
  margin-top: 0.85rem;
  background: linear-gradient(90deg,
    transparent,
    var(--cerulean) 25%,
    var(--cerulean-lt) 50%,
    var(--cerulean) 75%,
    transparent);
  background-size: 200% 100%;
  animation: shimmer 4s linear infinite;
  border-radius: 2px;
}

@keyframes shimmer {
  0%   { background-position: 200% center; }
  100% { background-position: -200% center; }
}

.sidebar-section-label {
  font-size: 0.58rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.25);
  padding: 1rem 1.25rem 0.3rem;
  font-weight: 500;
  position: relative;
  z-index: 1;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.52rem 1.25rem;
  cursor: pointer;
  transition: background 0.18s;
  border-left: 2px solid transparent;
  position: relative;
  z-index: 1;
}

.nav-item:hover { background: rgba(74,159,212,0.08); }
.nav-item.active {
  background: rgba(74,159,212,0.15);
  border-left-color: var(--cerulean);
}

.nav-icon { font-size: 0.9rem; width: 1.2rem; text-align: center; flex-shrink: 0; }
.nav-label { font-size: 0.81rem; color: rgba(255,255,255,0.65); flex: 1; }
.nav-item.active .nav-label,
.nav-item:hover .nav-label { color: var(--white); }
.nav-item.active .nav-label { font-weight: 500; }
.nav-num {
  font-family: 'DM Mono', monospace;
  font-size: 0.58rem;
  color: rgba(255,255,255,0.18);
}
.nav-item.active .nav-num { color: var(--cerulean-lt); }

.sidebar-footer {
  margin-top: auto;
  padding: 1rem 1.25rem;
  border-top: 1px solid rgba(74,159,212,0.08);
  font-size: 0.67rem;
  color: rgba(255,255,255,0.2);
  line-height: 1.5;
  position: relative;
  z-index: 1;
}

/* ── BUBBLES ─────────────────────────────────────────── */
.bubble {
  position: absolute;
  bottom: -20px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(74,159,212,0.35), rgba(74,159,212,0.04));
  border: 1px solid rgba(74,159,212,0.22);
  animation: rise linear infinite;
}

@keyframes rise {
  0%   { transform: translateY(0) scale(1);      opacity: 0; }
  8%   { opacity: 0.9; }
  92%  { opacity: 0.5; }
  100% { transform: translateY(-105vh) scale(1.06); opacity: 0; }
}

/* ── OVERLAY ─────────────────────────────────────────── */
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 199;
  opacity: 0;
  transition: opacity 0.3s;
}
.sidebar-overlay.visible { opacity: 1; }

/* ── MAIN ────────────────────────────────────────────── */
.main {
  margin-left: var(--sidebar-w);
  flex: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--sand);
}

.topbar {
  display: none;
  align-items: center;
  gap: 1rem;
  padding: 0.85rem 1.25rem;
  background: linear-gradient(135deg, #0a1828, #0e2240);
  position: sticky;
  top: 0;
  z-index: 50;
  border-bottom: 1px solid rgba(74,159,212,0.15);
}

.topbar-brand {
  font-family: 'Lora', serif;
  font-size: 1rem;
  color: var(--white);
  font-weight: 600;
}

.menu-btn {
  background: none;
  border: none;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 4px;
}
.menu-btn span { display: block; width: 20px; height: 2px; background: var(--white); border-radius: 2px; }

/* ── PAGES ───────────────────────────────────────────── */
.page { display: none; flex-direction: column; min-height: 100vh; animation: fadeIn 0.28s var(--ease); }
.page.active { display: flex; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── PAGE HEADER ─────────────────────────────────────── */
.page-header {
  background: linear-gradient(135deg, #0a1828 0%, #122a50 60%, #0e2240 100%);
  padding: 2.5rem 2.5rem 2rem;
  position: relative;
  overflow: hidden;
}

/* Bubbles container inside page header */
.header-bubbles {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

/* Shimmer line at bottom of header */
.page-header::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg,
    transparent,
    var(--cerulean) 25%,
    var(--cerulean-lt) 50%,
    var(--cerulean) 75%,
    transparent);
  background-size: 200% 100%;
  animation: shimmer 4s linear infinite;
  z-index: 2;
}

.page-eyebrow {
  font-size: 0.63rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--cerulean-lt);
  font-weight: 500;
  margin-bottom: 0.5rem;
  position: relative;
  z-index: 1;
}

.page-title {
  font-family: 'Lora', serif;
  font-size: 1.9rem;
  font-weight: 600;
  color: var(--white);
  letter-spacing: -0.02em;
  line-height: 1.15;
  position: relative;
  z-index: 1;
}

.page-subtitle {
  margin-top: 0.45rem;
  font-size: 0.87rem;
  color: rgba(255,255,255,0.48);
  max-width: 58ch;
  line-height: 1.55;
  font-weight: 300;
  position: relative;
  z-index: 1;
}

/* ── PAGE BODY ───────────────────────────────────────── */
.page-body {
  padding: 2rem 2.5rem;
  flex: 1;
  max-width: 880px;
  background: var(--sand);
}

/* ── PAGE NAV ────────────────────────────────────────── */
.page-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.1rem 2.5rem;
  border-top: 1px solid var(--border);
  margin-top: auto;
  gap: 1rem;
  background: var(--sand);
}

.page-nav-btn {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 1rem;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.79rem;
  color: var(--blue-deep);
  transition: border-color 0.18s, box-shadow 0.18s;
}

.page-nav-btn:hover {
  border-color: var(--cerulean);
  box-shadow: 0 2px 8px rgba(74,159,212,0.18);
}

.page-nav-btn.primary {
  background: var(--sapphire);
  border-color: var(--sapphire);
  color: var(--white);
}

.page-nav-btn.primary:hover {
  background: #3a69b8;
  box-shadow: 0 2px 10px rgba(42,82,152,0.35);
}

.page-nav-btn.invisible { opacity: 0; pointer-events: none; }

.nav-btn-inner { display: flex; flex-direction: column; line-height: 1.2; }
.nav-btn-label { font-size: 0.62rem; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.08em; }
.nav-btn-title { font-weight: 500; font-size: 0.8rem; }
.page-indicator { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--mid-text); }

/* ── CONTENT COMPONENTS ──────────────────────────────── */
.section-heading {
  font-family: 'Lora', serif;
  font-size: 1.15rem;
  font-weight: 600;
  color: var(--blue-deep);
  margin: 2rem 0 0.7rem;
  padding-bottom: 0.35rem;
  border-bottom: 1px solid var(--border);
}
.section-heading:first-child { margin-top: 0; }

.prose { font-size: 0.88rem; line-height: 1.75; color: #3a4e65; max-width: 70ch; }
.prose + .prose { margin-top: 0.7rem; }

.info-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.1rem 1.3rem;
  margin: 0.85rem 0;
  box-shadow: 0 1px 6px rgba(42,82,152,0.06);
}
.info-card-title { font-weight: 600; font-size: 0.86rem; color: var(--blue-deep); margin-bottom: 0.3rem; }
.info-card-body  { font-size: 0.82rem; color: var(--mid-text); line-height: 1.6; }

.highlight-box {
  border-radius: 10px;
  padding: 0.95rem 1.2rem;
  margin: 0.85rem 0;
  font-size: 0.85rem;
  line-height: 1.65;
}
.highlight-box.blue  { background: rgba(208,234,248,0.55); border-left: 3px solid var(--sapphire); color: #1a3055; }
.highlight-box.gold  { background: var(--gold-pale);       border-left: 3px solid var(--gold);     color: #5a3e10; }
.highlight-box.moss  { background: var(--moss-pale);        border-left: 3px solid var(--moss);     color: #2e4a38; }
.highlight-box.water { background: rgba(74,159,212,0.08);  border-left: 3px solid var(--cerulean); color: var(--blue-deep); }

.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 0.7rem;
  margin: 1rem 0;
}
.stat-pill {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.85rem 1rem;
  text-align: center;
  box-shadow: 0 1px 4px rgba(42,82,152,0.05);
}
.stat-pill-value { font-family: 'DM Mono', monospace; font-size: 1rem; font-weight: 500; color: var(--sapphire); }
.stat-pill-label { font-size: 0.68rem; color: var(--mid-text); margin-top: 0.12rem; text-transform: uppercase; letter-spacing: 0.08em; }

.species-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
  gap: 1rem;
  margin: 1rem 0;
}
.species-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.2rem;
  transition: box-shadow 0.18s, transform 0.18s;
  box-shadow: 0 1px 6px rgba(42,82,152,0.06);
}
.species-card:hover {
  box-shadow: 0 6px 20px rgba(42,82,152,0.14);
  transform: translateY(-2px);
}
.species-emoji { font-size: 1.7rem; margin-bottom: 0.45rem; display: block; }
.species-name  { font-family: 'Lora', serif; font-size: 0.93rem; font-weight: 600; color: var(--blue-deep); margin-bottom: 0.08rem; }
.species-latin { font-size: 0.7rem; color: var(--mid-text); font-style: italic; margin-bottom: 0.55rem; }
.species-tag   { display: inline-block; font-size: 0.63rem; padding: 0.12rem 0.5rem; border-radius: 20px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.07em; }
.tag-neo    { background: rgba(42,82,152,0.1);   color: var(--sapphire); }
.tag-ghost  { background: rgba(74,138,106,0.12); color: var(--moss); }
.tag-bamboo { background: var(--gold-pale);       color: #8a6020; }

.data-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin: 1rem 0; border-radius: 10px; overflow: hidden; }
.data-table th {
  text-align: left; padding: 0.55rem 0.9rem;
  background: linear-gradient(135deg, #0a1828, #122a50);
  color: rgba(255,255,255,0.85); font-weight: 500; font-size: 0.73rem; letter-spacing: 0.05em;
}
.data-table td { padding: 0.52rem 0.9rem; border-bottom: 1px solid var(--border-soft); color: #3a4e65; background: var(--white); vertical-align: top; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:nth-child(even) td { background: rgba(208,234,248,0.2); }

.video-wrap {
  position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;
  border-radius: 12px; background: var(--blue-deep); margin: 0.85rem 0;
  box-shadow: 0 4px 24px rgba(10,24,40,0.25);
}
.video-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; border-radius: 12px; }

.watch-first {
  background: linear-gradient(135deg, #0a1828 0%, #122a50 100%);
  border: 1px solid rgba(74,159,212,0.2);
  border-radius: 14px;
  padding: 1.2rem 1.4rem 1.3rem;
  margin-bottom: 1.75rem;
  position: relative;
  overflow: hidden;
}

/* Mini bubbles in watch-first card */
.watch-first-bubbles {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

.watch-first-label { font-size: 0.63rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--cerulean-lt); font-weight: 500; margin-bottom: 0.3rem; position: relative; z-index: 1; }
.watch-first-title { font-family: 'Lora', serif; font-size: 1rem; color: var(--white); margin-bottom: 0.25rem; position: relative; z-index: 1; }
.watch-first-desc  { font-size: 0.79rem; color: rgba(255,255,255,0.45); margin-bottom: 0.8rem; position: relative; z-index: 1; }
.watch-first .video-wrap { position: relative; z-index: 1; }

.stub-wrap {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 4rem 2rem; text-align: center; gap: 0.7rem;
}
.stub-icon  { font-size: 2.8rem; }
.stub-title { font-family: 'Lora', serif; font-size: 1.15rem; color: var(--blue-deep); font-weight: 600; }
.stub-body  { font-size: 0.84rem; color: var(--mid-text); max-width: 38ch; line-height: 1.6; }
.stub-badge {
  display: inline-block;
  background: rgba(42,82,152,0.1);
  color: var(--sapphire);
  font-size: 0.69rem;
  padding: 0.2rem 0.7rem;
  border-radius: 20px;
  font-weight: 500;
}

.reveal { opacity: 0; transform: translateY(14px); transition: opacity 0.48s var(--ease), transform 0.48s var(--ease); }
.reveal.visible { opacity: 1; transform: translateY(0); }

.faq-list { margin: 0.5rem 0; }
.faq-item { border-bottom: 1px solid var(--border-soft); }
.faq-item:last-child { border-bottom: none; }
.faq-question {
  width: 100%; background: none; border: none; text-align: left;
  padding: 0.95rem 0.2rem; font-family: 'Lora', serif; font-size: 0.93rem;
  font-weight: 600; color: var(--blue-deep); cursor: pointer;
  display: flex; justify-content: space-between; align-items: center;
  gap: 0.75rem; transition: color 0.15s;
}
.faq-question:hover { color: var(--sapphire); }
.faq-chevron {
  font-size: 0.7rem; color: var(--cerulean); flex-shrink: 0;
  transition: transform 0.25s var(--ease);
  width: 20px; height: 20px; display: flex; align-items: center;
  justify-content: center; border: 1px solid rgba(74,159,212,0.3);
  border-radius: 50%; background: rgba(74,159,212,0.06);
}
.faq-item.open .faq-chevron { transform: rotate(180deg); }
.faq-answer { max-height: 0; overflow: hidden; transition: max-height 0.4s var(--ease); }
.faq-item.open .faq-answer { max-height: 1200px; }
.faq-answer-inner {
  padding: 0 0.2rem 1rem;
  font-size: 0.85rem; color: var(--mid-text); line-height: 1.75;
  border-top: 1px solid var(--border-soft);
  padding-top: 0.75rem;
}

/* ── RESPONSIVE ──────────────────────────────────────── */
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay { display: block; }
  .main { margin-left: 0; }
  .topbar { display: flex; }
  .page-header { padding: 1.5rem 1.25rem 1.25rem; }
  .page-title { font-size: 1.5rem; }
  .page-body { padding: 1.25rem; }
  .page-nav { padding: 1rem 1.25rem; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (prefers-reduced-motion: reduce) {
  .bubble { animation: none; display: none; }
  .brand-shimmer, .page-header::after { animation: none; }
  .reveal { opacity: 1; transform: none; transition: none; }
  .page { animation: none; }
}
</style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-bubbles" id="sidebarBubbles"></div>
  <div class="sidebar-brand">
    <div class="brand-name">The Shrimp Shelf <span id="appVersionBadge" style="font-size:0.5rem;font-weight:600;vertical-align:super;color:#4a9fd4;opacity:0.9">V1.0</span></div>
    <div class="brand-tag">Freshwater Shrimp Guide</div>
    <div class="brand-shimmer"></div>
  </div>
  <nav id="sidebarNav"></nav>
  <div class="sidebar-footer">
    A hobbyist reference for freshwater shrimp keepers. For educational purposes.
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <button class="menu-btn" onclick="openSidebar()" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
    <span class="topbar-brand">The Shrimp Shelf <span id="topbarVersionBadge" style="font-size:0.6rem;font-weight:600;vertical-align:super;opacity:0.75">V1.0</span></span>
  </div>
  <div id="pages-container"></div>
</main>

<script>
const PAGES = [
  {
    id: 'welcome',
    icon: '🦐',
    title: 'Welcome',
    eyebrow: 'Getting Started',
    heading: 'Small tanks, big reward',
    subtitle: 'A complete guide to keeping and breeding freshwater shrimp — from your first cherry red to a thriving colony.',
    type: 'welcome'
  },
  {
    id: 'species',
    icon: '🔬',
    title: 'Species Profiles',
    eyebrow: 'Who\'s in the tank',
    heading: 'Species Profiles',
    subtitle: 'Neocaridina colour forms, Ghost Shrimp, and Bamboo/Vampire Shrimp — care requirements, grading, and what makes each one tick.',
    type: 'species'
  },
  {
    id: 'parameters',
    icon: '💧',
    title: 'Water Parameters',
    eyebrow: 'Water chemistry',
    heading: 'Water Parameters',
    subtitle: 'The numbers that keep your shrimp alive and breeding. Visual ranges, what each parameter does, and what goes wrong when it drifts.',
    type: 'parameters'
  },
  {
    id: 'setup',
    icon: '🪨',
    title: 'Tank Setup',
    eyebrow: 'Building your tank',
    heading: 'Tank Setup',
    subtitle: 'Tank size, filtration, substrate choices, cycling, and hardscape — everything you need before the shrimp go in.',
    type: 'setup'
  },
  {
    id: 'plants',
    icon: '🌿',
    title: 'Plants & Décor',
    eyebrow: 'Green things',
    heading: 'Plants & Décor',
    subtitle: 'Shrimp-safe plants, moss walls, botanicals, and surfaces that grow the biofilm shrimp actually live on.',
    type: 'plants'
  },
  {
    id: 'feeding',
    icon: '🍃',
    title: 'Feeding',
    eyebrow: 'What they eat',
    heading: 'Feeding',
    subtitle: 'Staple foods, protein sources, blanched vegetables, feeding schedule, and why biofilm is the real foundation of a shrimp diet.',
    type: 'feeding'
  },

<script>
'use strict';

var APP_VERSION = 'V1.0';

let currentPageId = PAGES[0].id;

// ── BUBBLES ───────────────────────────────────────────
function buildBubbles(containerId, count) {
  const wrap = document.getElementById(containerId);
  if (!wrap) return;
  for (let i = 0; i < count; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const s        = Math.random() * 18 + 5;
    const duration = Math.random() * 14 + 9;
    const left     = Math.random() * 100;
    const startOff = Math.random() * 80;
    b.style.cssText = 'width:' + s + 'px;height:' + s + 'px;left:' + left + '%;animation-duration:' + duration + 's;animation-delay:-' + (startOff / 100 * duration) + 's;';
    wrap.appendChild(b);
  }
}

// ── SIDEBAR ───────────────────────────────────────────
function buildSidebar() {
  const nav = document.getElementById('sidebarNav');
  const sections = [
    { label: 'Reference', ids: ['species','parameters','setup','plants','feeding','naturals','breeding','health','compatibility'] },
    { label: 'Tools',     ids: ['evaluator'] },
    { label: 'Help',      ids: ['troubleshooting','glossary'] }
  ];

  nav.innerHTML = pageNavItem(PAGES[0], 0);

  sections.forEach(function(section) {
    const sectionPages = PAGES.filter(function(p) { return section.ids.includes(p.id); });
    if (!sectionPages.length) return;
    const labelEl = document.createElement('div');
    labelEl.className = 'sidebar-section-label';
    labelEl.textContent = section.label;
    nav.appendChild(labelEl);
    sectionPages.forEach(function(p) {
      const idx = PAGES.findIndex(function(pg) { return pg.id === p.id; });
      const div = document.createElement('div');
      div.innerHTML = pageNavItem(p, idx);
      nav.appendChild(div.firstElementChild);
    });
  });
}

function pageNavItem(p, i) {
  return '<div class="nav-item" data-id="' + p.id + '" onclick="navigateTo(\'' + p.id + '\')">' +
    '<span class="nav-icon">' + p.icon + '</span>' +
    '<span class="nav-label">' + p.title + '</span>' +
    '<span class="nav-num">' + String(i + 1).padStart(2, '0') + '</span>' +
    '</div>';
}

function setActiveNav(id) {
  document.querySelectorAll('.nav-item')
    .forEach(function(el) { el.classList.toggle('active', el.dataset.id === id); });
}

// ── NAVIGATION ────────────────────────────────────────
function navigateTo(id) {
  if (id === currentPageId) { closeSidebar(); return; }
  document.getElementById('page-' + currentPageId).classList.remove('active');
  const target = document.getElementById('page-' + id);
  if (!target) return;
  target.classList.add('active');
  currentPageId = id;
  setActiveNav(id);
  closeSidebar();
  window.scrollTo(0, 0);
  // Rebuild header bubbles for newly shown page
  const hb = target.querySelector('.header-bubbles');
  if (hb && !hb.dataset.built) {
    buildBubbles(hb.id, 18);
    hb.dataset.built = '1';
  }
  setTimeout(triggerReveal, 60);
}

function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  const ov = document.getElementById('sidebarOverlay');
  ov.style.display = 'block';
  requestAnimationFrame(function() { ov.classList.add('visible'); });
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  const ov = document.getElementById('sidebarOverlay');
  ov.classList.remove('visible');
  setTimeout(function() { if (!ov.classList.contains('visible')) ov.style.display = 'none'; }, 300);
}

// ── PAGE NAV ──────────────────────────────────────────
function buildPageNav(index) {
  const prev = PAGES[index - 1];
  const next = PAGES[index + 1];
  const prevBtn = prev
    ? '<button class="page-nav-btn" onclick="navigateTo(\'' + prev.id + '\')">&#8592; <span class="nav-btn-inner"><span class="nav-btn-label">Previous</span><span class="nav-btn-title">' + prev.title + '</span></span></button>'
    : '<button class="page-nav-btn invisible">&#8592;</button>';
  const nextBtn = next
    ? '<button class="page-nav-btn primary" onclick="navigateTo(\'' + next.id + '\')"><span class="nav-btn-inner"><span class="nav-btn-label">Next</span><span class="nav-btn-title">' + next.title + '</span></span> &#8594;</button>'
    : '<button class="page-nav-btn invisible">&#8594;</button>';
  return '<div class="page-nav">' + prevBtn + '<span class="page-indicator">' + (index + 1) + ' / ' + PAGES.length + '</span>' + nextBtn + '</div>';
}

function buildPageHeader(p, index) {
  const bubbleId = 'hbubbles-' + p.id;
  return '<div class="page-header">' +
    '<div class="header-bubbles" id="' + bubbleId + '"></div>' +
    '<div class="page-eyebrow">' + (p.eyebrow || '') + '</div>' +
    '<h1 class="page-title">' + (p.heading || p.title) + '</h1>' +
    (p.subtitle ? '<p class="page-subtitle">' + p.subtitle + '</p>' : '') +
    '</div>';
}

// ── STUB ──────────────────────────────────────────────
function renderStub(p) {
  return '<div class="page-body"><div class="stub-wrap reveal">' +
    '<div class="stub-icon">' + (p.stubIcon || p.icon) + '</div>' +

}

// ── WELCOME ───────────────────────────────────────────
function renderWelcome() {
  return '<div class="page-body">' +
    '<div class="highlight-box blue reveal"><strong>Welcome to The Shrimp Shelf</strong> — a hobbyist reference built around one of the most rewarding things you can keep in a small tank: freshwater dwarf shrimp. Whether you\'re setting up your first 5-gallon or troubleshooting a colony that won\'t breed, this guide has you covered.</div>' +
    '<h2 class="section-heading reveal">What this guide covers</h2>' +
    '<p class="prose reveal">The Shrimp Shelf focuses on three groups of freshwater shrimp well-suited to home aquariums: <strong>Neocaridina</strong> (cherry, blue dream, bloody mary, and their many colour forms), <strong>Ghost Shrimp</strong> (peaceful, transparent, and often overlooked as a beginner species), and <strong>Bamboo / Vampire Shrimp</strong> (the gentle filter-feeders that reward a mature, well-planted tank).</p>' +
    '<p class="prose reveal">Each section stands alone — jump to what you need. The Tank Evaluator is fully interactive and works offline — enter your parameters, run a scored assessment, and download a formatted report with predictive warnings.</p>' +
    '<h2 class="section-heading reveal">Which shrimp is right for you?</h2>' +
    '<div class="species-grid">' +
      '<div class="species-card reveal"><span class="species-emoji">🦐</span><div class="species-name">Neocaridina</div><div class="species-latin">Neocaridina davidi &amp; forms</div><span class="species-tag tag-neo">Beginner</span><p class="info-card-body" style="margin-top:0.6rem;font-size:0.8rem;">Hardy, colourful, and forgiving of imperfect water. The best starting point for any new shrimp keeper. Available in dozens of colour forms from cherry red to deep sapphire blue.</p></div>' +
      '<div class="species-card reveal"><span class="species-emoji">👻</span><div class="species-name">Ghost Shrimp</div><div class="species-latin">Palaemonetes paludosus</div><span class="species-tag tag-ghost">Easy</span><p class="info-card-body" style="margin-top:0.6rem;font-size:0.8rem;">Completely transparent, active, and inexpensive. Often sold as feeder shrimp but make fascinating display animals. Excellent cleaners and peaceful with most tank mates.</p></div>' +
      '<div class="species-card reveal"><span class="species-emoji">🎋</span><div class="species-name">Bamboo Shrimp</div><div class="species-latin">Atyopsis moluccensis</div><span class="species-tag tag-bamboo">Intermediate</span><p class="info-card-body" style="margin-top:0.6rem;font-size:0.8rem;">Filter-feeders that fan particles from the water column. Require a mature, established tank with good flow. Striking and peaceful — a rewarding intermediate species.</p></div>' +
    '</div>' +
    '<h2 class="section-heading reveal">A note on substrates</h2>' +
    '<div class="highlight-box water reveal">Unlike the Walstad method, The Shrimp Shelf recommends <strong>inert substrates</strong> for Neocaridina tanks. Active substrates can drive pH down over time, destabilising the neutral-to-slightly-alkaline water chemistry Neocaridina thrive in. Stability matters more than any single parameter value — inert substrates make that stability easy to achieve and maintain.</div>' +
    '<h2 class="section-heading reveal">How to use this guide</h2>' +
    '<div class="stat-grid">' +
      '<div class="stat-pill reveal"><div class="stat-pill-value">01</div><div class="stat-pill-label">Read Tank Setup first</div></div>' +
      '<div class="stat-pill reveal"><div class="stat-pill-value">02</div><div class="stat-pill-label">Check Water Parameters</div></div>' +
      '<div class="stat-pill reveal"><div class="stat-pill-value">03</div><div class="stat-pill-label">Pick your species</div></div>' +
      '<div class="stat-pill reveal"><div class="stat-pill-value">04</div><div class="stat-pill-label">Run Tank Evaluator</div></div>' +
    '</div>' +
  '</div>';
}

// ── TANK SETUP ────────────────────────────────────────
function renderSetup() {
  return '<div class="page-body">' +
    '<div class="watch-first reveal">' +
      '<div class="watch-first-bubbles" id="wfBubbles"></div>' +
      '<div class="watch-first-label">&#128250; Watch First</div>' +
      '<div class="watch-first-title">Beginner Shrimp Tank Setup</div>' +
      '<div class="watch-first-desc">A great visual walkthrough before diving into the written guide below.</div>' +
      '<div class="video-wrap"><iframe src="https://www.youtube.com/embed/nTbYQqX8He0" title="Beginner Shrimp Tank Setup" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>' +
    '</div>' +
    '<h2 class="section-heading reveal">Tank size</h2>' +
    '<p class="prose reveal">Neocaridina can survive in tanks as small as 2.5 gallons, but <strong>5–10 gallons is the sweet spot</strong> for a beginner colony. Larger water volume means slower parameter swings — the single biggest cause of shrimp deaths is sudden chemistry change, and a bigger tank forgives the mistakes that would be fatal in a nano.</p>' +
    '<div class="highlight-box gold reveal"><strong>Minimum recommendation:</strong> 5 gallons for Neocaridina. 10 gallons for Ghost Shrimp. 15–20 gallons for Bamboo/Vampire Shrimp, which need established flow and a mature ecosystem.</div>' +
    '<h2 class="section-heading reveal">Filtration</h2>' +
    '<p class="prose reveal">The sponge filter is the standard in shrimp keeping for good reason: biological filtration, gentle flow, and a safe grazing surface — with zero risk of sucking up shrimplets. Pair with an air pump sized for your tank volume.</p>' +
    '<div class="info-card reveal"><div class="info-card-title">Why not a hang-on-back or canister filter?</div><div class="info-card-body">HOB and canister filters pull shrimplets and juveniles into the impeller. If you use one, cover the intake with a pre-filter sponge. For most shrimp tanks, a dual sponge filter provides all the filtration you need at a fraction of the cost.</div></div>' +
    '<h2 class="section-heading reveal">Substrate</h2>' +
    '<p class="prose reveal">For Neocaridina, choose an <strong>inert substrate</strong> — one that does not affect water chemistry. Plain gravel, coarse sand, or crushed lava rock all work well. Avoid active substrates (ADA Amazonia, SL-Aqua, etc.) which buffer pH downward.</p>' +
    '<table class="data-table reveal"><thead><tr><th>Substrate</th><th>pH effect</th><th>Neocaridina?</th><th>Notes</th></tr></thead><tbody>' +
      '<tr><td>Plain gravel</td><td>None</td><td>&#9989; Yes</td><td>Classic choice, easy to find</td></tr>' +
      '<tr><td>Pool filter sand</td><td>None</td><td>&#9989; Yes</td><td>Cheap, natural look, easy to clean</td></tr>' +
      '<tr><td>Crushed lava rock</td><td>None</td><td>&#9989; Yes</td><td>Great biofilm surface</td></tr>' +
      '<tr><td>Fluval Stratum</td><td>Lowers pH</td><td>&#9888;&#65039; Caution</td><td>Designed for Caridina</td></tr>' +
      '<tr><td>ADA Amazonia</td><td>Lowers pH significantly</td><td>&#10060; No</td><td>Active substrate, wrong chemistry</td></tr>' +
      '<tr><td>Coral / crushed coral</td><td>Raises pH/KH</td><td>&#9888;&#65039; Caution</td><td>Can push KH too high</td></tr>' +
    '</tbody></table>' +
    '<h2 class="section-heading reveal">Cycling your tank</h2>' +
    '<p class="prose reveal">Never add shrimp to an uncycled tank. The nitrogen cycle must establish a colony of beneficial bacteria before shrimp go in — ammonia and nitrite are lethal even at very low concentrations. A fishless cycle typically takes 4–6 weeks.</p>' +
    '<div class="highlight-box blue reveal"><strong>Fast cycle tip:</strong> Add a seeded sponge filter or substrate from an established tank. This transfers the bacteria colony and can reduce cycle time to 1–2 weeks. You\'re ready when ammonia and nitrite read 0 ppm after dosing.</div>' +
    '<h2 class="section-heading reveal">Hardscape &amp; cover</h2>' +
    '<p class="prose reveal">Shrimp are prey animals and feel safest with plenty of cover. Driftwood, smooth river stones, cholla wood, and dense plant growth all give shrimp places to hide during vulnerable molts and encourage natural foraging. Indian Almond Leaves (IAL) release tannins, provide a grazing surface, and have mild antibacterial properties.</p>' +
  '</div>';
}

// ── SPECIES PROFILES ──────────────────────────────────
function renderSpecies() {
  return '<div class="page-body">' +

    '<div class="highlight-box water reveal">This guide covers three groups suited to most home aquariums. Neocaridina are the backbone of the hobby — hardy, colourful, and endlessly varied. Ghost Shrimp are underrated and fascinating up close. Bamboo Shrimp reward patience with one of the most unusual feeding behaviours in freshwater.</div>' +

    '<h2 class="section-heading reveal">Neocaridina — Colour Forms</h2>' +
    '<p class="prose reveal">All Neocaridina colour forms are the same species — <em>Neocaridina davidi</em> — selectively bred for specific colours. They interbreed freely, so keep only one colour form per tank unless you want wild-type offspring within a few generations.</p>' +

    '<table class="data-table reveal"><thead><tr><th>Common Name</th><th>Colour</th><th>Grade note</th><th>Difficulty</th></tr></thead><tbody>' +
      '<tr><td><strong>Red Cherry</strong></td><td>Red, translucent to solid</td><td>Sakura &rarr; Fire Red &rarr; Painted Fire Red</td><td>&#9989; Beginner</td></tr>' +
      '<tr><td><strong>Blue Dream</strong></td><td>Deep sapphire to midnight blue</td><td>Higher grades more opaque; colony drifts without culling</td><td>&#9989; Beginner</td></tr>' +
      '<tr><td><strong>Yellow Goldenback</strong></td><td>Yellow with gold dorsal stripe</td><td>Stripe width and colour density vary by line</td><td>&#9989; Beginner</td></tr>' +
      '<tr><td><strong>Snowball</strong></td><td>White, opaque</td><td>Eggs are bright white — easy to spot berried females</td><td>&#9989; Beginner</td></tr>' +
      '<tr><td><strong>Bloody Mary</strong></td><td>Deep red, near-opaque body</td><td>Darker than Fire Red; distinct line from Chocolate</td><td>&#9989; Beginner</td></tr>' +
      '<tr><td><strong>Blue Velvet</strong></td><td>Cerulean blue, translucent</td><td>Lighter than Blue Dream; rili pattern common in lower grades</td><td>&#9989; Beginner</td></tr>' +
      '<tr><td><strong>Chocolate</strong></td><td>Dark brown to near-black</td><td>Ancestral line for several blue and dark colour forms</td><td>&#9989; Beginner</td></tr>' +
      '<tr><td><strong>Orange Sakura</strong></td><td>Orange to burnt orange</td><td>Colour fades on light substrate — use dark sand or gravel</td><td>&#9989; Beginner</td></tr>' +
    '</tbody></table>' +

    '<div class="info-card reveal"><div class="info-card-title">On grading</div><div class="info-card-body">Grades (e.g. Sakura, Fire Red, Painted Fire Red) describe colour density and coverage — not a different species or care requirement. Higher-grade shrimp cost more and look more impressive, but are identical to care for. Without selective culling, a high-grade colony will drift toward lower expression over several generations as recessive traits re-emerge.</div></div>' +

    '<h2 class="section-heading reveal">Neocaridina — Care Parameters</h2>' +
    '<div class="stat-grid">' +
      '<div class="stat-pill reveal"><div class="stat-pill-value">6.8–7.8</div><div class="stat-pill-label">pH range</div></div>' +
      '<div class="stat-pill reveal"><div class="stat-pill-value">7–15</div><div class="stat-pill-label">GH (dGH)</div></div>' +
      '<div class="stat-pill reveal"><div class="stat-pill-value">2–8</div><div class="stat-pill-label">KH (dKH)</div></div>' +
      '<div class="stat-pill reveal"><div class="stat-pill-value">150–250</div><div class="stat-pill-label">TDS (ppm)</div></div>' +
      '<div class="stat-pill reveal"><div class="stat-pill-value">65–78°F</div><div class="stat-pill-label">Temperature</div></div>' +
      '<div class="stat-pill reveal"><div class="stat-pill-value">0 / 0</div><div class="stat-pill-label">Ammonia / Nitrite</div></div>' +
    '</div>' +
    '<div class="highlight-box blue reveal"><strong>The golden rule:</strong> stability beats perfection. A tank that holds steady at pH 7.4 is far safer than one that swings between 7.0 and 7.8. Test your parameters weekly until you know your tank is stable, then monthly.</div>' +

    '<h2 class="section-heading reveal">Ghost Shrimp</h2>' +
    '<p class="prose reveal"><em>Palaemonetes paludosus</em> — often sold in bulk as feeder shrimp, but kept in their own tank they are fascinating, active, and genuinely beautiful in a subtle way. Their completely transparent bodies let you watch organs, food travelling through the gut, and eggs developing in berried females.</p>' +
    '<table class="data-table reveal"><thead><tr><th>Parameter</th><th>Ghost Shrimp</th><th>Notes</th></tr></thead><tbody>' +
      '<tr><td>pH</td><td>6.5–8.0</td><td>Tolerant of a wide range</td></tr>' +
      '<tr><td>Temperature</td><td>65–80°F</td><td>Hardy across a wide band</td></tr>' +
      '<tr><td>GH</td><td>3–15</td><td>Not highly sensitive</td></tr>' +
      '<tr><td>Tank size</td><td>10 gal min</td><td>More active and territorial than Neocaridina</td></tr>' +
      '<tr><td>Max size</td><td>1.5 in</td><td>Larger than Neocaridina; predatory toward very small tank mates</td></tr>' +
    '</tbody></table>' +
    '<div class="info-card reveal"><div class="info-card-title">Ghost Shrimp &amp; breeding</div><div class="info-card-body">Ghost Shrimp will breed in freshwater but larvae require brackish water to survive — making colony expansion in a standard freshwater tank nearly impossible. This is actually useful if you want a display tank without population explosions. Females carry eggs for 3–4 weeks; larvae typically die within days in pure freshwater.</div></div>' +

    '<h2 class="section-heading reveal">Bamboo / Vampire Shrimp</h2>' +
    '<p class="prose reveal"><em>Atyopsis moluccensis</em> (Bamboo) and <em>Atya gabonensis</em> (Vampire/African) are fan-feeders — they extend feathery fans into the current to catch suspended particles. This feeding behaviour makes them unique and captivating to watch, but also means they have very specific care requirements compared to grazing shrimp.</p>' +
    '<div class="highlight-box gold reveal"><strong>Not a beginner species.</strong> Bamboo and Vampire Shrimp need a mature, well-established tank with consistent moderate flow, fine suspended particulate in the water column (from feeding or natural decomposition), and very stable parameters. They will slowly starve in a low-flow or brand-new tank even if other shrimp thrive.</div>' +
    '<table class="data-table reveal"><thead><tr><th>Parameter</th><th>Bamboo/Vampire</th><th>Notes</th></tr></thead><tbody>' +
      '<tr><td>pH</td><td>6.5–7.5</td><td>Softer water preferred</td></tr>' +
      '<tr><td>Temperature</td><td>75–82°F</td><td>Warmer than Neocaridina</td></tr>' +
      '<tr><td>Tank size</td><td>20 gal min</td><td>Needs room and established flow</td></tr>' +
      '<tr><td>Max size</td><td>3–5 in</td><td>Largest of the three groups; fully peaceful</td></tr>' +
      '<tr><td>Feeding</td><td>Fan-feeder</td><td>Powdered foods or strong current; does not graze substrate</td></tr>' +
    '</tbody></table>' +
    '<div class="info-card reveal"><div class="info-card-title">Powdered food tip</div><div class="info-card-body">Broadcast a small pinch of powdered spirulina, crushed flake, or commercial shrimp powder near your Bamboo Shrimp and watch the fans go to work. They will reposition themselves to face the current and spend hours feeding. No direct target-feeding needed — just ensure particulate reaches them.</div></div>' +

  '</div>';
}

// ── PLANTS & DÉCOR ────────────────────────────────────
function renderPlants() {
  return '<div class="page-body">' +

    '<p class="prose reveal">Plants are not optional in a shrimp tank — they are infrastructure. They stabilise parameters, generate the biofilm shrimp graze on constantly, provide cover during vulnerable molts, and create the complex microhabitat that keeps shrimp active and visible rather than hiding in corners.</p>' +

    '<h2 class="section-heading reveal">Mosses</h2>' +
    '<p class="prose reveal">Moss is the single most shrimp-friendly plant category. Its fine structure creates enormous surface area for biofilm, gives shrimplets refuge from larger tank mates, and looks natural in almost any aquascape. All mosses below thrive in low to medium light with no CO2.</p>' +
    '<table class="data-table reveal"><thead><tr><th>Moss</th><th>Growth</th><th>Best use</th><th>Notes</th></tr></thead><tbody>' +
      '<tr><td><strong>Java Moss</strong></td><td>Fast</td><td>Mesh walls, driftwood, substrate mats</td><td>The classic. Tolerates almost any conditions; never fails.</td></tr>' +
      '<tr><td><strong>Christmas Moss</strong></td><td>Medium</td><td>Attached to wood or rock</td><td>Fern-like fronds; tidier appearance than Java.</td></tr>' +
      '<tr><td><strong>Flame Moss</strong></td><td>Slow</td><td>Foreground accent, stones</td><td>Upright spiralling growth; striking and unusual.</td></tr>' +
      '<tr><td><strong>Taiwan Moss</strong></td><td>Medium</td><td>Carpets, walls</td><td>Dense and fine-textured; excellent shrimplet refuge.</td></tr>' +
      '<tr><td><strong>Subwassertang</strong></td><td>Medium</td><td>Free-floating or attached</td><td>Not true moss — a liverwort. Lobed, bright green fronds that shrimp love to pick through.</td></tr>' +
    '</tbody></table>' +

    '<h2 class="section-heading reveal">Stem &amp; Rosette Plants</h2>' +
    '<p class="prose reveal">Fast-growing stem plants are your best ally against algae and ammonia spikes. They outcompete algae for nutrients and provide large leaf surfaces for biofilm development. Choose species rated for your light level — no CO2 injection is needed for any plant on this list.</p>' +
    '<table class="data-table reveal"><thead><tr><th>Plant</th><th>Light</th><th>Growth rate</th><th>Shrimp value</th></tr></thead><tbody>' +
      '<tr><td><strong>Hornwort</strong></td><td>Low–Med</td><td>Very fast</td><td>Excellent biofilm; can be free-floating or planted</td></tr>' +
      '<tr><td><strong>Guppy Grass</strong> (Najas)</td><td>Low–Med</td><td>Very fast</td><td>Shrimplets love hiding in the dense tangle</td></tr>' +
      '<tr><td><strong>Rotala rotundifolia</strong></td><td>Medium</td><td>Fast</td><td>Good biofilm surface; trims easily to control</td></tr>' +
      '<tr><td><strong>Anubias</strong> (all sp.)</td><td>Low</td><td>Very slow</td><td>Shrimp graze on leaves constantly; nearly indestructible</td></tr>' +
      '<tr><td><strong>Java Fern</strong></td><td>Low</td><td>Slow</td><td>Attach to wood or rock — roots rot if buried</td></tr>' +
      '<tr><td><strong>Amazon Sword</strong></td><td>Medium</td><td>Medium</td><td>Large leaves create shade and grazing surface</td></tr>' +
      '<tr><td><strong>Water Sprite</strong></td><td>Low–Med</td><td>Fast</td><td>Floating or planted; fine leaves = excellent biofilm</td></tr>' +
    '</tbody></table>' +

    '<h2 class="section-heading reveal">Floating Plants</h2>' +
    '<p class="prose reveal">Floaters are often overlooked but are among the most useful plants in a shrimp tank. They soften harsh surface light, provide dangling roots for grazing and refuge, and absorb nutrients directly from the water column — helping keep nitrates low between water changes.</p>' +
    '<div class="species-grid">' +
      '<div class="species-card reveal"><span class="species-emoji">🌱</span><div class="species-name">Frogbit</div><div class="species-latin">Limnobium laevigatum</div><p class="info-card-body" style="margin-top:0.5rem;font-size:0.8rem;">Large round leaves, long dangling roots. One of the best shrimp floaters — roots become a biofilm-covered playground.</p></div>' +
      '<div class="species-card reveal"><span class="species-emoji">🌿</span><div class="species-name">Salvinia</div><div class="species-latin">Salvinia natans / minima</div><p class="info-card-body" style="margin-top:0.5rem;font-size:0.8rem;">Velvety textured leaves that trap micro-bubbles. Fast growing — thin regularly to maintain light penetration.</p></div>' +
      '<div class="species-card reveal"><span class="species-emoji">🟢</span><div class="species-name">Duckweed</div><div class="species-latin">Lemna minor</div><p class="info-card-body" style="margin-top:0.5rem;font-size:0.8rem;">The most nutrient-hungry floater — great for high-bioload tanks. Can become invasive; introduce intentionally.</p></div>' +
    '</div>' +

    '<h2 class="section-heading reveal">Botanicals</h2>' +
    '<p class="prose reveal">Botanicals are dried plant material — leaves, pods, bark — added to the tank as they are. They release tannins that soften water, lower pH slightly, and create a natural, tea-coloured environment. More importantly, they decompose slowly into the most nutritious biofilm a shrimp can graze on.</p>' +
    '<table class="data-table reveal"><thead><tr><th>Botanical</th><th>Effect</th><th>Notes</th></tr></thead><tbody>' +
      '<tr><td><strong>Indian Almond Leaf</strong> (IAL / Catappa)</td><td>Tannins, mild antibacterial, biofilm</td><td>The hobby standard. Add 1 small leaf per 10 gal; replace when fully decomposed (~4 weeks).</td></tr>' +
      '<tr><td><strong>Cholla Wood</strong></td><td>Biofilm surface, hardscape</td><td>Hollow skeleton — shrimp explore the inside. Soak 24h before adding.</td></tr>' +
      '<tr><td><strong>Alder Cones</strong></td><td>Mild tannins, biofilm</td><td>Small and unobtrusive. Popular for nano tanks.</td></tr>' +
      '<tr><td><strong>Magnolia Leaves</strong></td><td>Biofilm, leaf litter look</td><td>Dry your own or buy prepared. Large surface area for grazing.</td></tr>' +
      '<tr><td><strong>Coconut Husk / Shell</strong></td><td>Hardscape, refuge, biofilm</td><td>Half-shells create caves; shrimp congregate inside during molts.</td></tr>' +
    '</tbody></table>' +
    '<div class="highlight-box moss reveal"><strong>Boil or not?</strong> Boiling softens botanicals and speeds up the initial tannin release, reducing the water-staining effect. However it also kills surface microorganisms. Many keepers skip boiling and simply rinse — the tannin colour fades within a week and the biofilm establishes faster on unboiled material.</div>' +

  '</div>';
}

// ── FEEDING ───────────────────────────────────────────
function renderFeeding() {
  return '<div class="page-body">' +

    '<div class="highlight-box water reveal">Shrimp in a well-established, planted tank with good biofilm development rarely need supplemental feeding more than 2–3 times per week. Overfeeding is a far more common problem than underfeeding — uneaten food spikes ammonia and destabilises the very parameters that keep shrimp healthy.</div>' +

    '<h2 class="section-heading reveal">Biofilm — the foundation</h2>' +
    '<p class="prose reveal">Biofilm is a thin layer of bacteria, microalgae, protozoans, and organic matter that coats every surface in an established tank. It is the natural diet of dwarf shrimp in the wild, and in a mature tank it provides more nutrition than any commercial food you can add. Shrimp graze on it constantly — watch a healthy shrimp for 30 seconds and you\'ll see it picking at almost every surface it touches.</p>' +
    '<p class="prose reveal">Biofilm is encouraged by: natural driftwood, botanicals, slow-decaying plant matter, live rock or lava rock, moss, and any surface with texture. A bare-bottom tank with plastic decor and pristine glass is biofilm-poor and will require more supplemental feeding than a planted tank with natural hardscape.</p>' +

    '<h2 class="section-heading reveal">Staple foods</h2>' +
    '<table class="data-table reveal"><thead><tr><th>Food type</th><th>Frequency</th><th>Notes</th></tr></thead><tbody>' +
      '<tr><td><strong>Shrimp-specific pellets / wafers</strong></td><td>2–3x per week</td><td>Spirulina-based or mineral-enriched formulas. Hikari Shrimp Cuisine, Glasgarten Bacter AE, and SL-Aqua products are widely used.</td></tr>' +
      '<tr><td><strong>Blanched vegetables</strong></td><td>1–2x per week</td><td>Zucchini, spinach, kale, cucumber. Blanch 1–2 min to soften; remove after 24h to prevent fouling.</td></tr>' +
      '<tr><td><strong>Snowflake food</strong></td><td>2–3x per week</td><td>Dried soybean hulls that expand in water. Shrimp graze on them for hours; slow to foul. A staple for good reason.</td></tr>' +
      '<tr><td><strong>Indian Almond Leaf</strong></td><td>Ongoing</td><td>Leave decomposing leaves in tank — shrimp graze on them continuously.</td></tr>' +
      '<tr><td><strong>Powdered foods</strong></td><td>2x per week</td><td>Especially useful for young shrimplets. Bacter AE, Shrimp King Baby, crushed spirulina tablet.</td></tr>' +
    '</tbody></table>' +

    '<h2 class="section-heading reveal">Protein sources</h2>' +
    '<p class="prose reveal">Shrimp are omnivores and benefit from occasional protein — especially important when females are berried or have recently released shrimplets. Too much protein in a warm, established tank can accelerate bacterial blooms, so keep portions small.</p>' +
    '<div class="species-grid">' +
      '<div class="species-card reveal"><span class="species-emoji">🦟</span><div class="species-name">Freeze-dried bloodworms</div><p class="info-card-body" style="margin-top:0.5rem;font-size:0.8rem;">Small portions, once a week max. Break into tiny pieces — a whole worm is too much for a small tank. Remove any uneaten after a few hours.</p></div>' +
      '<div class="species-card reveal"><span class="species-emoji">🦐</span><div class="species-name">Brine shrimp (frozen)</div><p class="info-card-body" style="margin-top:0.5rem;font-size:0.8rem;">Ironic but true — shrimp eat shrimp. A small portion of frozen brine shrimp 1x per week is an excellent protein supplement.</p></div>' +
      '<div class="species-card reveal"><span class="species-emoji">🥚</span><div class="species-name">Hard-boiled egg yolk</div><p class="info-card-body" style="margin-top:0.5rem;font-size:0.8rem;">A grain-of-rice sized portion occasionally. Rich protein source beloved by shrimp — but watch water quality closely; egg yolk clouds water fast.</p></div>' +
    '</div>' +

    '<h2 class="section-heading reveal">Feeding schedule — a simple starting point</h2>' +
    '<table class="data-table reveal"><thead><tr><th>Day</th><th>Food</th><th>Amount</th></tr></thead><tbody>' +
      '<tr><td>Monday</td><td>Shrimp pellets / wafer</td><td>1 small wafer or 3–4 pellets per 10 shrimp</td></tr>' +
      '<tr><td>Wednesday</td><td>Snowflake food</td><td>Small pinch; remove next day if uneaten</td></tr>' +
      '<tr><td>Friday</td><td>Blanched vegetable</td><td>Coin-sized slice of zucchini or cucumber</td></tr>' +
      '<tr><td>Sunday</td><td>Protein (optional)</td><td>Tiny portion frozen brine shrimp or bloodworm</td></tr>' +
      '<tr><td>Daily</td><td>Biofilm (passive)</td><td>No action needed — let the tank do the work</td></tr>' +
    '</tbody></table>' +

    '<h2 class="section-heading reveal">Overfeeding — the real risk</h2>' +
    '<div class="highlight-box gold reveal"><strong>Remove uneaten food within 24 hours.</strong> Decomposing food drives up ammonia and nitrite, feeds nuisance bacteria, and creates the kind of parameter swing that kills shrimp overnight. When in doubt, feed less. A shrimp that has access to good biofilm will never starve — but it can absolutely die from the ammonia spike caused by a forgotten zucchini slice.</div>' +
    '<p class="prose reveal">Signs you are overfeeding: food sits untouched after several hours, tank develops a smell, algae outbreaks increase, or parameters show elevated ammonia or nitrite between water changes. Cut feeding frequency and quantities in half for two weeks and test again.</p>' +

  '<div class="highlight-box teal reveal" style="cursor:pointer;margin-top:1.5rem" onclick="navigateTo(\x27naturals\x27)">' +
    '<strong>&#127810; See Naturals &amp; Botanicals</strong> &mdash; full guide to food leaves, tannin leaves, alder cones, cholla wood, lotus pods, wild harvesting preparation, and how to manage snail competition at feeding time.' +
  '</div>' +

  '</div>';
}

  return '<div class="page-body">' +

    '<p class="prose reveal">In the wild, shrimp live in streams fed by continuous leaf fall and decomposing plant matter from surrounding trees. Replicating this allochthonous input creates the biofilm foundation, tannin conditioning, and structural complexity that a shrimp tank benefits from enormously. These are not extras \u2014 for many experienced keepers they become the core of tank management.</p>' +

    '<h2 class="section-heading reveal">Food leaves</h2>' +
    '<p class="prose reveal">These leaves are grazed directly by shrimp and snails for their nutritional content. Shrimp consume the softening leaf tissue itself, not just the biofilm growing on it. All are safe for Neocaridina, Ghost Shrimp, and common snails.</p>' +

    leafCard('&#127807;', 'Mulberry', 'Morus sp.', 'Direct food leaf', ['Direct food', 'Wild harvest'],
      'The gold standard of shrimp food leaves. Green mulberry leaves are exceptionally high in protein, vitamins, and minerals \u2014 closer to a supplement than a passive habitat element. Shrimp and snails both devour them with enthusiasm, which creates the competition problem addressed in the section below. Dried leaves soften slowly and buy shrimp more grazing time. Fresh-blanched leaves trigger an immediate feeding frenzy. Wild harvest from unsprayed trees is easy and free; dried leaves store for 12+ months in a sealed jar.') +

    leafCard('&#127810;', 'Guava', 'Psidium guajava', 'Food + tannin leaf', ['Direct food', 'Tannin source', 'Biofilm'],
      'A popular mulberry alternative with a firmer texture that breaks down more slowly, giving snails less of a speed advantage. Provides mild tannin conditioning alongside nutritional value, serving a dual role. Shrimp graze both the leaf tissue and the biofilm that develops as it ages. Widely sold dried in the hobby.') +

    leafCard('&#127807;', 'Stinging Nettle', 'Urtica dioica', 'Mineral-rich food leaf', ['Direct food', 'Wild harvest'],
      'Dried nettle loses its sting completely and becomes a mineral-rich food source high in iron, calcium, and trace elements. Genuinely nutritious rather than just a biofilm substrate. Widely available dried (sold as herbal tea, usually untreated and safe) or wild-harvested in late spring. Its tougher texture gives shrimp more access time than soft mulberry.') +

    leafCard('&#127820;', 'Banana Leaf', 'Musa sp.', 'Food + biofilm leaf', ['Direct food', 'Biofilm'],
      'Large, soft, and eagerly grazed once blanched. Develops good biofilm quickly with a large surface for multiple shrimp to graze simultaneously. Tannin release is minimal so water tinting is negligible. Often available at Asian grocery stores as cooking leaves \u2014 confirm no preservative treatment before use.') +

    leafCard('&#127804;', 'Dandelion Greens', 'Taraxacum officinale', 'Vitamin-rich food leaf', ['Direct food', 'Wild harvest'],
      'One of the most accessible wild forage options \u2014 dandelions grow in nearly every yard and vacant lot in North America. High in calcium, potassium, and beta-carotene, with a reputation among keepers for boosting natural shrimp coloration. Harvest young inner leaves before flowering for the mildest texture. Blanch 1\u20132 minutes to soften; snails and shrimp both graze eagerly, so treat it the same way as mulberry for the competition problem below. Only harvest from lawns you know are pesticide- and herbicide-free.') +

    leafCard('&#127793;', 'Broadleaf Plantain', 'Plantago major / P. lanceolata', 'Fibrous slow-grazing food leaf', ['Direct food', 'Wild harvest'],
      'Not related to the banana-family plantain \u2014 this is the common lawn weed with ribbed, oval leaves. Its fibrous structure holds up well to grazing, giving shrimp and snails 24\u201336 hours of access before it breaks down, longer than soft greens like dandelion. Blanch 2 minutes to break down the leaf\u2019s outer wax coating before adding. As accessible as dandelion \u2014 most temperate lawns have it growing wild.') +

    leafCard('&#127827;', 'Blackberry / Raspberry Leaf', 'Rubus sp.', 'Calcium-rich food leaf', ['Direct food', 'Wild harvest'],
      'A close nutritional cousin to mulberry \u2014 high in calcium and easy to identify by its toothed, three- to five-lobed leaflets. Brambles are common along field edges, fence lines, and woodland margins, making this one of the easier wild leaves to source in quantity. Fresh leaves can be blanched 2\u20133 minutes like mulberry, or dried for longer-lasting grazing. Avoid leaves from cultivated berry patches that may have been sprayed.') +

    leafCard('&#127815;', 'Grape Leaf', 'Vitis sp.', 'Calcium-rich food leaf', ['Direct food', 'Wild harvest'],
      'A long-standing favourite in the shrimp hobby, valued for a firm texture that resists disintegrating into mush the way some soft greens do. Wild grape vines are common in hedgerows and woodland edges across much of North America, and backyard grape vines work equally well if unsprayed. Blanch 2\u20133 minutes; the slightly tougher texture gives shrimp more grazing time than dandelion or plantain before snails take over.') +

    leafCard('&#127795;', 'Loquat Leaf', 'Eriobotrya japonica', 'Food + biofilm leaf', ['Direct food', 'Biofilm', 'Wild harvest'],
      'A thick, leathery leaf similar in role to guava \u2014 common as an ornamental tree across the southern US, which makes it easy to source. The tough texture means it breaks down slowly, developing biofilm over an extended period rather than disappearing in a day or two like soft greens. Boil 5\u201310 minutes to soften slightly and help it sink. A good middle ground between the fast-disappearing green leaves above and the long-lasting botanicals below.') +

    '<h2 class="section-heading reveal">Tannin &amp; biofilm leaves</h2>' +
    '<p class="prose reveal">These leaves condition the water as they break down, releasing tannins and humic acids with mild antibacterial and antifungal properties that replicate the blackwater chemistry many shrimp originate from. Shrimp graze the biofilm that develops on their surfaces \u2014 the nutritional contribution is indirect but sustained.</p>' +

    leafCard('&#127809;', 'Indian Almond / Catappa', 'Terminalia catappa', 'Tannin + biofilm leaf', ['Tannin source', 'Biofilm'],
      'The hobby standard \u2014 widely used and reliably effective. Releases tannins, flavonoids, and humic acids creating a mild blackwater environment that reduces stress and supports beneficial bacterial populations. Shrimplets graze the surface biofilm continuously. One medium leaf per 10 gallons; replace every 4\u20138 weeks. Causes noticeable water tinting \u2014 pre-soak or boil briefly to reduce amber colour.') +

    leafCard('&#127809;', 'Oak', 'Quercus sp.', 'Tannin + biofilm leaf', ['Tannin source', 'Biofilm', 'Wild harvest'],
      'Exceptionally durable \u2014 a single oak leaf can last months. Releases tannins steadily without extreme water darkening. Easy to wild-harvest across North America and Europe from naturally fallen autumn leaves. One of the best options for keepers who want to collect their own without sourcing specialist supplies.') +

    leafCard('&#127810;', 'Beech', 'Fagus sp.', 'Tannin + biofilm leaf', ['Tannin source', 'Biofilm', 'Wild harvest'],
      'Small, smooth, and ideal for nano tanks. Colours the water less than catappa or oak \u2014 a good choice for keepers who prefer clear water. Moderate breakdown pace with good biofilm development. Wild-harvest from fallen autumn leaves across temperate Europe and North America.') +

    leafCard('&#127807;', 'Birch', 'Betula sp.', 'Tannin + biofilm leaf', ['Tannin source', 'Biofilm', 'Wild harvest'],
      'Small leaf size means precise dosing for nano tanks \u2014 one or two at a time is sufficient. Releases milder tannins than catappa with minimal water colouring. Wild-harvest from dry fallen autumn leaves.') +

    leafCard('&#127807;', 'Jackfruit', 'Artocarpus heterophyllus', 'Tannin + biofilm leaf', ['Tannin source', 'Biofilm'],
      'Firm texture and slow decomposition make jackfruit leaves one of the longest-lasting options. Good biofilm development over weeks. Widely sold dried in the shrimp hobby. Useful when you want a persistent biofilm surface that needs infrequent replacement.') +

    leafCard('&#127792;', 'Hazel / Hornbeam Leaf', 'Corylus sp. / Carpinus sp.', 'Tannin + biofilm leaf', ['Tannin source', 'Biofilm', 'Wild harvest'],
      'A gentler alternative to oak or beech, releasing mild tannins with minimal water tinting. Widely available across temperate North America and Europe as both an ornamental hedge planting and a woodland understory tree, making it easy to source without hunting for a specific specimen. Moderate breakdown pace with steady biofilm development \u2014 a good rotation partner alongside beech or birch for keepers who like to vary their leaf litter.') +

    '<h2 class="section-heading reveal">Botanicals &amp; natural structures</h2>' +
    '<p class="prose reveal">Botanicals are the woody, structural elements \u2014 cones, pods, and wood \u2014 that provide long-lasting biofilm surfaces, release tannins slowly, and create habitat complexity. They become active foraging zones as biofilm colonises their surfaces.</p>' +

    botanicalCard('&#127794;', 'Alder Cones', 'Alnus sp. \u2014 highest tannin content per unit size',
      'The most tannin-dense botanical in common use. Small, easy to dose precisely, and highly effective at growing dense biofilm in the gaps between cone scales \u2014 creating sheltered microhabitat that shrimp and shrimplets pick through continuously. Can gently lower pH in soft water; monitor carefully in Neocaridina tanks. Start with 1 cone per 5\u201310 gallons. Rinse before adding; brief boiling helps them sink. Replace monthly but leave spent cones in place \u2014 still productive biofilm surfaces.') +

    botanicalCard('&#127807;', 'Casuarina Cones', 'Casuarina sp. \u2014 she-oak cones',

    botanicalCard('&#129683;', 'Cholla Wood', 'Opuntia sp. skeleton \u2014 hollow tubular foraging structure',
      'The skeletal remains of a cactus \u2014 hollow, tubular, and unlike any other botanical. Shrimplets actively enter through openings along its length, foraging on the biofilm that develops on the inner wall surfaces. No other hardscape item provides this enclosed navigable interior space. Shrimp spend notable time inside cholla. Decomposes fully over several months. Safe for all Neocaridina and snails.') +

    botanicalCard('&#127800;', 'Lotus Seed Pods', 'Nelumbo sp. \u2014 architectural biofilm hardscape',
      'The honeycomb cavity structure creates dozens of individual recesses that each develop their own biofilm at different rates \u2014 turning one botanical into a multi-zone foraging landscape. Tannin release is mild and diminishes after the first week; the pod\'s role is primarily structural thereafter. Shrimp work across all surfaces continuously. Long-lasting \u2014 the woody tissue decomposes very slowly.') +

    botanicalCard('&#127802;', 'Southern Magnolia Leaf', 'Magnolia grandiflora \u2014 long-term structural shelter',
      'The most durable leaf option in this guide by a wide margin. Extremely thick and waxy, Southern Magnolia leaves can last three to six months or longer submerged without breaking down into debris \u2014 functioning more as a piece of structural hardscape than a consumable food or fast-cycling tannin source. Biofilm develops slowly across the waxy surface, providing a long, low-maintenance grazing zone that doesn\'t need frequent replacement. Common as a landscaping tree across the southern US. Boil 10\u201315 minutes to strip the surface wax and force the leaf to sink \u2014 without this step it will float indefinitely.') +

    '<h2 class="section-heading reveal">Wild harvesting &amp; preparation</h2>' +
    '<p class="prose reveal">Wild-harvested leaves are free, sustainable, and often fresher than purchased dried stock. The key requirements are correct identification, a clean source location, and proper preparation before adding to the tank.</p>' +

    '<h3 class="section-heading reveal" style="font-size:1rem;margin-bottom:0.5rem">Sourcing safely</h3>' +
    '<ul class="species-list reveal">' +
      '<li><strong>Know the tree.</strong> Oak, beech, birch, and mulberry are distinctive and easy to identify confidently. Do not harvest from trees you cannot positively identify.</li>' +
      '<li><strong>Avoid contaminated sites.</strong> Never collect from roadsides, golf courses, maintained parks, or orchards. Private gardens where you know the history and woodland interiors are safest.</li>' +

    '<div class="highlight-box gold reveal">' +
      '<strong>Never harvest these:</strong> Avoid all conifers and resinous trees \u2014 pine, cedar, cypress, and sweetgum contain aromatic oils and resins that are toxic to shrimp and snails, even after drying or boiling. Skip black walnut \u2014 it contains juglone, a compound toxic to aquatic life. And steer clear of ornamental azalea, rhododendron, and oleander, all genuinely toxic and common in landscaped yards, so a stray fallen leaf near one of these shrubs is an easy accidental grab.' +
    '</div>' +

    '<h3 class="section-heading reveal" style="font-size:1rem;margin-bottom:0.5rem">Drying &amp; storage</h3>' +
    '<ul class="species-list reveal">' +
      '<li><strong>Spread flat</strong> in a single layer with good airflow. Direct sunlight works well. 1\u20132 weeks to fully dry at room temperature.</li>' +
      '<li><strong>Oven drying</strong> at 120\u00b0C / 250\u00b0F for 20\u201340 minutes kills surface organisms without leaching tannins into water you discard.</li>' +
      '<li><strong>Store dry</strong> in a sealed glass jar or paper bag. Properly dried leaves last 12+ months. Discard any that develop mould.</li>' +
