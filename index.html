  }

  function strategyCard(icon, title, body) {
    return '<div class="tool-card reveal" style="margin-bottom:0.85rem">' +
      '<div style="font-size:0.85rem;font-weight:600;color:var(--blue-deep);margin-bottom:0.5rem">' + icon + ' ' + title + '</div>' +
      '<p style="font-size:0.84rem;line-height:1.7;color:var(--m-text);margin:0">' + body + '</p>' +
    '</div>';
  }

  return '<div class="page-body">' +

    '<p class="prose reveal">In the wild, shrimp live in streams fed by continuous leaf fall and decomposing plant matter from surrounding trees. Replicating this allochthonous input creates the biofilm foundation, tannin conditioning, and structural complexity that a shrimp tank benefits from enormously. These are not extras - for many experienced keepers they become the core of tank management.</p>' +

    '<h2 class="section-heading reveal">Food leaves</h2>' +
    '<p class="prose reveal">These leaves are grazed directly by shrimp and snails for their nutritional content. Shrimp consume the softening leaf tissue itself, not just the biofilm growing on it. All are safe for Neocaridina, Ghost Shrimp, and common snails.</p>' +

    leafCard('&#127807;', 'Mulberry', 'Morus sp.', 'Direct food leaf', ['Direct food', 'Wild harvest'],
      'The gold standard of shrimp food leaves. Green mulberry leaves are exceptionally high in protein, vitamins, and minerals - closer to a supplement than a passive habitat element. Shrimp and snails both devour them with enthusiasm, which creates the competition problem addressed in the section below. Dried leaves soften slowly and buy shrimp more grazing time. Fresh-blanched leaves trigger an immediate feeding frenzy. Wild harvest from unsprayed trees is easy and free; dried leaves store for 12+ months in a sealed jar.') +

    leafCard('&#127810;', 'Guava', 'Psidium guajava', 'Food + tannin leaf', ['Direct food', 'Tannin source', 'Biofilm'],
      'A popular mulberry alternative with a firmer texture that breaks down more slowly, giving snails less of a speed advantage. Provides mild tannin conditioning alongside nutritional value, serving a dual role. Shrimp graze both the leaf tissue and the biofilm that develops as it ages. Widely sold dried in the hobby.') +

    leafCard('&#127807;', 'Stinging Nettle', 'Urtica dioica', 'Mineral-rich food leaf', ['Direct food', 'Wild harvest'],
      'Dried nettle loses its sting completely and becomes a mineral-rich food source high in iron, calcium, and trace elements. Genuinely nutritious rather than just a biofilm substrate. Widely available dried (sold as herbal tea, usually untreated and safe) or wild-harvested in late spring. Its tougher texture gives shrimp more access time than soft mulberry.') +

    leafCard('&#127820;', 'Banana Leaf', 'Musa sp.', 'Food + biofilm leaf', ['Direct food', 'Biofilm'],
      'Large, soft, and eagerly grazed once blanched. Develops good biofilm quickly with a large surface for multiple shrimp to graze simultaneously. Tannin release is minimal so water tinting is negligible. Often available at Asian grocery stores as cooking leaves - confirm no preservative treatment before use.') +

    leafCard('&#127804;', 'Dandelion Greens', 'Taraxacum officinale', 'Vitamin-rich food leaf', ['Direct food', 'Wild harvest'],
      'One of the most accessible wild forage options - dandelions grow in nearly every yard and vacant lot in North America. High in calcium, potassium, and beta-carotene, with a reputation among keepers for boosting natural shrimp coloration. Harvest young inner leaves before flowering for the mildest texture. Blanch 1\u20132 minutes to soften; snails and shrimp both graze eagerly, so treat it the same way as mulberry for the competition problem below. Only harvest from lawns you know are pesticide- and herbicide-free.') +

    leafCard('&#127793;', 'Broadleaf Plantain', 'Plantago major / P. lanceolata', 'Fibrous slow-grazing food leaf', ['Direct food', 'Wild harvest'],
      'Not related to the banana-family plantain - this is the common lawn weed with ribbed, oval leaves. Its fibrous structure holds up well to grazing, giving shrimp and snails 24\u201336 hours of access before it breaks down, longer than soft greens like dandelion. Blanch 2 minutes to break down the leaf\u2019s outer wax coating before adding. As accessible as dandelion - most temperate lawns have it growing wild.') +

    leafCard('&#127827;', 'Blackberry / Raspberry Leaf', 'Rubus sp.', 'Calcium-rich food leaf', ['Direct food', 'Wild harvest'],
      'A close nutritional cousin to mulberry - high in calcium and easy to identify by its toothed, three- to five-lobed leaflets. Brambles are common along field edges, fence lines, and woodland margins, making this one of the easier wild leaves to source in quantity. Fresh leaves can be blanched 2\u20133 minutes like mulberry, or dried for longer-lasting grazing. Avoid leaves from cultivated berry patches that may have been sprayed.') +

    leafCard('&#127815;', 'Grape Leaf', 'Vitis sp.', 'Calcium-rich food leaf', ['Direct food', 'Wild harvest'],
      'A long-standing favorite in the shrimp hobby, valued for a firm texture that resists disintegrating into mush the way some soft greens do. Wild grape vines are common in hedgerows and woodland edges across much of North America, and backyard grape vines work equally well if unsprayed. Blanch 2\u20133 minutes; the slightly tougher texture gives shrimp more grazing time than dandelion or plantain before snails take over.') +

    leafCard('&#127795;', 'Loquat Leaf', 'Eriobotrya japonica', 'Food + biofilm leaf', ['Direct food', 'Biofilm', 'Wild harvest'],
      'A thick, leathery leaf similar in role to guava - common as an ornamental tree across the southern US, which makes it easy to source. The tough texture means it breaks down slowly, developing biofilm over an extended period rather than disappearing in a day or two like soft greens. Boil 5\u201310 minutes to soften slightly and help it sink. A good middle ground between the fast-disappearing green leaves above and the long-lasting botanicals below.') +

    '<h2 class="section-heading reveal">Tannin &amp; biofilm leaves</h2>' +
    '<p class="prose reveal">These leaves condition the water as they break down, releasing tannins and humic acids with mild antibacterial and antifungal properties that replicate the blackwater chemistry many shrimp originate from. Shrimp graze the biofilm that develops on their surfaces - the nutritional contribution is indirect but sustained.</p>' +

    leafCard('&#127809;', 'Indian Almond / Catappa', 'Terminalia catappa', 'Tannin + biofilm leaf', ['Tannin source', 'Biofilm'],
      'The hobby standard - widely used and reliably effective. Releases tannins, flavonoids, and humic acids creating a mild blackwater environment that reduces stress and supports beneficial bacterial populations. Shrimplets graze the surface biofilm continuously. One medium leaf per 10 gallons; replace every 4\u20138 weeks. Causes noticeable water tinting - pre-soak or boil briefly to reduce amber color.') +

    leafCard('&#127809;', 'Oak', 'Quercus sp.', 'Tannin + biofilm leaf', ['Tannin source', 'Biofilm', 'Wild harvest'],
      'Exceptionally durable - a single oak leaf can last months. Releases tannins steadily without extreme water darkening. Easy to wild-harvest across North America and Europe from naturally fallen autumn leaves. One of the best options for keepers who want to collect their own without sourcing specialist supplies.') +

    leafCard('&#127810;', 'Beech', 'Fagus sp.', 'Tannin + biofilm leaf', ['Tannin source', 'Biofilm', 'Wild harvest'],

    leafCard('&#127807;', 'Jackfruit', 'Artocarpus heterophyllus', 'Tannin + biofilm leaf', ['Tannin source', 'Biofilm'],
      'Firm texture and slow decomposition make jackfruit leaves one of the longest-lasting options. Good biofilm development over weeks. Widely sold dried in the shrimp hobby. Useful when you want a persistent biofilm surface that needs infrequent replacement.') +

    leafCard('&#127792;', 'Hazel / Hornbeam Leaf', 'Corylus sp. / Carpinus sp.', 'Tannin + biofilm leaf', ['Tannin source', 'Biofilm', 'Wild harvest'],
      'A gentler alternative to oak or beech, releasing mild tannins with minimal water tinting. Widely available across temperate North America and Europe as both an ornamental hedge planting and a woodland understory tree, making it easy to source without hunting for a specific specimen. Moderate breakdown pace with steady biofilm development - a good rotation partner alongside beech or birch for keepers who like to vary their leaf litter.') +

    '<h2 class="section-heading reveal">Botanicals &amp; natural structures</h2>' +
    '<p class="prose reveal">Botanicals are the woody, structural elements - cones, pods, and wood - that provide long-lasting biofilm surfaces, release tannins slowly, and create habitat complexity. They become active foraging zones as biofilm colonizes their surfaces.</p>' +

    botanicalCard('&#127794;', 'Alder Cones', 'Alnus sp. - highest tannin content per unit size',
      'The most tannin-dense botanical in common use. Small, easy to dose precisely, and highly effective at growing dense biofilm in the gaps between cone scales - creating sheltered microhabitat that shrimp and shrimplets pick through continuously. Can gently lower pH in soft water; monitor carefully in Neocaridina tanks. Start with 1 cone per 5\u201310 gallons. Rinse before adding; brief boiling helps them sink. Replace monthly but leave spent cones in place - still productive biofilm surfaces.') +

    botanicalCard('&#127807;', 'Casuarina Cones', 'Casuarina sp. - she-oak cones',

    botanicalCard('&#129683;', 'Cholla Wood', 'Opuntia sp. skeleton - hollow tubular foraging structure',
      'The skeletal remains of a cactus - hollow, tubular, and unlike any other botanical. Shrimplets actively enter through openings along its length, foraging on the biofilm that develops on the inner wall surfaces. No other hardscape item provides this enclosed navigable interior space. Shrimp spend notable time inside cholla. Decomposes fully over several months. Safe for all Neocaridina and snails.') +

    botanicalCard('&#127800;', 'Lotus Seed Pods', 'Nelumbo sp. - architectural biofilm hardscape',
      'The honeycomb cavity structure creates dozens of individual recesses that each develop their own biofilm at different rates - turning one botanical into a multi-zone foraging landscape. Tannin release is mild and diminishes after the first week; the pod\'s role is primarily structural thereafter. Shrimp work across all surfaces continuously. Long-lasting: the woody tissue decomposes very slowly.') +

    botanicalCard('&#127802;', 'Southern Magnolia Leaf', 'Magnolia grandiflora - long-term structural shelter',
      'The most durable leaf option in this guide by a wide margin. Extremely thick and waxy, Southern Magnolia leaves can last three to six months or longer submerged without breaking down into debris - functioning more as a piece of structural hardscape than a consumable food or fast-cycling tannin source. Biofilm develops slowly across the waxy surface, providing a long, low-maintenance grazing zone that doesn\'t need frequent replacement. Common as a landscaping tree across the southern US. Boil 10\u201315 minutes to strip the surface wax and force the leaf to sink - without this step it will float indefinitely.') +

    '<h2 class="section-heading reveal">Wild harvesting &amp; preparation</h2>' +
    '<p class="prose reveal">Wild-harvested leaves are free, sustainable, and often fresher than purchased dried stock. The key requirements are correct identification, a clean source location, and proper preparation before adding to the tank.</p>' +

    '<h3 class="section-heading reveal" style="font-size:1rem;margin-bottom:0.5rem">Sourcing safely</h3>' +
    '<ul class="species-list reveal">' +
      '<li><strong>Know the tree.</strong> Oak, beech, birch, and mulberry are distinctive and easy to identify confidently. Do not harvest from trees you cannot positively identify.</li>' +
      '<li><strong>Avoid contaminated sites.</strong> Never collect from roadsides, golf courses, maintained parks, or orchards. Private gardens where you know the history and woodland interiors are safest.</li>' +
      '<li><strong>Fallen leaves only</strong> for tannin/biofilm species. The exception is mulberry: fresh green leaves can be harvested directly, then blanched immediately or dried flat.</li>' +
    '</ul>' +

    '<div class="highlight-box gold reveal">' +
      '<strong>Never harvest these:</strong> Avoid all conifers and resinous trees - pine, cedar, cypress, and sweetgum contain aromatic oils and resins that are toxic to shrimp and snails, even after drying or boiling. Skip black walnut - it contains juglone, a compound toxic to aquatic life. And steer clear of ornamental azalea, rhododendron, and oleander, all genuinely toxic and common in landscaped yards, so a stray fallen leaf near one of these shrubs is an easy accidental grab.' +
    '</div>' +

    '<h3 class="section-heading reveal" style="font-size:1rem;margin-bottom:0.5rem">Drying &amp; storage</h3>' +
    '<ul class="species-list reveal">' +
      '<li><strong>Spread flat</strong> in a single layer with good airflow. Direct sunlight works well. 1\u20132 weeks to fully dry at room temperature.</li>' +
      '<li><strong>Oven drying</strong> at 120\u00b0C / 250\u00b0F for 20\u201340 minutes kills surface organisms without leaching tannins into water you discard.</li>' +
      '<li><strong>Store dry</strong> in a sealed glass jar or paper bag. Properly dried leaves last 12+ months. Discard any that develop mould.</li>' +
    '</ul>' +

    '<h3 class="section-heading reveal" style="font-size:1rem;margin-bottom:0.75rem">Preparation before use</h3>' +
    '<div class="param-grid reveal" style="margin-bottom:1.25rem">' +
      '<div class="param-card"><div class="param-name">Dried leaves</div><div class="param-range ideal">Rinse + 30 min soak</div><p style="font-size:0.8rem;color:var(--m-text);margin:0.4rem 0 0">Rinse under tap, soak 30 minutes to check for mould or hitchhikers. Add directly or after a brief hot soak to help them sink.</p></div>' +
      '<div class="param-card"><div class="param-name">Fresh mulberry / nettle</div><div class="param-range ideal">Blanch 60&ndash;90 sec</div><p style="font-size:0.8rem;color:var(--m-text);margin:0.4rem 0 0">Wash thoroughly, blanch 60\u201390 seconds in boiling water, cool completely before adding.</p></div>' +
      '<div class="param-card"><div class="param-name">Boiling (optional)</div><div class="param-range acceptable">Reduces tannins</div><p style="font-size:0.8rem;color:var(--m-text);margin:0.4rem 0 0">Kills surface organisms and helps leaves sink but leaches tannins. Use when you want food value without water tinting.</p></div>' +
      '<div class="param-card"><div class="param-name">Oven method</div><div class="param-range ideal">Best of both</div><p style="font-size:0.8rem;color:var(--m-text);margin:0.4rem 0 0">120\u00b0C / 250\u00b0F for 20\u201340 min. Sterilizes without leaching tannins - best of both approaches.</p></div>' +
    '</div>' +

    '<div class="highlight-box amber reveal">' +
      '<strong>Dosing:</strong> 1 medium leaf per 10 gallons as a starting point. Replace when only the leaf skeleton (veins) remains - leave the skeleton one more week as it is still a biofilm surface. Fresh mulberry can be offered as a small piece every 1\u20132 days as a direct food supplement.' +
    '</div>' +

    '<h2 class="section-heading reveal">Managing snail competition at feeding time</h2>' +
    '<p class="prose reveal">Mystery snails and shrimp coexist well ecologically - snails process detritus and algae that shrimp ignore. The problem is competitive feeding: mystery snails are large and persistent and will monopolize a mulberry leaf before smaller shrimp can access it. The goal is not to remove snails from the equation but to ensure shrimp get adequate access while snails handle cleanup, which is what they do best.</p>' +

    strategyCard('&#9201;', 'Feed at lights-out',
      'Shrimp are most active and bold in low light and after dark. Mystery snails are more active during daylight and shortly after lights come on. Adding leaves as the photoperiod ends gives shrimp a significant head start before snails fully mobilize. This alone shifts the dynamic noticeably.') +

    strategyCard('&#128336;', 'Distract snails separately',
      'Drop a piece of blanched zucchini or cucumber for the snails at one end of the tank immediately before adding shrimp leaves at the other end. Snails fixate on the vegetable; shrimp get the leaves undisturbed. Zucchini softens quickly and snails find it irresistible.') +

    strategyCard('&#127807;', 'Multiple leaves simultaneously',
      'A single mystery snail can monopolize a single leaf. Two or three leaves added at the same time mean no snail can cover all locations. Shrimp scatter and access whichever leaf the snail is not on. Add several small pieces of mulberry rather than one large one.') +

    strategyCard('&#128070;', 'Submerged feeding platforms',
      'A platform suspended several centimeters below the surface creates a depth barrier that exploits a fundamental difference between shrimp and snails: shrimp navigate three-dimensionally in open water, while snails require continuous surface contact to move. A platform held by a floating ring at the surface has no surface path leading to it - effectively snail-proof even if the float drifts to the glass. Shrimp swim straight to it. Such feeders exist commercially and as printable designs - the <a href="https://makerworld.com/en/models/2659388-aquarium-floating-feeder" target="_blank" rel="noopener" style="color: var(--link);font-weight:600">Aquarium Floating Feeder on MakerWorld</a> is a free design that has been printed and used successfully in a real shrimp tank. One durability note from that testing: the stock bottom feeding platform can be fragile when removing print supports - printing it with a reinforced, thicker base holds up noticeably better over time.') +

    strategyCard('&#129519;', 'Feeding clips positioned high',
      'Suction-cup feeding clips on the glass above substrate level give shrimp easy access while making snail navigation challenging. Snails must climb the glass and navigate laterally to the clip - possible but slow. Combined with lights-out timing this is often sufficient for small snail populations.') +

    strategyCard('&#127807;', 'Choose less-attractive leaves for the main tank',
      'Snails prefer the softest, most nutritious leaves. Dried catappa, oak, beech, and birch are less immediately attractive because of their tannin bitterness and tougher initial texture. Offering tannin leaves in the main tank while reserving mulberry for a targeted shrimp feed using another strategy lets shrimp access both food types without constant competition.') +

    strategyCard('&#127922;', 'Manage snail colony size',
      'A single Mystery Snail in a 20-gallon tank is a manageable grazer. A large colony will overwhelm any feeding strategy. See the stocking table on the Compatibility page for recommended Mystery Snail counts by tank size in a shrimp tank specifically - it\'s more conservative than general community-tank guidance because feeding competition, not just bioload, is the concern here. If snails consistently outcompete shrimp regardless of technique, colony size is the root cause - rehome surplus snails to restore the balance.') +

    strategyCard('&#127860;', 'Adjusting feeding for a heavier snail population',
      'If you\'re above the recommended stocking density, or simply prefer not to rehome snails, two adjustments help: first, scale up total food quantity roughly in proportion to snail count - an extra leaf or half a food tablet per additional snail keeps shrimp from being squeezed out of a fixed portion. Second, feed snails and shrimp separately: give snails their own blanched vegetable (zucchini or cucumber) at one end of the tank while shrimp-targeted food goes in a platform, clip, or the opposite end using the strategies above. Watch body condition over a couple of weeks after any adjustment - well-fed shrimp should look plump behind the head, not thin or translucent, which is the visible sign feeding still isn\'t reaching them.') +

    '<div class="highlight-box teal reveal">' +
      '<strong>The right role for snails:</strong> mystery snails are excellent at processing algae, consuming leftover food before it decays, and keeping glass and hardscape clean. Used as the cleanup crew they genuinely are, they contribute positively. The strategies above are about channelling that energy rather than fighting it.' +
    '</div>' +

  '</div>';
}

function renderBreeding() {
  return '<div class="page-body">' +

    '<div class="highlight-box blue reveal">Neocaridina breed readily in stable, well-fed tanks - often without any deliberate intervention. The more common challenge is slowing them down once a colony is established, or managing color quality as the population grows. Understanding the cycle helps you guide the colony rather than just watch it happen.</div>' +

    '<h2 class="section-heading reveal">The breeding cycle</h2>' +
    '<table class="data-table reveal"><thead><tr><th>Stage</th><th>What to look for</th><th>Duration</th></tr></thead><tbody>' +
      '<tr><td><strong>Saddle</strong></td><td>Yellowish patch behind the head on the female\'s back - unfertilized eggs waiting in the ovaries</td><td>Ongoing in mature females</td></tr>' +
      '<tr><td><strong>Molting &amp; mating</strong></td><td>Female molts and releases pheromones; males become hyperactive and swim frantically - called a "mating swarm"</td><td>Minutes to hours</td></tr>' +
      '<tr><td><strong>Berried</strong></td><td>Fertilized eggs visible under the tail, fanned constantly by the female\'s swimmerets. Green, yellow, or brown depending on color morph.</td><td>25–35 days at 72–76°F</td></tr>' +
      '<tr><td><strong>Shrimplets</strong></td><td>Miniature fully-formed shrimp, 1–2mm. Born directly as shrimp - no larval stage in freshwater Neocaridina.</td><td>Reach adult size in 3–4 months</td></tr>' +
      '<tr><td><strong>Sexual maturity</strong></td><td>Females develop a saddle; males are slightly smaller and slimmer. Females begin breeding cycle.</td><td>~3 months from hatching</td></tr>' +
    '</tbody></table>' +

    '<div class="info-card reveal"><div class="info-card-title">Why aren\'t they breeding?</div><div class="info-card-body">The most common reasons: tank is too new (under 3 months), parameters are unstable, temperature is below 70°F, the colony is all-female or all-male, or the tank was recently treated with medication. A healthy, mixed, mature colony in stable water will breed without any prompting. If they still aren\'t after 3 months, check sex ratio - females are larger with a rounder belly and visible saddle; males are slim and smaller.</div></div>' +

    '<h2 class="section-heading reveal">Caring for shrimplets</h2>' +
    '<p class="prose reveal">Shrimplets are miniature adults from birth and need no special care beyond what the colony already gets. The most important things: <strong>no predators</strong> (even small fish will eat shrimplets), <strong>no strong intake flow</strong> (cover filter intakes with sponge), and <strong>fine food</strong> - powdered foods and biofilm are easier to eat than large wafers at 1–2mm.</p>' +
    '<p class="prose reveal">Shrimplets spend most of their first weeks hiding in moss, java fern roots, and leaf litter. A tank that looks shrimp-empty after a birth event is usually just a tank full of shrimplets hiding well. Resistance to handling and water quality is lower in the first two weeks - avoid water changes larger than 10% while shrimplets are very young.</p>' +

    '<h2 class="section-heading reveal">Colony management &amp; culling</h2>' +
    '<p class="prose reveal">A Neocaridina colony will double roughly every 3 months under good conditions. A 10-gallon tank comfortably holds 50–80 adults; beyond that, bioload increases and color quality can decline without selective pressure.</p>' +
    '<div class="highlight-box moss reveal"><strong>Culling for color</strong> means removing (rehoming, returning to a store, or using as feeders) shrimp that show undesirable color expression - translucency, off-color patches, or fading. Remove these before they breed, not after. A well-culled colony maintains and intensifies color over generations; an unmanaged colony drifts toward the ancestral wild-type.</div>' +

    '<h2 class="section-heading reveal">Sex ratio &amp; colony health</h2>' +
    '<table class="data-table reveal"><thead><tr><th>Topic</th><th>Detail</th></tr></thead><tbody>' +
      '<tr><td><strong>Ideal sex ratio</strong></td><td>~1 male to 3 females. More females = more breeding capacity; too many males causes stress through constant pursuit.</td></tr>' +
      '<tr><td><strong>Starting colony size</strong></td><td>10–15 shrimp minimum to establish a healthy gene pool. Smaller groups can be slow to take off.</td></tr>' +
      '<tr><td><strong>Keeping one color form</strong></td><td>Essential for maintaining color. Mixing Neo color forms produces brown/wild-type offspring within 1–2 generations.</td></tr>' +
      '<tr><td><strong>Population control</strong></td><td>Overstock triggers slower breeding naturally, but also stresses the colony. Better to rehome excess regularly.</td></tr>' +
      '<tr><td><strong>Berried female stress</strong></td><td>Avoid large water changes, medication, or temperature swings while females are berried - stress can cause egg drops.</td></tr>' +
    '</tbody></table>' +

    '<h2 class="section-heading reveal">Selective breeding &amp; color genetics</h2>' +
    '<p class="prose reveal">Neocaridina color genetics aren\'t formally mapped the way, say, mouse coat color is - most of what the hobby knows comes from decades of breeder observation, not peer-reviewed studies. Treat the patterns below as strong tendencies you can plan around, not guaranteed outcomes. Every color form (Cherry Red, Yellow, Blue Dream, Blue Velvet, Rili, Chocolate, Black) descends from the same wild-type ancestor through selective breeding of naturally occurring pigment mutations.</p>' +
    '<table class="data-table reveal"><thead><tr><th>Cross</th><th>Typical outcome</th><th>Why</th></tr></thead><tbody>' +
      '<tr><td><strong>Same color × same color</strong></td><td>Offspring true to color; quality reflects the grade of both parents</td><td>Line is stable once isolated for several generations</td></tr>' +
      '<tr><td><strong>Red × wild-type</strong></td><td>Mostly wild-type/brown offspring; red resurfaces in later generations</td><td>Red pigment behaves recessive against wild coloring</td></tr>' +
      '<tr><td><strong>Red × Yellow</strong></td><td>Mostly red or wild-type F1; yellow re-emerges in F2</td><td>Yellow pigment is recessive to red</td></tr>' +
      '<tr><td><strong>Red × Blue</strong> (Blue Dream / Blue Velvet)</td><td>Mixed, muddy offspring - red, blue, and wild-type in unpredictable ratios</td><td>Separate pigment genes segregating independently, not blending like paint. Most breeders treat this as a line-ruining cross.</td></tr>' +
      '<tr><td><strong>Any color × Rili</strong></td><td>Roughly half or more of offspring show the clear-saddle Rili pattern</td><td>Rili is a pattern trait, not a color, and layers onto any base color with semi-dominant behavior</td></tr>' +
      '<tr><td><strong>Black/Carbon × Red</strong></td><td>Mixed and unpredictable, usually a step backward for both lines</td><td>Different pigment layer than red/yellow/blue; best kept isolated</td></tr>' +
    '</tbody></table>' +

    '<div class="info-card reveal"><div class="info-card-title">Grading &amp; culling for quality</div><div class="info-card-body">Within a single color, hobbyists grade shrimp by how opaque and saturated the color is - from translucent/patchy at the low end to fully solid, no-visible-organs coloring at the top (often marketed as "Fire Red," "Painted Fire Red," or similar tiers). Grade is polygenic, meaning it responds to selection pressure over generations rather than being set by one gene. Each generation, cull out (rehome, trade, or feed to other fish) the lowest-grade individuals before they breed. A colony culled consistently over 4–6 generations shows a visibly higher average grade; an unmanaged colony drifts back toward patchier, more translucent coloring.</div></div>' +

    '<div class="highlight-box gold reveal"><strong>Avoid the bottleneck.</strong> Starting a line from too few individuals - a common mistake when isolating a rare color or high grade - causes inbreeding depression within a handful of generations: smaller adult size, higher mortality, more visible deformities, and color regression despite careful culling. Start any dedicated line with 15–20+ unrelated individuals where possible, and consider introducing a few new same-line individuals from a different, reputable source every 4–6 generations to keep the gene pool healthy.</div>' +

    '<h2 class="section-heading reveal">Scaling up: from hobby colony to business</h2>' +
    '<p class="prose reveal">Most breeders move through these stages gradually rather than jumping straight to a rack system. The numbers below are rough, illustrative ranges - actual costs and income vary enormously by region, species/color rarity, and local market saturation. Treat them as a planning tool, not a promise.</p>' +
    '<table class="data-table reveal"><thead><tr><th>Tier</th><th>Tanks</th><th>Colony size</th><th>Weekly time</th><th>Startup cost*</th><th>Monthly revenue*</th></tr></thead><tbody>' +
      '<tr><td><strong>Hobbyist</strong></td><td>1–3</td><td>50–300</td><td>1–2 hrs</td><td>$50–150</td><td>$0–100 (often store credit/trades)</td></tr>' +
      '<tr><td><strong>Local seller</strong></td><td>4–15</td><td>500–2,000+</td><td>3–6 hrs</td><td>$500–1,500</td><td>$100–500</td></tr>' +
      '<tr><td><strong>Semi-commercial</strong></td><td>20–50+</td><td>5,000–20,000+</td><td>10–20 hrs</td><td>$2,000–6,000+</td><td>$500–2,500</td></tr>' +
      '<tr><td><strong>Full-time operation</strong></td><td>100+</td><td>20,000+</td><td>30–50+ hrs</td><td>$10,000+</td><td>Highly variable</td></tr>' +
    '</tbody></table>' +
    '<p class="prose reveal" style="font-size:0.8rem;color:var(--mid-text)">*Figures are rough US-hobby illustrative ranges, not guarantees. Reaching genuine full-time income from shrimp alone is uncommon - most who reach the semi-commercial tier treat it as a strong side income rather than a full income replacement, and many full-time operations diversify into plants, hardscape, or other livestock alongside shrimp.</p>' +

    '<div class="info-card reveal"><div class="info-card-title">Hobbyist</div><div class="info-card-body">One to three tanks, breeding mostly happens on its own. Excess shrimp go back to the local fish store for credit, get traded with other hobbyists, or are given away. Not really a business yet - more a way to offset the cost of the hobby.</div></div>' +
    '<div class="info-card reveal"><div class="info-card-title">Local seller</div><div class="info-card-body">A dedicated rack or shelf of tanks becomes worthwhile. Selling happens through local aquarium clubs, swap meets, Facebook buy/sell groups, and LFS consignment. This is where color-line discipline starts to matter - mixing lines by accident costs you the premium a clean line commands.</div></div>' +
    '<div class="info-card reveal"><div class="info-card-title">Semi-commercial</div><div class="info-card-body">Enough scale that manual water changes per tank become impractical - batch water prep and shared air/heat systems take over. Selling expands to regional shipping and possibly a small online storefront or dedicated livestock marketplace, alongside continued local sales.</div></div>' +
    '<div class="info-card reveal"><div class="info-card-title">Full-time operation</div><div class="info-card-body">A dedicated room or building, automated or semi-automated water systems, and often wholesale relationships with multiple local fish stores. Reaching this tier from shrimp breeding alone, on shrimp income alone, is achievable but rare - plan for it to take years, not months.</div></div>' +

    '<h2 class="section-heading reveal">Water &amp; infrastructure at scale</h2>' +
    '<p class="prose reveal">The techniques that work for one or two tanks stop scaling once you\'re past half a dozen. A few adjustments make the difference between a manageable rack and a constant chore:</p>' +
    '<ul class="species-list reveal">' +
      '<li><strong>RO/DI at volume.</strong> Buying pre-made RO water from an LFS stops being practical past a handful of tanks. A dedicated RO/DI unit paying for itself quickly once you\'re doing weekly water changes across many tanks.</li>' +
      '<li><strong>Batch remineralization.</strong> Prepare water in bulk (a food-safe trash can or barrel with a heater and powerhead) rather than dosing each tank individually - mix, dose GH/KH remineralizer, let it sit to temperature and stabilize, then distribute by hose or pump.</li>' +
      '<li><strong>Shared air, individual filtration.</strong> A single air pump with a manifold can run sponge filters across an entire rack, but keep each tank\'s sponge filter separate rather than sharing filtration media between tanks - this is one of the biggest levers for containing a disease outbreak.</li>' +
      '<li><strong>Room-level heating.</strong> Heating an entire fish room with a thermostat-controlled space heater is more efficient and more reliable than running a heater in every individual tank once you\'re past a dozen tanks.</li>' +
      '<li><strong>Mandatory quarantine.</strong> Any new stock - including shrimp you\'re buying to refresh a line\'s genetics - gets isolated in a separate system for 2–4+ weeks before it ever touches the main rack. One overlooked parasite or bacterial issue can wipe out months of work at scale.</li>' +
      '<li><strong>Backup power.</strong> A battery backup for air pumps is cheap insurance once a power outage means risking dozens of tanks at once instead of one.</li>' +
    '</ul>' +

    '<h2 class="section-heading reveal">Selling your shrimp: local vs. shipping</h2>' +
    '<div class="info-card reveal"><div class="info-card-title">Local selling</div><div class="info-card-body">The easiest way to start - no packaging risk, no shipping stress, and usually the best margin since there\'s no shipping cost to absorb. Channels include local fish store trade-in or consignment (LFS typically pays store credit or a lower cash rate, or takes a consignment cut of the sale price), aquarium club auctions and swap meets (often the best venue for rare or high-grade stock, since the audience already knows what they\'re looking at), Facebook local buy/sell/trade groups, and straightforward word of mouth with local pickup.</div></div>' +
    '<div class="info-card reveal"><div class="info-card-title">Shipping shrimp</div><div class="info-card-body">Opens up a much larger market but adds real cost and risk. Standard practice in the US hobby is breather bags (gas-permeable, reducing ammonia buildup risk versus a heat-sealed pure-oxygen bag) inside an insulated, styrofoam-lined box, with a heat pack in cold months or a gel/cold pack in hot months. USPS Priority Mail is the most commonly used carrier for live shrimp domestically - always confirm current live-animal shipping policy directly with the carrier, as these change. Avoid shipping into weekend transit delays or extreme temperature days at either end of the route. Most sellers offer a Live Arrival Guarantee (photo proof required within a set window, typically a few hours of delivery) and price that expected loss rate into their shipping fee.</div></div>' +

    '<h2 class="section-heading reveal">Running it like a business</h2>' +
    '<p class="prose reveal">Once money is changing hands regularly, a few habits separate breeders who stay profitable from those who quietly lose money without realizing it.</p>' +
    '<table class="data-table reveal"><thead><tr><th>Cost category</th><th>What to track</th></tr></thead><tbody>' +
      '<tr><td><strong>Equipment</strong></td><td>Amortize tanks, racks, RO/DI unit, and heaters over their expected lifespan rather than treating them as free after the first purchase</td></tr>' +
      '<tr><td><strong>Electricity</strong></td><td>Heaters, filters, and lights running continuously across many tanks adds up - a real cost, not a rounding error, once you\'re past a dozen tanks</td></tr>' +
      '<tr><td><strong>Food &amp; water treatment</strong></td><td>Remineralizer, conditioner, and food scale roughly with colony size and tank count</td></tr>' +
      '<tr><td><strong>Packaging &amp; shipping</strong></td><td>Bags, boxes, insulation, heat/cold packs - factor these into shipped pricing, not just the shrimp itself</td></tr>' +
      '<tr><td><strong>Expected loss rate</strong></td><td>Some mortality and shipping loss is normal at scale; build it into pricing rather than treating each loss as a surprise</td></tr>' +
    '</tbody></table>' +
    '<p class="prose reveal">On pricing: common, widely available colors (standard Cherry Red, wild-type) sell for little almost everywhere, so they\'re better used for bulk/starter-colony deals than as a profit center. Rare colors and high grades command a real premium - this is the direct payoff of the line discipline and culling described above. Keep basic records of lineage per line, culling history, and sales/expenses; check your local regulations on business licensing and sales tax as you cross from casual selling into a real income stream, since requirements vary by location and this isn\'t legal or tax advice.</p>' +

    '<h2 class="section-heading reveal">Common pitfalls when scaling up</h2>' +
    '<ul class="species-list reveal">' +
      '<li><strong>Shared filtration spreading disease.</strong> A central sump or shared filter media turns one sick tank into a rack-wide outbreak. Keep filtration per-tank.</li>' +
      '<li><strong>Accidental line contamination.</strong> Shared nets and siphons move shrimplets between tanks unnoticed. Dedicate equipment per line or tank where the budget allows.</li>' +
      '<li><strong>Over-narrowing the gene pool.</strong> Chasing one high-grade line too aggressively without introducing new blood leads straight into the inbreeding depression described above.</li>' +
      '<li><strong>Underestimating time.</strong> Weekly maintenance hours scale faster than most new breeders expect - what takes 20 minutes at 3 tanks can take several hours at 30.</li>' +
      '<li><strong>Market saturation on common colors.</strong> Most local markets are already flooded with standard Cherry Red. Rare lines and high grades hold value far better.</li>' +
      '<li><strong>Inconsistent grading.</strong> Selling inconsistently graded stock as "high grade" erodes trust fast in a hobby that runs heavily on reputation and repeat buyers.</li>' +
    '</ul>' +

    '<h2 class="section-heading reveal">Ghost &amp; Bamboo Shrimp breeding</h2>' +
    '<div class="info-card reveal"><div class="info-card-title">Ghost Shrimp</div><div class="info-card-body">Females carry eggs for 3–4 weeks. Larvae hatch as zooplankton and require brackish water (SG 1.005–1.010) to develop - they die within days in freshwater. Captive breeding in a standard tank is not practical. This is a feature for display tanks where you want a stable, non-exploding population.</div></div>' +
    '<div class="info-card reveal"><div class="info-card-title">Bamboo / Vampire Shrimp</div><div class="info-card-body">Rarely breed in captivity - larvae require estuarine conditions and specific planktonic food. Almost all Bamboo Shrimp in the hobby are wild-caught. Treat each one as irreplaceable and focus on longevity (3–5 years in good conditions) rather than breeding.</div></div>' +

  '</div>';
}

// ── MOLT & HEALTH ─────────────────────────────────────
function renderHealth() {
  return '<div class="page-body">' +

    '<div class="highlight-box water reveal">Molting is the most vulnerable moment in a shrimp\'s life. Understanding the molt cycle - and what disrupts it - is the single most useful thing you can learn about shrimp keeping. Most unexplained deaths are molt-related.</div>' +

    '<h2 class="section-heading reveal">The molt cycle</h2>' +
    '<p class="prose reveal">Shrimp cannot grow without molting. They shed their entire exoskeleton - including gill covers, eye covers, and the lining of the digestive tract - and must expand their new soft shell before it hardens. This process takes 1–4 hours. During that window, the shrimp is completely defenceless.</p>' +
    '<table class="data-table reveal"><thead><tr><th>Phase</th><th>Signs</th><th>Duration</th></tr></thead><tbody>' +
      '<tr><td><strong>Pre-molt</strong></td><td>Shrimp hides, stops eating, may appear dull or slightly pale. Calcium and minerals are reabsorbed from the old shell.</td><td>Days to a week</td></tr>' +
      '<tr><td><strong>The molt</strong></td><td>Old shell splits at the back of the head. Shrimp wriggles free in seconds to minutes. Discarded shell looks like a ghost shrimp.</td><td>Minutes</td></tr>' +
      '<tr><td><strong>Post-molt</strong></td><td>Shrimp is soft, pale, and motionless. It will often eat its own shed shell - this replenishes calcium. Hides for several hours while new shell hardens.</td><td>4–24 hours</td></tr>' +
      '<tr><td><strong>Inter-molt</strong></td><td>Normal active behavior. Shell fully hardened. Shrimp feeds and grows until the next cycle begins.</td><td>Days to weeks</td></tr>' +
    '</tbody></table>' +

    '<div class="info-card reveal"><div class="info-card-title">Leave the shed shell in the tank</div><div class="info-card-body">A discarded molt shell is not waste - it is a calcium-rich resource. Shrimp will eat it within 24–48 hours. Only remove it if it is still there after 3 days and starting to foul. Tanks with many shrimp molting regularly rarely need shells removed at all.</div></div>' +

    '<h2 class="section-heading reveal">White Ring of Death (WROD)</h2>' +
    '<p class="prose reveal">The White Ring of Death is a failed molt where the shrimp cannot free itself from the old shell. A visible white ring appears around the junction between head and body - the shell has hardened in the wrong position, trapping the shrimp. It is almost always fatal once visible.</p>' +
    '<div class="highlight-box gold reveal"><strong>Causes of WROD:</strong> Low GH (insufficient calcium/magnesium for shell formation), sudden parameter change during pre-molt, copper contamination, or unstable KH causing pH swings. The most preventable cause is low GH - keep GH above 6 dGH for Neocaridina and test it regularly.</div>' +
    '<p class="prose reveal">If you see a WROD shrimp, do not attempt to help it shed by force - this almost always causes fatal injury. Ensure other shrimp cannot stress it, and monitor. Very rarely a shrimp will free itself from an early-stage WROD. More often it will not survive.</p>' +

    '<h2 class="section-heading reveal">Other common health issues</h2>' +
    '<table class="data-table reveal"><thead><tr><th>Problem</th><th>Signs</th><th>Likely cause</th><th>Action</th></tr></thead><tbody>' +
      '<tr><td><strong>Sudden mass death</strong></td><td>Multiple shrimp dead within hours</td><td>Ammonia/nitrite spike, copper exposure, temperature shock</td><td>Test water immediately. 20% water change with dechlorinated water. Check for copper sources (medications, pipes, fertilizers).</td></tr>' +
      '<tr><td><strong>Gradual die-off</strong></td><td>1–2 deaths per week over several weeks</td><td>Unstable parameters, low GH, bacterial infection, old age</td><td>Test GH, KH, pH trend. Check for molt failures. Increase water change frequency temporarily.</td></tr>' +
      '<tr><td><strong>Lethargy / not eating</strong></td><td>Shrimp sits still, ignores food</td><td>Pre-molt (normal), or poor water quality</td><td>Test parameters. If parameters are fine and shrimp molts within a week, it was pre-molt behavior.</td></tr>' +
      '<tr><td><strong>Milky / opaque body</strong></td><td>Shrimp body turns white or cloudy</td><td>Bacterial infection (Milky Disease), or pre-death stress response</td><td>Isolate affected shrimp. No reliable treatment - remove and euthanize humanely (clove oil) to prevent spread.</td></tr>' +
      '<tr><td><strong>Spinning / erratic swimming</strong></td><td>Shrimp swims in circles or corkscrews</td><td>Ammonia poisoning, copper, or neurological stress</td><td>Emergency 30% water change. Test immediately. Likely fatal if prolonged.</td></tr>' +
      '<tr><td><strong>Vorticella (fuzzy patches)</strong></td><td>White fuzzy tufts on shell or head</td><td>Vorticella protozoan - opportunistic in poor water</td><td>Salt dip (1 tsp non-iodized salt per liter for 30 seconds) or hydrogen peroxide dip. Improve water quality.</td></tr>' +
    '</tbody></table>' +

    '<h2 class="section-heading reveal">Copper: the silent killer</h2>' +
    '<div class="highlight-box gold reveal"><strong>Shrimp are extremely sensitive to copper.</strong> Even trace amounts lethal to shrimp are well below levels harmful to fish. Common copper sources: most fish medications (check labels), some plant fertilizers (especially cheap all-in-ones), old copper plumbing, and some tap water supplies. Always use a dechlorinator that binds heavy metals, and test any new product in a small container before adding it to the tank.</div>' +

    '<h2 class="section-heading reveal">Quarantine</h2>' +
    '<p class="prose reveal">New shrimp should ideally be quarantined for 2–4 weeks before introduction. A simple 5-gallon bucket with a cycled sponge filter is sufficient. This catches visible parasites, bacterial infections, and allows the shrimp to settle before the stress of introduction to a new colony. It also protects your established colony from any pathogens the new arrivals may carry.</p>' +

  '</div>';
}

// ── COMPATIBILITY ─────────────────────────────────────
function renderCompatibility() {
  return '<div class="page-body">' +

    '<div class="highlight-box gold reveal"><strong>The first rule of shrimp compatibility:</strong> when in doubt, leave it out. Shrimp are near the bottom of the freshwater food chain. Any fish with a mouth large enough to fit a shrimp will eventually eat one - often at night when you are not watching.</div>' +

    '<h2 class="section-heading reveal">Safe tank mates</h2>' +
    '<p class="prose reveal">The safest community for shrimp is a species-only tank. If you want to mix with fish, choose small, peaceful nano species that are too small to swallow an adult shrimp and lack the predatory instinct to hunt them. Shrimplets will still be at risk from most fish regardless of species.</p>' +
    '<table class="data-table reveal"><thead><tr><th>Species</th><th>Safety</th><th>Notes</th></tr></thead><tbody>' +
      '<tr><td><strong>Ember Tetra</strong></td><td>&#9989; Good</td><td>Tiny mouth, peaceful. Will eat shrimplets but largely ignore adults.</td></tr>' +
      '<tr><td><strong>Chili Rasbora</strong></td><td>&#9989; Good</td><td>One of the safest fish for shrimp - tiny and non-predatory toward adults.</td></tr>' +
      '<tr><td><strong>Celestial Pearl Danio</strong></td><td>&#9989; Good</td><td>Small mouth, active. May nibble at very young shrimplets.</td></tr>' +
      '<tr><td><strong>Otocinclus</strong></td><td>&#9989; Excellent</td><td>Algae grazer, completely ignores shrimp of all sizes. Great tank mate.</td></tr>' +
      '<tr><td><strong>Pygmy Corydoras</strong></td><td>&#9989; Good</td><td>Bottom dwellers that compete for food space but do not eat shrimp.</td></tr>' +
      '<tr><td><strong>Endlers Livebearer</strong></td><td>&#9989; Good</td><td>Small and fast but rarely predatory toward adult shrimp. Shrimplets at risk.</td></tr>' +
      '<tr><td><strong>Sparkling Gourami</strong></td><td>&#9888;&#65039; Caution</td><td>Generally peaceful but may take shrimplets. Monitor closely.</td></tr>' +
      '<tr><td><strong>Honey Gourami</strong></td><td>&#9888;&#65039; Caution</td><td>Larger than Sparkling; will eat shrimplets and may go for small adults.</td></tr>' +
      '<tr><td><strong>Betta</strong></td><td>&#9888;&#65039; Individual</td><td>Entirely individual personality. Some ignore shrimp; others hunt them obsessively. Never a safe guarantee.</td></tr>' +
      '<tr><td><strong>Neon / Cardinal Tetra</strong></td><td>&#9888;&#65039; Caution</td><td>Large enough to eat small adults. Risky in small tanks.</td></tr>' +
    '</tbody></table>' +

    '<h2 class="section-heading reveal">Fish to avoid</h2>' +
    '<table class="data-table reveal"><thead><tr><th>Species / type</th><th>Why</th></tr></thead><tbody>' +
      '<tr><td><strong>Any cichlid</strong></td><td>Predatory, territorial, and will systematically hunt shrimp</td></tr>' +
      '<tr><td><strong>Goldfish / Koi</strong></td><td>Will eat anything that fits in their mouth - including adult Neocaridina</td></tr>' +
      '<tr><td><strong>Gourami (large)</strong></td><td>Pearl, Blue, and Gold Gourami are large enough to eat adult shrimp</td></tr>' +
      '<tr><td><strong>Angelfish</strong></td><td>Will eat shrimp as a primary food source</td></tr>' +
      '<tr><td><strong>Barbs (most)</strong></td><td>Tiger and Rosy barbs are fin-nippers and shrimp-eaters</td></tr>' +
      '<tr><td><strong>Loaches</strong></td><td>Most loach species will hunt and eat dwarf shrimp</td></tr>' +
      '<tr><td><strong>Any fish over 2 inches</strong></td><td>A general rule: if it can fit a shrimp in its mouth, it will eventually try</td></tr>' +
    '</tbody></table>' +

    '<h2 class="section-heading reveal">Snail companions</h2>' +
    '<p class="prose reveal">Snails and shrimp are natural companions - they occupy different niches, eat different things, and benefit from each other\'s presence in a healthy ecosystem. Snails clean up missed food and algae; their grazing disturbs surfaces in ways that expose fresh biofilm for shrimp.</p>' +
    '<div class="species-grid">' +
      '<div class="species-card reveal"><span class="species-emoji">🐌</span><div class="species-name">Nerite Snail</div><div class="species-latin">Neritina spp.</div><p class="info-card-body" style="margin-top:0.5rem;font-size:0.8rem;">Best algae eaters in the hobby. Cannot breed in freshwater - no population explosion risk. Leave white eggs on glass and hardscape that are harmless but not easily removed.</p></div>' +
      '<div class="species-card reveal"><span class="species-emoji">🐌</span><div class="species-name">Mystery Snail</div><div class="species-latin">Pomacea bridgesii</div><p class="info-card-body" style="margin-top:0.5rem;font-size:0.8rem;">Large, peaceful, and good algae grazers. Lay eggs above the waterline - easy to control population. Will not harm shrimp of any size. Large individual appetite - see the stocking table below for how many is appropriate alongside shrimp.</p></div>' +
      '<div class="species-card reveal"><span class="species-emoji">🐌</span><div class="species-name">Ramshorn Snail</div><div class="species-latin">Planorbidae</div><p class="info-card-body" style="margin-top:0.5rem;font-size:0.8rem;">Excellent biofilm and algae grazers. Breed readily - population can grow large in well-fed tanks. Generally welcome in shrimp tanks for their grazing contribution.</p></div>' +
      '<div class="species-card reveal"><span class="species-emoji">🐌</span><div class="species-name">Bladder Snail</div><div class="species-latin">Physidae (Physella acuta)</div><p class="info-card-body" style="margin-top:0.5rem;font-size:0.8rem;">Usually arrives as an uninvited hitchhiker on plants rather than a deliberate addition, and carries a "pest" reputation for good reason - it is the most prolific breeder of the common snails, self-fertilizing and capable of overrunning a tank within weeks. Completely harmless to shrimp and a genuinely useful biofilm and detritus grazer in modest numbers. Most keepers either tolerate a small population for its cleanup value or add an Assassin Snail (below) to keep it in check once it multiplies past a comfortable level.</p></div>' +
    '</div>' +

    '<h3 class="section-heading reveal" style="font-size:1rem;margin-bottom:0.5rem">Mystery Snail stocking for a shrimp tank</h3>' +
    '<p class="prose reveal">General community-tank guidance for Mystery Snails is around 1 per 5 gallons, based mainly on their bioload. In a shrimp tank, feeding competition is the bigger concern - a single Mystery Snail can strip a mulberry leaf or food tablet before shrimp get meaningful access. Stocking toward the lower end below keeps that competition manageable.</p>' +
    '<table class="data-table reveal"><thead><tr><th>Tank size</th><th>Recommended Mystery Snails</th></tr></thead><tbody>' +
      '<tr><td>5–10 gallons</td><td>1</td></tr>' +
      '<tr><td>15–20 gallons</td><td>1–2</td></tr>' +
      '<tr><td>29–40 gallons</td><td>2–3</td></tr>' +
      '<tr><td>55+ gallons</td><td>3–5</td></tr>' +
    '</tbody></table>' +
    '<div class="highlight-box teal reveal"><strong>Already over this range?</strong> You don\'t need to rehome snails immediately - see "Adjusting feeding for a heavier snail population" on the Naturals &amp; Botanicals page for how to keep shrimp fed without simply removing snails.</div>' +

    '<div class="info-card reveal"><div class="info-card-title">Assassin Snail as population control</div><div class="info-card-body">Assassin Snails (Clea helena) eat pest snails (bladder, Malaysian trumpet) but do not harm shrimp. A useful tool if ramshorn or bladder snail populations get out of hand. Keep only 1–2 per 10 gallons - they breed slowly but will eventually reduce pest snail populations significantly.</div></div>' +

    '<h2 class="section-heading reveal">Mixing Neocaridina color forms</h2>' +
    '<div class="highlight-box blue reveal"><strong>Do not mix Neocaridina color forms</strong> unless you are happy with brown offspring. All Neocaridina davidi color forms interbreed freely. Within 1–2 generations, a mixed tank will produce mostly wild-type brown shrimp as recessive genetics reassert. Keep one color form per tank to maintain color integrity.</div>' +

    '<h2 class="section-heading reveal">Mixing shrimp species</h2>' +
    '<table class="data-table reveal"><thead><tr><th>Mix</th><th>Will they interbreed?</th><th>Safe together?</th></tr></thead><tbody>' +
      '<tr><td>Neocaridina + Ghost Shrimp</td><td>No: different genus</td><td>&#9989; Yes: Ghost Shrimp ignore Neos; watch for size difference</td></tr>' +
      '<tr><td>Neocaridina + Bamboo Shrimp</td><td>No: different genus</td><td>&#9989; Yes: Bamboo Shrimp are fully peaceful</td></tr>' +
      '<tr><td>Ghost + Bamboo Shrimp</td><td>No</td><td>&#9989; Yes: no competition or aggression</td></tr>' +
      '<tr><td>Two Neo color forms</td><td>Yes: same species</td><td>&#9888;&#65039; Colors will mix within generations</td></tr>' +
      '<tr><td>Neocaridina + Caridina</td><td>No: different genus</td><td>&#9888;&#65039; Water parameters conflict - Neos need harder water than most Caridina</td></tr>' +
    '</tbody></table>' +

  '</div>';
}

          a: 'Neocaridina handle line-breeding (what would be considered inbreeding in vertebrates) remarkably well compared to fish or mammals. Their short generation time and large clutch sizes mean harmful recessive traits are quickly selected against. That said, occasional genetic refresh prevents gradual fitness decline, color drift, and the emergence of deformities. Introducing 3-5 unrelated high-grade shrimp from a reputable source once every 12-18 months is more than sufficient to maintain genetic vigor in a typical hobby colony. Make sure new arrivals come from a disease-free, healthy source - quarantine them for 2-4 weeks before adding to your main tank. Signs that a colony may benefit from genetic refresh: increasing proportion of deformed or translucent shrimp, declining clutch sizes, poor survival of young, or consistent color regression despite culling.'
        },
        {
          q: 'My shrimp count keeps dropping despite no obvious deaths - what is happening?',
          a: 'Shrimp deaths often go unnoticed because shrimp are extremely efficient at consuming each other. A shrimp that dies is cannibalized by tank mates within hours - often completely, leaving no trace. What looks like a mysteriously declining count is frequently normal attrition being concealed by this behavior. To distinguish natural attrition from a real problem: (1) Track the colony size monthly, not daily. Natural attrition in a healthy colony is offset by births. If total count is declining month over month, there is a problem. (2) Check for shrimplet survival - if adults are present and females are berried but you never see juveniles growing up, something is consuming or preventing shrimplet survival (predatory tank mates, filter intake, starvation). (3) Test parameters weekly. Slow chronic issues - creeping nitrate, gradual pH drift, declining GH - kill shrimp invisibly over weeks. (4) Look inside filter intakes. Shrimplets routinely enter unprotected HOB and canister filters and die there.'
        }
      ]
    },
    {
      icon: '🤝',
      title: 'Compatibility & Tank Mates',
      faqs: [
        {
          q: 'Can Neocaridina live with Amano Shrimp or Ghost Shrimp?',
          a: 'Amano Shrimp (Caridina multidentata) are excellent companions for Neocaridina - completely peaceful, from a different genus so no interbreeding is possible, and superb algae eaters. The only consideration is that Amanos are significantly larger and faster at food pellets, so make sure Neocaridina have access to food by placing wafers in multiple locations. Ghost Shrimp require an important caveat: true Ghost Shrimp (Palaemonetes paludosus) are peaceful and fine with Neocaridina. However, a species called Whisker Shrimp (Macrobrachium species) is frequently mislabelled and sold as Ghost Shrimp in many stores. Whisker Shrimp are significantly larger, have distinctly longer front claws, and are aggressive predators that will actively hunt and eat Neocaridina - including adults. If you have "Ghost Shrimp" that seem to be growing unusually large or that your Neocaridina avoid, suspect Whisker Shrimp and separate them immediately. True Ghost Shrimp stay small, transparent, and uninterested in other shrimp.'
        },
        {
          q: 'Which fish are actually safe with shrimp?',
          a: 'The safest fish for a shrimp tank are small, peaceful species whose mouths are physically too small to swallow an adult Neocaridina. Best options: Ember Tetra: tiny (2cm), peaceful, and largely uninterested in adult shrimp; one of the most reliably safe choices. Chili Rasbora (Boraras brigittae) - among the smallest freshwater fish available, completely non-predatory toward adults. Otocinclus: algae grazers that completely ignore shrimp of all sizes; arguably the single best fish companion for a shrimp tank. Pygmy Corydoras (Corydoras pygmaeus or hastatus) - small bottom dwellers that occupy different space and do not hunt shrimp. Celestial Pearl Danio: small enough to be safe with adults but will eat shrimplets. All nano fish will eat shrimplets to some extent - dense moss is essential to give juveniles refuge. Avoid: any fish over 4cm, bettas (individual variation makes them unpredictable), most gouramis, cichlids of any size, goldfish, loaches, and anything with a mouth large enough to accept a shrimp.'
        },
        {
          q: 'Can I mix different Neocaridina color forms in the same tank?',
          a: 'Technically yes, but you should not if you care about maintaining color. All Neocaridina color forms - Cherry, Blue Dream, Bloody Mary, Snowball, Yellow, Orange, Chocolate - are the same species: Neocaridina davidi. They interbreed freely and enthusiastically. In a mixed tank, within 1-2 generations the offspring will begin expressing recessive wild-type genetics and the colony will trend toward brown or greenish-gray "wild-type" coloration. This is not harmful to the shrimp - they are perfectly healthy - but the visual result is a colony of unremarkable wild-colored shrimp. If you want to mix color forms for aesthetic reasons and do not mind the genetic outcome, there is no welfare concern. If you want to maintain distinct color forms, keep each color form in its own dedicated tank. You can keep Neocaridina with shrimp of different genera (Amano, Ghost, Bamboo) without any genetic mixing.'
        }
      ]
    }
  ];

          '<span class="trbl-crossref-icon">&#128202;</span>' +
          '<div><div class="trbl-crossref-title">Tank Evaluator</div>' +
          '<div class="trbl-crossref-desc">Enter your full setup and get a scored assessment with predictive warnings and priority recommendations.</div></div>' +
        '</button>' +

    '</div>';

  return '<div class="page-body" style="max-width:900px">' +
    '<p class="prose reveal">33 questions across 7 categories - every answer written for shrimp keepers, not general fishkeeping. Click any question to expand the answer.</p>' +
    crossRefs +
