<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>The Shrimp Shelf: Freshwater Shrimp Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --blue-deep:    #0a1828;
  --blue-mid:     #0e2240;
  --blue-panel:   #122a50;
  --sapphire:     #2a5298;
  --cerulean:     #4a9fd4;
  --cerulean-lt:  #7ec0e8;
  --cerulean-pale:#d0eaf8;
  --sand:         #f7f4ef;
  --sand-dark:    #ede8e0;
  --gold:         #c9a84c;
  --gold-pale:    #f7f0dc;
  --moss:         #4a8a6a;
  --moss-pale:    #e0f0e8;
  --white:        #ffffff;
  --mid-text:     #5a6e85;
  --light-text:   #8aa0bb;
  --border:       rgba(42,82,152,0.12);
  --border-soft:  rgba(42,82,152,0.06);
  --sidebar-w:    245px;
  --ease:         cubic-bezier(0.4,0,0.2,1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--ink);
  color: var(--blue-deep);
  min-height: 100vh;
  display: flex;
  overflow-x: hidden;
}

/* ── SIDEBAR ─────────────────────────────────────────── */
.sidebar {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: var(--sidebar-w);
  background: linear-gradient(180deg, #0a1828 0%, #0e2240 60%, #0a1e3a 100%);
  border-right: 1px solid rgba(74,159,212,0.13);
  display: flex;
  flex-direction: column;
  z-index: 200;
  transition: transform 0.32s var(--ease);
  overflow-y: auto;
  overflow-x: hidden;
}

.sidebar::-webkit-scrollbar { width: 3px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: rgba(74,159,212,0.2); border-radius: 2px; }

/* Bubbles in sidebar */
.sidebar-bubbles {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

.sidebar-brand {
  padding: 1.5rem 1.25rem 1.1rem;
  border-bottom: 1px solid rgba(74,159,212,0.1);
  position: relative;
  z-index: 1;
}

.brand-name {
  font-family: 'Lora', serif;
  font-size: 1.2rem;
  font-weight: 600;
  color: var(--on-ink);
  letter-spacing: -0.01em;
  line-height: 1.2;
}

.brand-tag {
  font-size: 0.67rem;
  color: var(--cerulean-lt);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-top: 0.2rem;
  font-weight: 400;
  opacity: 0.85;
}

.brand-shimmer {
  height: 2px;
  margin-top: 0.85rem;
  background: linear-gradient(90deg,
    transparent,
    var(--cerulean) 25%,
    var(--cerulean-lt) 50%,
    var(--cerulean) 75%,
    transparent);
  background-size: 200% 100%;
  animation: shimmer 4s linear infinite;
  border-radius: 2px;
}

@keyframes shimmer {
  0%   { background-position: 200% center; }
  100% { background-position: -200% center; }
}

.sidebar-section-label {
  font-size: 0.58rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.25);
  padding: 1rem 1.25rem 0.3rem;
  font-weight: 500;
  position: relative;
  z-index: 1;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.52rem 1.25rem;
  cursor: pointer;
  transition: background 0.18s;
  border-left: 2px solid transparent;
  position: relative;
  z-index: 1;
}

.nav-item:hover { background: rgba(74,159,212,0.08); }
.nav-item.active {
  background: rgba(74,159,212,0.15);
  border-left-color: var(--cerulean);
}

.nav-icon { font-size: 0.9rem; width: 1.2rem; text-align: center; flex-shrink: 0; }
.nav-label { font-size: 0.81rem; color: rgba(255,255,255,0.65); flex: 1; }
.nav-item.active .nav-label,
.nav-item:hover .nav-label { color: var(--on-ink); }
.nav-item.active .nav-label { font-weight: 500; }
.nav-num {
  font-family: 'DM Mono', monospace;
  font-size: 0.58rem;
  color: rgba(255,255,255,0.18);
}
.nav-item.active .nav-num { color: var(--cerulean-lt); }

.sidebar-footer {
  margin-top: auto;
  padding: 1rem 1.25rem;
  border-top: 1px solid rgba(74,159,212,0.08);
  font-size: 0.67rem;
  color: rgba(255,255,255,0.2);
  line-height: 1.5;
  position: relative;
  z-index: 1;
}

/* ── BUBBLES ─────────────────────────────────────────── */
.bubble {
  position: absolute;
  bottom: -20px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(74,159,212,0.35), rgba(74,159,212,0.04));
  border: 1px solid rgba(74,159,212,0.22);
  animation: rise linear infinite;
}

@keyframes rise {
  0%   { transform: translateY(0) scale(1);      opacity: 0; }
  8%   { opacity: 0.9; }
  92%  { opacity: 0.5; }
  100% { transform: translateY(-105vh) scale(1.06); opacity: 0; }
}

/* ── OVERLAY ─────────────────────────────────────────── */
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 199;
  opacity: 0;
  transition: opacity 0.3s;
}
.sidebar-overlay.visible { opacity: 1; }

/* ── MAIN ────────────────────────────────────────────── */
.main {
  margin-left: var(--sidebar-w);
  flex: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--sand);
}

.topbar {
  display: none;
  align-items: center;
  gap: 1rem;
  padding: 0.85rem 1.25rem;
  background: linear-gradient(135deg, #0a1828, #0e2240);
  position: sticky;
  top: 0;
  z-index: 50;
  border-bottom: 1px solid rgba(74,159,212,0.15);
}

.topbar-brand {
  font-family: 'Lora', serif;
  font-size: 1rem;
  color: var(--on-ink);
  font-weight: 600;
}

.menu-btn {
  -webkit-appearance: none;
  appearance: none;
  background: none;
  border: none;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 4px;
}
.menu-btn span { display: block; width: 20px; height: 2px; background-color: #ffffff; border-radius: 2px; }

/* ── PAGES ───────────────────────────────────────────── */
.page { display: none; flex-direction: column; min-height: 100vh; animation: fadeIn 0.28s var(--ease); }
.page.active { display: flex; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── PAGE HEADER ─────────────────────────────────────── */
.page-header {
  background: linear-gradient(135deg, #0a1828 0%, #122a50 60%, #0e2240 100%);
  padding: 2.5rem 2.5rem 2rem;
  position: relative;
  overflow: hidden;
}

/* Bubbles container inside page header */
.header-bubbles {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

/* Shimmer line at bottom of header */
.page-header::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg,
    transparent,
    var(--cerulean) 25%,
    var(--cerulean-lt) 50%,
    var(--cerulean) 75%,
    transparent);
  background-size: 200% 100%;
  animation: shimmer 4s linear infinite;
  z-index: 2;
}

.page-eyebrow {
  font-size: 0.63rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--cerulean-lt);
  font-weight: 500;
  margin-bottom: 0.5rem;
  position: relative;
  z-index: 1;
}

.page-title {
  font-family: 'Lora', serif;
  font-size: 1.9rem;
  font-weight: 600;
  color: var(--on-ink);
  letter-spacing: -0.02em;
  line-height: 1.15;
  position: relative;
  z-index: 1;
}

.page-subtitle {
  margin-top: 0.45rem;
  font-size: 0.87rem;
  color: rgba(255,255,255,0.48);
  max-width: 58ch;
  line-height: 1.55;
  font-weight: 300;
  position: relative;
  z-index: 1;
}

/* ── PAGE BODY ───────────────────────────────────────── */
.page-body {
  padding: 2rem 2.5rem;
  flex: 1;
  max-width: 880px;
  background: var(--sand);
}

/* ── PAGE NAV ────────────────────────────────────────── */
.page-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.1rem 2.5rem;
  border-top: 1px solid var(--border);
  margin-top: auto;
  gap: 1rem;
  background: var(--sand);
}

.page-nav-btn {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 1rem;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.79rem;
  color: var(--blue-deep);
  transition: border-color 0.18s, box-shadow 0.18s;
}

.page-nav-btn:hover {
  border-color: var(--cerulean);
  box-shadow: 0 2px 8px rgba(74,159,212,0.18);
}

.page-nav-btn.primary {
  background: var(--sapphire);
  border-color: var(--sapphire);
  color: var(--on-ink);
}

.page-nav-btn.primary:hover {
  background: #3a69b8;
  box-shadow: 0 2px 10px rgba(42,82,152,0.35);
}

.page-nav-btn.invisible { opacity: 0; pointer-events: none; }

.nav-btn-inner { display: flex; flex-direction: column; line-height: 1.2; }
.nav-btn-label { font-size: 0.62rem; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.08em; }
.nav-btn-title { font-weight: 500; font-size: 0.8rem; }
.page-indicator { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--mid-text); }

/* ── CONTENT COMPONENTS ──────────────────────────────── */
.section-heading {
  font-family: 'Lora', serif;
  font-size: 1.15rem;
  font-weight: 600;
  color: var(--blue-deep);
  margin: 2rem 0 0.7rem;
  padding-bottom: 0.35rem;
  border-bottom: 1px solid var(--border);
}
.section-heading:first-child { margin-top: 0; }

.prose { font-size: 0.88rem; line-height: 1.75; color: #3a4e65; max-width: 70ch; }
.prose + .prose { margin-top: 0.7rem; }

.info-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.1rem 1.3rem;
  margin: 0.85rem 0;
  box-shadow: 0 1px 6px rgba(42,82,152,0.06);
}
.info-card-title { font-weight: 600; font-size: 0.86rem; color: var(--blue-deep); margin-bottom: 0.3rem; }
.info-card-body  { font-size: 0.82rem; color: var(--mid-text); line-height: 1.6; }

.highlight-box {
  border-radius: 10px;
  padding: 0.95rem 1.2rem;
  margin: 0.85rem 0;
  font-size: 0.85rem;
  line-height: 1.65;
}
.highlight-box.blue  { background: rgba(208,234,248,0.55); border-left: 3px solid var(--sapphire); color: #1a3055; }
.highlight-box.gold  { background: var(--gold-pale);       border-left: 3px solid var(--gold);     color: #5a3e10; }
.highlight-box.moss  { background: var(--moss-pale);        border-left: 3px solid var(--moss);     color: #2e4a38; }
.highlight-box.water { background: rgba(74,159,212,0.08);  border-left: 3px solid var(--cerulean); color: var(--blue-deep); }

.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 0.7rem;
  margin: 1rem 0;
}
.stat-pill {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.85rem 1rem;
  text-align: center;
  box-shadow: 0 1px 4px rgba(42,82,152,0.05);
}
.stat-pill-value { font-family: 'DM Mono', monospace; font-size: 1rem; font-weight: 500; color: var(--link); }
.stat-pill-label { font-size: 0.68rem; color: var(--mid-text); margin-top: 0.12rem; text-transform: uppercase; letter-spacing: 0.08em; }

.species-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
  gap: 1rem;
  margin: 1rem 0;
}
.species-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.2rem;
  transition: box-shadow 0.18s, transform 0.18s;
  box-shadow: 0 1px 6px rgba(42,82,152,0.06);
}
.species-card:hover {
  box-shadow: 0 6px 20px rgba(42,82,152,0.14);
  transform: translateY(-2px);
}
.species-emoji { font-size: 1.7rem; margin-bottom: 0.45rem; display: block; }
.species-name  { font-family: 'Lora', serif; font-size: 0.93rem; font-weight: 600; color: var(--blue-deep); margin-bottom: 0.08rem; }
.species-latin { font-size: 0.7rem; color: var(--mid-text); font-style: italic; margin-bottom: 0.55rem; }
.species-tag   { display: inline-block; font-size: 0.63rem; padding: 0.12rem 0.5rem; border-radius: 20px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.07em; }
.tag-neo    { background: rgba(42,82,152,0.1);   color: var(--link); }
.tag-ghost  { background: rgba(74,138,106,0.12); color: var(--moss); }
.tag-bamboo { background: var(--gold-pale);       color: #8a6020; }

.data-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin: 1rem 0; border-radius: 10px; overflow: hidden; }
.data-table th {
  text-align: left; padding: 0.55rem 0.9rem;
  background: linear-gradient(135deg, #0a1828, #122a50);
  color: rgba(255,255,255,0.85); font-weight: 500; font-size: 0.73rem; letter-spacing: 0.05em;
}
.data-table td { padding: 0.52rem 0.9rem; border-bottom: 1px solid var(--border-soft); color: #3a4e65; background: var(--white); vertical-align: top; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:nth-child(even) td { background: rgba(208,234,248,0.2); }

.video-wrap {
  position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;
  border-radius: 12px; background: var(--ink); margin: 0.85rem 0;
  box-shadow: 0 4px 24px rgba(10,24,40,0.25);
}
.video-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; border-radius: 12px; }

.ss-video-facade {
  position:absolute; inset:0; width:100%; height:100%; padding:0; border:none; border-radius:12px;
  overflow:hidden; cursor:pointer; background:#000;
}
.ss-video-facade img { width:100%; height:100%; object-fit:cover; display:block; opacity:0.9; transition:opacity 0.2s; }
.ss-video-facade:hover img { opacity:1; }
.ss-video-play { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); filter:drop-shadow(0 2px 8px rgba(0,0,0,0.4)); }
.ss-video-facade:focus-visible { outline:3px solid var(--cerulean-lt); outline-offset:3px; }
.ss-video-link { position:relative; z-index:1; display:inline-block; font-size:0.75rem; color:var(--cerulean-lt); text-decoration:none; }
.ss-video-link:hover { text-decoration:underline; }

.watch-first {
  background: linear-gradient(135deg, #0a1828 0%, #122a50 100%);
  border: 1px solid rgba(74,159,212,0.2);
  border-radius: 14px;
  padding: 1.2rem 1.4rem 1.3rem;
  margin-bottom: 1.75rem;
  position: relative;
  overflow: hidden;
}

/* Mini bubbles in watch-first card */
.watch-first-bubbles {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

.watch-first-label { font-size: 0.63rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--cerulean-lt); font-weight: 500; margin-bottom: 0.3rem; position: relative; z-index: 1; }
.watch-first-title { font-family: 'Lora', serif; font-size: 1rem; color: var(--on-ink); margin-bottom: 0.25rem; position: relative; z-index: 1; }
.watch-first-desc  { font-size: 0.79rem; color: rgba(255,255,255,0.45); margin-bottom: 0.8rem; position: relative; z-index: 1; }
.watch-first .video-wrap { position: relative; z-index: 1; }

.stub-wrap {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 4rem 2rem; text-align: center; gap: 0.7rem;
}
.stub-icon  { font-size: 2.8rem; }
.stub-title { font-family: 'Lora', serif; font-size: 1.15rem; color: var(--blue-deep); font-weight: 600; }
.stub-body  { font-size: 0.84rem; color: var(--mid-text); max-width: 38ch; line-height: 1.6; }
.stub-badge {
  display: inline-block;
  background: rgba(42,82,152,0.1);
  color: var(--link);
  font-size: 0.69rem;
  padding: 0.2rem 0.7rem;
  border-radius: 20px;
  font-weight: 500;
}

.reveal { opacity: 0; transform: translateY(14px); transition: opacity 0.48s var(--ease), transform 0.48s var(--ease); }
.reveal.visible { opacity: 1; transform: translateY(0); }

.faq-list { margin: 0.5rem 0; }
.faq-item { border-bottom: 1px solid var(--border-soft); }
.faq-item:last-child { border-bottom: none; }
.faq-question {
  width: 100%; background: none; border: none; text-align: left;
  padding: 0.95rem 0.2rem; font-family: 'Lora', serif; font-size: 0.93rem;
  font-weight: 600; color: var(--blue-deep); cursor: pointer;
  display: flex; justify-content: space-between; align-items: center;
  gap: 0.75rem; transition: color 0.15s;
}
.faq-question:hover { color: var(--link); }
.faq-chevron {
  font-size: 0.7rem; color: var(--cerulean); flex-shrink: 0;
  transition: transform 0.25s var(--ease);
  width: 20px; height: 20px; display: flex; align-items: center;
  justify-content: center; border: 1px solid rgba(74,159,212,0.3);
  border-radius: 50%; background: rgba(74,159,212,0.06);
}
.faq-item.open .faq-chevron { transform: rotate(180deg); }
.faq-answer { max-height: 0; overflow: hidden; transition: max-height 0.4s var(--ease); }
.faq-item.open .faq-answer { max-height: 1200px; }
.faq-answer-inner {
  padding: 0 0.2rem 1rem;
  font-size: 0.85rem; color: var(--mid-text); line-height: 1.75;
  border-top: 1px solid var(--border-soft);
  padding-top: 0.75rem;
}

/* ── RESPONSIVE ──────────────────────────────────────── */
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay { display: block; }
  .main { margin-left: 0; }
  .topbar { display: flex; }
  .page-header { padding: 1.5rem 1.25rem 1.25rem; }
  .page-title { font-size: 1.5rem; }
  .page-body { padding: 1.25rem; }
  .page-nav { padding: 1rem 1.25rem; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (prefers-reduced-motion: reduce) {
  .bubble { animation: none; display: none; }
  .brand-shimmer, .page-header::after { animation: none; }
  .reveal { opacity: 1; transform: none; transition: none; }
  .page { animation: none; }
}

/* ══════════════════════════════════════════════
   MOBILE KIT: tables on phones, touch sizing, search
══════════════════════════════════════════════ */
:root {
  --mk-bg: #ffffff; --mk-surface: var(--sand); --mk-text: var(--blue-deep); --mk-muted: var(--mid-text);
  --mk-accent: var(--sapphire); --mk-border: rgba(42,82,152,0.18); --mk-mark: rgba(201,168,76,0.38); --mk-hover: rgba(74,159,212,0.12);
}
.mk-table-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; max-width:100%; }
.mk-flash { animation:mkFlash 2.2s ease-out; }
@keyframes mkFlash { 0%,35% { box-shadow:0 0 0 3px var(--mk-accent); } 100% { box-shadow:0 0 0 3px transparent; } }

/* Phones: each table row becomes a labeled card */
@media (max-width: 640px) {
  table.mk-stack, table.mk-stack tbody, table.mk-stack tr, table.mk-stack td { display:block; width:100% !important; }
  table.mk-stack { background:none !important; box-shadow:none !important; border:none !important; border-radius:0 !important; overflow:visible !important; }
  table.mk-stack thead { display:none; }
  table.mk-stack tr {
    margin:0 0 0.75rem; padding:0.65rem 0.9rem; border:1px solid var(--mk-border) !important;
    border-radius:10px; background:var(--mk-surface) !important;
  }
  table.mk-stack td {
    border:none !important; padding:0.32rem 0 !important; text-align:left !important;
    background:none !important; white-space:normal !important;
  }
  table.mk-stack td::before {
    content:attr(data-label); display:block; font-size:0.64rem; font-weight:600; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--mk-muted); margin-bottom:0.1rem;
  }
  table.mk-stack td[data-label=""]::before { display:none; }
  table.mk-stack td:first-child {
    font-weight:600; font-size:0.95rem; padding-bottom:0.45rem !important; margin-bottom:0.2rem;
    border-bottom:1px solid var(--mk-border) !important;
  }
  table.mk-stack td:first-child::before { display:none; }
}

/* Touch screens: finger-sized controls; 16px text stops iPhones zooming into fields */
@media (pointer: coarse) {
  #pages-container input[type=number], #pages-container input[type=text], #pages-container input[type=date],
  #pages-container select, #pages-container textarea { font-size:16px !important; min-height:44px; }
  #pages-container input[type=checkbox], #pages-container input[type=radio] { width:22px; height:22px; flex-shrink:0; }
  #pages-container label:has(> input[type=checkbox]), #pages-container label:has(> input[type=radio]) { min-height:40px; display:flex; align-items:center; gap:0.55rem; }
  .page-nav-btn, .faq-question, .ev-action-btn, .tool-card a[href*="amazon.com"] { min-height:44px; }
}

/* Let the content column shrink to the phone's width (a long table was
   stretching it, and the overflow was being clipped off the right edge) */
.main { min-width:0; }
@media (pointer: coarse) {
  .tool-card a[href*="amazon.com"] { display:inline-flex !important; align-items:center; }
}

#pages-container select { max-width:100%; }

/* The menu's dim overlay only catches taps while the menu is open
   (it was invisibly covering the page on phones, swallowing the first tap) */
.sidebar-overlay { pointer-events:none; }
.sidebar-overlay.visible { pointer-events:auto; }

/* Search entry points */
.mk-search-btn {
  margin-left:auto; width:42px; height:42px; border-radius:50%; border:1px solid rgba(255,255,255,0.18);
  background:rgba(255,255,255,0.06); color:#fff; font-size:1.05rem; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center;
}
.mk-side-search {
  display:flex; align-items:center; gap:0.55rem; width:calc(100% - 2rem); margin:0.4rem 1rem 0.8rem;
  padding:0.55rem 0.75rem; border-radius:8px; border:1px solid rgba(255,255,255,0.14);
  background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.72); font:inherit; font-size:0.82rem;
  cursor:pointer; text-align:left; position:relative; z-index:2;
}
.mk-side-search:hover { border-color:rgba(255,255,255,0.32); color:#fff; }
.mk-side-label { flex:1; }
.mk-side-search kbd {
  font-family:inherit; font-size:0.7rem; padding:0.05rem 0.4rem; border-radius:4px;
  border:1px solid rgba(255,255,255,0.22); color:rgba(255,255,255,0.6);
}

/* Search panel */
.mk-search {
  position:fixed; inset:0; z-index:1300; background:rgba(0,0,0,0.5); display:none;
  align-items:flex-start; justify-content:center; padding:9vh 1rem 1rem;
}
.mk-search.open { display:flex; }
body.mk-lock { overflow:hidden; }
.mk-search-panel {
  width:min(640px, 100%); max-height:80vh; display:flex; flex-direction:column; overflow:hidden;
  background:var(--mk-bg); color:var(--mk-text); border:1px solid var(--mk-border); border-radius:14px;
  box-shadow:0 24px 60px rgba(0,0,0,0.4); font-family:'DM Sans',sans-serif;
}
.mk-search-box { display:flex; align-items:center; gap:0.6rem; padding:0.7rem 0.8rem 0.7rem 1rem; border-bottom:1px solid var(--mk-border); }
.mk-search-glass { font-size:1rem; opacity:0.7; }
.mk-search-box input {
  flex:1; min-width:0; border:none; outline:none; background:transparent; color:var(--mk-text);
  font:inherit; font-size:16px; padding:0.45rem 0;
}
.mk-search-box input::-webkit-search-cancel-button { display:none; }
.mk-search-close {
  border:1px solid var(--mk-border); background:var(--mk-surface); color:var(--mk-text);
  font:inherit; font-size:0.78rem; border-radius:16px; padding:0.4rem 0.8rem; min-height:36px; cursor:pointer;
}
.mk-search-results { overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:0.4rem 0.5rem 0.8rem; }
.mk-search-hint, .mk-search-count { font-size:0.8rem; color:var(--mk-muted); padding:0.6rem 0.6rem 0.4rem; }
.mk-search-count { font-size:0.7rem; text-transform:uppercase; letter-spacing:0.08em; }
.mk-search-pages { display:flex; flex-wrap:wrap; gap:0.4rem; padding:0.2rem 0.5rem 0.5rem; }
.mk-page-chip {
  border:1px solid var(--mk-border); background:var(--mk-surface); color:var(--mk-text); font:inherit;
  font-size:0.8rem; border-radius:18px; padding:0.45rem 0.8rem; min-height:38px; cursor:pointer;
}
.mk-page-chip:hover { border-color:var(--mk-accent); }
.mk-hit {
  display:flex; flex-direction:column; gap:0.15rem; width:100%; text-align:left; border:none;
  background:none; color:var(--mk-text); font:inherit; padding:0.6rem 0.65rem; border-radius:8px; cursor:pointer;
}
.mk-hit:hover, .mk-hit.sel { background:var(--mk-hover); }
.mk-hit-top { display:flex; align-items:baseline; gap:0.5rem; }
.mk-hit-title { flex:1; font-weight:600; font-size:0.92rem; line-height:1.35; }
.mk-hit-kind {
  flex-shrink:0; font-size:0.6rem; font-weight:600; text-transform:uppercase; letter-spacing:0.08em;
  color:var(--mk-accent); border:1px solid var(--mk-border); border-radius:10px; padding:0.08rem 0.45rem;
}
.mk-hit-where { font-size:0.72rem; color:var(--mk-muted); }
.mk-hit-snip { font-size:0.78rem; line-height:1.5; color:var(--mk-muted); }
.mk-hit mark { background:var(--mk-mark); color:inherit; border-radius:2px; padding:0 1px; }
@media (max-width: 768px) {
  .mk-search { padding:0; background:var(--mk-bg); }
  .mk-search-panel { max-height:none; height:100%; height:100dvh; border:none; border-radius:0; box-shadow:none; }
  .mk-search-box { padding-top:max(0.7rem, env(safe-area-inset-top)); }
  .mk-side-search { display:none; }
}
@media (prefers-reduced-motion: reduce) { .mk-flash { animation:none; outline:3px solid var(--mk-accent); } }

/* ══════════════════════════════════════════════
   PHOTO CARDS (V1.3): photos and detail sheet
   Photos come from Wikipedia (free-licensed lead image) and
   iNaturalist (Creative Commons photos only), always credited.
══════════════════════════════════════════════ */
.ss-clickable { cursor:pointer; }
.ss-clickable:focus-visible { outline:2px solid var(--sapphire); outline-offset:3px; }
tr.ss-clickable:hover td { background:var(--cerulean-pale) !important; }
h2.ss-clickable:hover { color: var(--link); }
tr[data-ss-slug] > td { vertical-align:middle; }
.ss-thumb-wrap { display:flex; align-items:center; gap:0.6rem; min-width:9rem; }
.ss-thumb {
  display:inline-block; width:40px; height:40px; border-radius:50%; overflow:hidden; vertical-align:middle;
  background:var(--sand-dark); border:2px solid var(--white);
  box-shadow:0 1px 4px rgba(10,24,40,0.18); flex-shrink:0;
}
.ss-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
.ss-photo {
  position:relative; margin:0 0 0.9rem; aspect-ratio:16/10; overflow:hidden; border-radius:8px;
  background:var(--sand-dark); border:1px solid var(--border);
}
.ss-photo.ss-banner { aspect-ratio:21/9; max-width:640px; margin:0.2rem 0 1.2rem; }
.ss-photo img { display:block; width:100%; height:100%; object-fit:cover; transition:transform 0.5s ease; }
.ss-clickable:hover .ss-photo img, .ss-photo.ss-clickable:hover img { transform:scale(1.04); }
.ss-loading {
  background:linear-gradient(100deg, var(--sand-dark) 30%, var(--cerulean-pale) 50%, var(--sand-dark) 70%);
  background-size:300% 100%; animation:ssShimmer 1.4s ease-in-out infinite;
}
@keyframes ssShimmer { 0% { background-position:100% 0; } 100% { background-position:0 0; } }
.ss-photo-credit {
  position:absolute; left:0; right:0; bottom:0; padding:1.2rem 0.6rem 0.3rem; font-size:0.58rem; line-height:1.3;
  color:rgba(255,255,255,0.85); background:linear-gradient(transparent, rgba(0,0,0,0.6));
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.ss-photo-more {
  position:absolute; top:0.5rem; right:0.5rem; font-size:0.62rem; font-weight:600; letter-spacing:0.03em;
  color:var(--ink); background:rgba(255,255,255,0.88); border-radius:12px; padding:0.18rem 0.6rem;
  box-shadow:0 1px 4px rgba(0,0,0,0.15);
}

/* ── Detail sheet ── */
.ss-sheet-backdrop {
  position:fixed; inset:0; background:rgba(10,24,40,0.5); z-index:1190;
  opacity:0; pointer-events:none; transition:opacity 0.25s ease;
}
.ss-sheet-backdrop.open { opacity:1; pointer-events:auto; }
.ss-sheet {
  position:fixed; top:0; right:0; z-index:1200; width:min(500px, 94vw); height:100vh; height:100dvh;
  display:flex; flex-direction:column; background:var(--sand); color:var(--blue-deep);
  border-left:1px solid var(--border); box-shadow:-12px 0 40px rgba(10,24,40,0.25);
  transform:translateX(105%); transition:transform 0.3s cubic-bezier(.2,.8,.2,1); visibility:hidden;
}
.ss-sheet.open { transform:translateX(0); visibility:visible; }
.ss-sheet-grip { display:none; }
.ss-sheet-top {
  display:flex; align-items:center; gap:0.4rem; padding:0.75rem 0.75rem 0.75rem 1.1rem; flex-shrink:0;
  background:linear-gradient(135deg, #0a1828, #0e2240); color:#fff;
}
.ss-sheet-titles { flex:1; min-width:0; }
.ss-sheet-title { font-family:'Lora',serif; font-size:1.15rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ss-sheet-latin { font-family:'Lora',serif; font-style:italic; font-size:0.78rem; color:var(--cerulean-lt); }
.ss-icon-btn {
  flex-shrink:0; width:40px; height:40px; border-radius:50%; border:1px solid rgba(255,255,255,0.22);
  background:rgba(255,255,255,0.08); color:#fff; font-size:1rem; line-height:1; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center;
}
.ss-icon-btn:hover { background:rgba(255,255,255,0.18); }
.ss-icon-btn:disabled { opacity:0.3; cursor:default; }
.ss-sheet-scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding-bottom:2rem; }
.ss-gallery { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; background:#0a1828; aspect-ratio:4/3; }
.ss-gallery::-webkit-scrollbar { display:none; }
.ss-gallery figure { flex:0 0 100%; margin:0; scroll-snap-align:center; position:relative; }
.ss-gallery img { width:100%; height:100%; object-fit:contain; display:block; }
.ss-gallery-empty { flex:1; display:flex; align-items:center; justify-content:center; text-align:center; padding:1.5rem; font-size:0.82rem; color:var(--cerulean-pale); }
.ss-gallery-bar { display:flex; align-items:flex-start; gap:0.6rem; padding:0.5rem 1.1rem 0.2rem; font-size:0.66rem; line-height:1.45; color:var(--mid-text); }
.ss-gallery-bar a { color: var(--link); }
.ss-gallery-count { margin-left:auto; flex-shrink:0; color: var(--link); font-weight:600; }
.ss-gallery-note { padding:0 1.1rem; font-size:0.7rem; color:#8a6d1f; }
#ssSheetBody { padding:0.6rem 1.1rem 0; }
#ssSheetBody .page-body { padding:0; }
#ssSheetBody table { font-size:0.82rem; }
.ss-sheet-card { margin:0 !important; box-shadow:none !important; border:none !important; background:none !important; padding:0.3rem 0 !important; transform:none !important; }
.ss-row-detail { margin:0.3rem 0 0; }
.ss-row-detail dt { font-size:0.66rem; font-weight:600; text-transform:uppercase; letter-spacing:0.08em; color:var(--mid-text); margin-top:0.8rem; }
.ss-row-detail dd { font-size:0.92rem; line-height:1.6; color:var(--blue-deep); margin:0.15rem 0 0; }
.ss-from { font-size:0.72rem; color:var(--mid-text); margin-top:1rem; padding-top:0.7rem; border-top:1px solid var(--border); }
.ss-sheet-section { margin:1.1rem 1.1rem 0; padding:0.95rem 1rem; border-radius:8px; background:var(--white); border:1px solid var(--border); }
.ss-sheet-section h4 { font-size:0.68rem; text-transform:uppercase; letter-spacing:0.1em; color: var(--link); margin-bottom:0.45rem; }
.ss-sheet-section p { font-family:'Lora',serif; font-size:0.86rem; line-height:1.7; color:var(--blue-deep); }
.ss-sheet-section .ss-fine { font-family:'DM Sans',sans-serif; font-size:0.66rem; color:var(--mid-text); margin-top:0.5rem; }
.ss-sheet-section a { color: var(--link); }
.ss-links { display:flex; flex-wrap:wrap; gap:0.5rem; margin:1.1rem 1.1rem 0; }
.ss-link-btn {
  display:inline-flex; align-items:center; gap:0.35rem; min-height:40px; padding:0.45rem 0.9rem; border-radius:20px;
  border:1px solid var(--border); background:var(--white); color:var(--blue-deep); font-family:'DM Sans',sans-serif;
  font-size:0.78rem; text-decoration:none; cursor:pointer;
}
.ss-link-btn:hover { border-color:var(--sapphire); color: var(--link); }
body.ss-sheet-lock { overflow:hidden; }
@media (max-width: 899px) {
  .ss-sheet {
    top:auto; bottom:0; left:0; right:0; width:100%; height:92vh; height:92dvh; border-left:none;
    border-radius:16px 16px 0 0; overflow:hidden; box-shadow:0 -12px 40px rgba(10,24,40,0.35); transform:translateY(105%);
  }
  .ss-sheet.open { transform:translateY(0); }
  .ss-sheet.dragging { transition:none; }
  .ss-sheet-grip { display:flex; justify-content:center; padding:0.55rem 0 0.15rem; flex-shrink:0; touch-action:none; background:#0a1828; }
  .ss-sheet-grip span { width:42px; height:5px; border-radius:3px; background:rgba(255,255,255,0.35); }
  .ss-sheet-top { padding-top:0.35rem; touch-action:none; }
  .ss-photo.ss-banner { aspect-ratio:16/9; }
}
@media (prefers-reduced-motion: reduce) {
  .ss-sheet, .ss-sheet-backdrop, .ss-photo img { transition:none; }
  .ss-loading { animation:none; }
}

/* ══════════════════════════════════════════════
   IN SEASON NOW (V1.4) and CROSS-LINKS
══════════════════════════════════════════════ */
.ss-harvest {
  margin:0 0 2rem; padding:1.1rem 1.2rem 1rem; border-radius:14px; background:var(--white);
  border:1px solid var(--border); box-shadow:0 2px 14px rgba(10,24,40,0.06);
}
.ss-hv-head { display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; flex-wrap:wrap; margin-bottom:0.9rem; }
.ss-hv-kicker { font-size:0.66rem; text-transform:uppercase; letter-spacing:0.14em; color: var(--link); font-weight:600; }
.ss-hv-title { font-family:'Lora',serif; font-size:1.25rem; color:var(--blue-deep); font-weight:600; margin-top:0.15rem; }
.ss-hv-sub { font-size:0.76rem; color:var(--mid-text); margin-top:0.2rem; }
.ss-hv-controls { display:flex; flex-wrap:wrap; gap:0.5rem; align-items:flex-end; }
.ss-hv-lbl { display:flex; flex-direction:column; gap:0.2rem; font-size:0.66rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--mid-text); font-weight:600; }
.ss-hv-lbl select {
  font:inherit; font-size:0.85rem; text-transform:none; letter-spacing:0; font-weight:400; color:var(--blue-deep);
  padding:0.4rem 0.5rem; min-height:38px; border-radius:8px; border:1px solid var(--border); background:var(--sand);
}
.ss-hv-preset {
  min-height:38px; padding:0.4rem 0.8rem; border-radius:19px; border:1px solid var(--border); background:var(--sand);
  color: var(--link); font-family:'DM Sans',sans-serif; font-size:0.78rem; cursor:pointer;
}
.ss-hv-preset:hover { border-color:var(--sapphire); }
.ss-hv-groups { display:grid; grid-template-columns:repeat(3, 1fr); gap:0.9rem; }
.ss-hv-group h4 { font-size:0.7rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--blue-deep); margin-bottom:0.45rem; display:flex; gap:0.4rem; align-items:center; }
.ss-hv-group h4 span { font-size:0.66rem; color: var(--on-ink); background:var(--sapphire); border-radius:9px; padding:0 0.45rem; }
.ss-hv-chips { display:flex; flex-direction:column; gap:0.4rem; }
.ss-hv-chip {
  display:flex; align-items:center; gap:0.55rem; padding:0.35rem 0.55rem 0.35rem 0.35rem; border-radius:10px; text-align:left;
  border:1px solid var(--border); background:var(--sand); cursor:pointer; font-family:'DM Sans',sans-serif; color:var(--blue-deep);
}
.ss-hv-chip:hover { border-color:var(--sapphire); background:var(--cerulean-pale); }
.ss-hv-chip img, .ss-hv-dot { width:38px; height:38px; border-radius:8px; object-fit:cover; flex-shrink:0; background:var(--sand-dark); }
.ss-hv-chip b { display:block; font-size:0.84rem; font-weight:600; }
.ss-hv-chip small { display:block; font-size:0.7rem; color:var(--mid-text); line-height:1.35; }
.ss-hv-empty { font-size:0.78rem; color:var(--mid-text); font-style:italic; }
.ss-hv-cal { margin-top:1rem; border-top:1px solid var(--border); padding-top:0.6rem; }
.ss-hv-cal summary { cursor:pointer; font-size:0.8rem; font-weight:600; color: var(--link); padding:0.3rem 0; min-height:32px; }
.ss-hv-row { display:grid; grid-template-columns:minmax(7rem, 11rem) 1fr; gap:0.6rem; align-items:center; padding:0.18rem 0; }
.ss-hv-name {
  text-align:left; background:none; border:none; padding:0; font-family:'DM Sans',sans-serif; font-size:0.78rem; color:var(--blue-deep);
  cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.ss-hv-name:hover { color: var(--link); text-decoration:underline; }
.ss-hv-cells { display:grid; grid-template-columns:repeat(12, 1fr); gap:3px; }
.ss-hv-cell { height:16px; border-radius:3px; background:var(--sand-dark); }
.ss-hv-cell.on { background:#3db87a; }
.ss-hv-cell.cur { outline:2px solid var(--blue-deep); outline-offset:0; }
.ss-hv-months .ss-hv-cells span { font-size:0.62rem; text-align:center; color:var(--mid-text); font-weight:600; }
.ss-hv-months .ss-hv-cells span.cur { color:var(--blue-deep); }
.ss-hv-buy { display:block; }
.ss-hv-buy span { display:block; font-size:0.72rem; color:var(--mid-text); font-style:italic; background:var(--sand); border-radius:3px; padding:0.1rem 0.5rem; }
.ss-hv-note { font-size:0.72rem; color:var(--mid-text); line-height:1.55; margin-top:0.8rem; }
.ss-hv-note a { color: var(--link); }
.ss-season-badge {
  display:inline-block; font-size:0.66rem; font-weight:600; color:var(--mid-text); background:var(--sand);
  border:1px solid var(--border); border-radius:10px; padding:0.1rem 0.55rem; margin:0 0 0.45rem;
}
.ss-season-badge.now { color:#1f7a4d; background:#3db87a1f; border-color:#3db87a55; }
.ss-season-badge.buy { color:#8a6d1f; background:#c9a84c1a; border-color:#c9a84c55; }
@media (max-width: 760px) {
  .ss-hv-groups { grid-template-columns:1fr; }
  .ss-hv-row { grid-template-columns:6.4rem 1fr; gap:0.4rem; }
  .ss-hv-cells { gap:2px; }
  .ss-hv-controls { width:100%; }
}
/* Cross-links */
.xl-note {
  display:flex; align-items:center; gap:0.7rem; flex-wrap:wrap; margin:0.9rem 0 1.4rem; padding:0.75rem 0.95rem; border-radius:10px;
  background:var(--cerulean-pale); border:1px solid rgba(42,82,152,0.18);
}
.xl-note-icon { font-size:1.3rem; }
.xl-note-text { flex:1; min-width:180px; font-size:0.84rem; color:var(--blue-deep); line-height:1.5; }
.xl-note-link { font-size:0.8rem; font-weight:600; color: var(--link); text-decoration:none; white-space:nowrap; }
.xl-note-link:hover { text-decoration:underline; }
.xl-side {
  display:block; margin:0 0 0.9rem; padding:0.6rem 0.75rem; border-radius:8px; text-decoration:none;
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12);
}
.xl-side:hover { border-color:rgba(255,255,255,0.3); }
.xl-side-kicker { display:block; font-size:0.6rem; text-transform:uppercase; letter-spacing:0.12em; color:rgba(255,255,255,0.45); }
.xl-side-name { display:block; font-size:0.86rem; color:#fff; margin:0.1rem 0; }
.xl-side-blurb { display:block; font-size:0.7rem; color:rgba(255,255,255,0.55); line-height:1.4; }

/* ══════════════════════════════════════════════
   COMPARE TRAY (V1.5)
══════════════════════════════════════════════ */
.ss-cmp-tray {
  position:fixed; left:50%; bottom:max(0.9rem, env(safe-area-inset-bottom)); transform:translate(-50%, 140%);
  z-index:1100; width:min(760px, calc(100vw - 1.5rem)); display:flex; align-items:center; gap:0.6rem; flex-wrap:wrap;
  padding:0.6rem 0.7rem; border-radius:14px; background:rgba(255,255,255,0.97); border:1px solid rgba(42,82,152,0.35);
  box-shadow:0 10px 34px rgba(0,0,0,0.5); transition:transform 0.3s cubic-bezier(.2,.8,.2,1);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
}
.ss-cmp-tray.show { transform:translate(-50%, 0); }
.ss-cmp-chips { display:flex; gap:0.35rem; flex-wrap:wrap; flex:1; min-width:0; }
.ss-cmp-chip {

══════════════════════════════════════════════ */
.ss-quiz-side {

.ss-quiz-invite {

.ss-quiz {

}

.ss-quiz-panel {
  width:min(560px, 100%); max-height:90vh; display:flex; flex-direction:column; overflow:hidden;
  background:var(--sand); border:1px solid rgba(42,82,152,0.25); border-radius:14px; box-shadow:0 24px 60px rgba(0,0,0,0.5);
}
.ss-quiz-top { display:flex; align-items:center; justify-content:space-between; padding:0.75rem 0.9rem 0.75rem 1.2rem; border-bottom:1px solid rgba(42,82,152,0.15); }

.ss-quiz-modes { display:grid; grid-template-columns:repeat(3, 1fr); gap:0.6rem; }
.ss-quiz-mode {

.ss-quiz-spin { width:34px; height:34px; margin:0 auto 0.8rem; border-radius:50%; border:3px solid rgba(42,82,152,0.2); border-top-color:var(--sapphire); animation:ssSpin 0.9s linear infinite; }

.ss-quiz-progress { display:flex; justify-content:space-between; font-size:0.72rem; color:var(--mid-text); text-transform:uppercase; letter-spacing:0.08em; }
.ss-quiz-bar { height:4px; border-radius:2px; background:rgba(42,82,152,0.15); margin:0.4rem 0 0.8rem; overflow:hidden; }
.ss-quiz-bar div { height:100%; background:var(--sapphire); transition:width 0.3s; }
.ss-quiz-photo { position:relative; margin:0; aspect-ratio:4/3; border-radius:10px; overflow:hidden; background:#0a1828; }
.ss-quiz-photo img { width:100%; height:100%; object-fit:contain; display:block; }
.ss-quiz-photo figcaption { position:absolute; left:0; right:0; bottom:0; padding:1rem 0.6rem 0.3rem; font-size:0.58rem; color:rgba(250,245,236,0.75); background:linear-gradient(transparent, rgba(10,24,40,0.55)); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.ss-quiz-opt {
  display:flex; align-items:center; gap:0.55rem; min-height:48px; padding:0.55rem 0.75rem; border-radius:9px; cursor:pointer; text-align:left;

}

.ss-quiz-opt:hover:not(:disabled) { border-color:var(--sapphire); background:rgba(42,82,152,0.15); }

@media (max-width: 768px) {

/* ══════════════════════════════════════════════
   MY SHELF and BUYER CARE SHEET (V1.5)
══════════════════════════════════════════════ */

/* ══════════════════════════════════════════════
   DARK MODE (V1.6): chosen in the sidebar: Auto (follow the device),
   Dark or Light. Surfaces and text flip; the dark banners, table heads
   and sidebar keep their own colors (--ink / --on-ink).
══════════════════════════════════════════════ */
:root { --ink:#0a1828; --on-ink:#ffffff; --link:#2a5298; }
html[data-theme="dark"] {
  color-scheme: dark;
  --sand:#0d1724; --sand-dark:#17283c; --white:#132233; --blue-deep:#e3ebf4;
  --mid-text:#a3b5ca; --light-text:#8197b0; --border:rgba(126,192,232,0.17); --border-soft:rgba(126,192,232,0.09);
  --cerulean-pale:#173552; --gold-pale:#2c2714; --moss-pale:#12302a; --link:#8cc2f0; --ink:#08121e;
  --mk-bg:#132233; --mk-hover:rgba(126,192,232,0.12); --mk-mark:rgba(201,168,76,0.45);
}
html[data-theme="dark"] body { background:var(--sand); }
html[data-theme="dark"] .ss-cmp-tray { background:rgba(19,34,51,0.97); }
html[data-theme="dark"] img { color-scheme:light; }
html[data-theme="dark"] .ss-season-badge.now { color:#7fe0ad; }
html[data-theme="dark"] .ss-season-badge.buy, html[data-theme="dark"] .ss-gallery-note { color:#e3c26a; }
.ss-theme-btn { justify-content:flex-start; }
/* Text and tints that the original stylesheet fixed for a light page */
:root { --m-text: var(--mid-text); }   /* used by the Naturals cards; was never defined */
html[data-theme="dark"] .prose, html[data-theme="dark"] .data-table td { color:#c9d6e4; }

<script>
'use strict';

var APP_VERSION = 'V1.6';

// To earn Amazon Associates commission on Gear & Supplies page links, set your
// tracking ID here (e.g. 'yourtag-20'). Leave blank for plain, un-tagged links.
var AMAZON_TAG = '';

function amazonSearch(query) {
  var url = 'https://www.amazon.com/s?k=' + encodeURIComponent(query);
  if (AMAZON_TAG) url += '&tag=' + encodeURIComponent(AMAZON_TAG);
  return url;
}

let currentPageId = PAGES[0].id;

// ── BUBBLES ───────────────────────────────────────────
function buildBubbles(containerId, count) {
  const wrap = document.getElementById(containerId);
  if (!wrap) return;
  for (let i = 0; i < count; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const s        = Math.random() * 18 + 5;
    const duration = Math.random() * 14 + 9;
    const left     = Math.random() * 100;
    const startOff = Math.random() * 80;
    b.style.cssText = 'width:' + s + 'px;height:' + s + 'px;left:' + left + '%;animation-duration:' + duration + 's;animation-delay:-' + (startOff / 100 * duration) + 's;';
    wrap.appendChild(b);
  }
}

// ── SIDEBAR ───────────────────────────────────────────
function buildSidebar() {
  const nav = document.getElementById('sidebarNav');
  const sections = [
    { label: 'Reference', ids: ['species','parameters','setup','plants','feeding','naturals','breeding','health','compatibility','gear'] },
    { label: 'Tools',     ids: ['evaluator'] },
    { label: 'Help',      ids: ['troubleshooting','glossary'] }
  ];

  nav.innerHTML = pageNavItem(PAGES[0], 0);

  sections.forEach(function(section) {
    const sectionPages = PAGES.filter(function(p) { return section.ids.includes(p.id); });
    if (!sectionPages.length) return;
    const labelEl = document.createElement('div');
    labelEl.className = 'sidebar-section-label';
    labelEl.textContent = section.label;
    nav.appendChild(labelEl);
    sectionPages.forEach(function(p) {
      const idx = PAGES.findIndex(function(pg) { return pg.id === p.id; });
      const div = document.createElement('div');
      div.innerHTML = pageNavItem(p, idx);
      nav.appendChild(div.firstElementChild);
    });
  });
}

function pageNavItem(p, i) {
  return '<div class="nav-item" data-id="' + p.id + '" onclick="navigateTo(\'' + p.id + '\')">' +
    '<span class="nav-icon">' + p.icon + '</span>' +
    '<span class="nav-label">' + p.title + '</span>' +
    '<span class="nav-num">' + String(i + 1).padStart(2, '0') + '</span>' +
    '</div>';
}

function setActiveNav(id) {
  document.querySelectorAll('.nav-item')
    .forEach(function(el) { el.classList.toggle('active', el.dataset.id === id); });
}

// ── NAVIGATION ────────────────────────────────────────
function navigateTo(id) {
  if (id === currentPageId) { closeSidebar(); return; }
  document.getElementById('page-' + currentPageId).classList.remove('active');
  const target = document.getElementById('page-' + id);
  if (!target) return;
  target.classList.add('active');
  currentPageId = id;
  if (typeof ssCardSetHash === 'function') ssCardSetHash(id);
  setActiveNav(id);
  closeSidebar();
  window.scrollTo(0, 0);
  // Rebuild header bubbles for newly shown page
  const hb = target.querySelector('.header-bubbles');
  if (hb && !hb.dataset.built) {
    buildBubbles(hb.id, 18);
    hb.dataset.built = '1';
  }
  setTimeout(triggerReveal, 60);
}

function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  const ov = document.getElementById('sidebarOverlay');
  ov.style.display = 'block';
  requestAnimationFrame(function() { ov.classList.add('visible'); });
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  const ov = document.getElementById('sidebarOverlay');
  ov.classList.remove('visible');
  setTimeout(function() { if (!ov.classList.contains('visible')) ov.style.display = 'none'; }, 300);
}

// ── PAGE NAV ──────────────────────────────────────────
function buildPageNav(index) {
  const prev = PAGES[index - 1];
  const next = PAGES[index + 1];
  const prevBtn = prev
    ? '<button class="page-nav-btn" onclick="navigateTo(\'' + prev.id + '\')">&#8592; <span class="nav-btn-inner"><span class="nav-btn-label">Previous</span><span class="nav-btn-title">' + prev.title + '</span></span></button>'
    : '<button class="page-nav-btn invisible">&#8592;</button>';
  const nextBtn = next
    ? '<button class="page-nav-btn primary" onclick="navigateTo(\'' + next.id + '\')"><span class="nav-btn-inner"><span class="nav-btn-label">Next</span><span class="nav-btn-title">' + next.title + '</span></span> &#8594;</button>'
    : '<button class="page-nav-btn invisible">&#8594;</button>';
  return '<div class="page-nav">' + prevBtn + '<span class="page-indicator">' + (index + 1) + ' / ' + PAGES.length + '</span>' + nextBtn + '</div>';
}

function buildPageHeader(p, index) {
  const bubbleId = 'hbubbles-' + p.id;

// ── WELCOME ───────────────────────────────────────────
function renderWelcome() {
  return '<div class="page-body">' +
    '<div class="highlight-box blue reveal"><strong>Welcome to The Shrimp Shelf</strong> - a hobbyist reference built around one of the most rewarding things you can keep in a small tank: freshwater dwarf shrimp. Whether you\'re setting up your first 5-gallon or troubleshooting a colony that won\'t breed, this guide has you covered.</div>' +
    '<h2 class="section-heading reveal">What this guide covers</h2>' +
    '<p class="prose reveal">The Shrimp Shelf focuses on three groups of freshwater shrimp well-suited to home aquariums: <strong>Neocaridina</strong> (cherry, blue dream, bloody mary, and their many color forms), <strong>Ghost Shrimp</strong> (peaceful, transparent, and often overlooked as a beginner species), and <strong>Bamboo / Vampire Shrimp</strong> (the gentle filter-feeders that reward a mature, well-planted tank).</p>' +
    '<p class="prose reveal">Each section stands alone - jump to what you need. The Tank Evaluator is fully interactive and works offline - enter your parameters, run a scored assessment, and download a formatted report with predictive warnings.</p>' +
    '<h2 class="section-heading reveal">Which shrimp is right for you?</h2>' +
    '<div class="species-grid">' +
      '<div class="species-card reveal"><span class="species-emoji">🦐</span><div class="species-name">Neocaridina</div><div class="species-latin">Neocaridina davidi &amp; forms</div><span class="species-tag tag-neo">Beginner</span><p class="info-card-body" style="margin-top:0.6rem;font-size:0.8rem;">Hardy, colorful, and forgiving of imperfect water. The best starting point for any new shrimp keeper. Available in dozens of color forms from cherry red to deep sapphire blue.</p></div>' +
      '<div class="species-card reveal"><span class="species-emoji">👻</span><div class="species-name">Ghost Shrimp</div><div class="species-latin">Palaemonetes paludosus</div><span class="species-tag tag-ghost">Easy</span><p class="info-card-body" style="margin-top:0.6rem;font-size:0.8rem;">Completely transparent, active, and inexpensive. Often sold as feeder shrimp but make fascinating display animals. Excellent cleaners and peaceful with most tank mates.</p></div>' +
      '<div class="species-card reveal"><span class="species-emoji">🎋</span><div class="species-name">Bamboo Shrimp</div><div class="species-latin">Atyopsis moluccensis</div><span class="species-tag tag-bamboo">Intermediate</span><p class="info-card-body" style="margin-top:0.6rem;font-size:0.8rem;">Filter-feeders that fan particles from the water column. Require a mature, established tank with good flow. Striking and peaceful - a rewarding intermediate species.</p></div>' +
    '</div>' +
    '<h2 class="section-heading reveal">A note on substrates</h2>' +
    '<div class="highlight-box water reveal">Unlike the Walstad method, The Shrimp Shelf recommends <strong>inert substrates</strong> for Neocaridina tanks. Active substrates can drive pH down over time, destabilizing the neutral-to-slightly-alkaline water chemistry Neocaridina thrive in. Stability matters more than any single parameter value - inert substrates make that stability easy to achieve and maintain.</div>' +
    '<h2 class="section-heading reveal">How to use this guide</h2>' +
    '<div class="stat-grid">' +
      '<div class="stat-pill reveal"><div class="stat-pill-value">01</div><div class="stat-pill-label">Read Tank Setup first</div></div>' +
      '<div class="stat-pill reveal"><div class="stat-pill-value">02</div><div class="stat-pill-label">Check Water Parameters</div></div>' +
      '<div class="stat-pill reveal"><div class="stat-pill-value">03</div><div class="stat-pill-label">Pick your species</div></div>' +
      '<div class="stat-pill reveal"><div class="stat-pill-value">04</div><div class="stat-pill-label">Run Tank Evaluator</div></div>' +
    '</div>' +
  '</div>';
}

// ── YouTube video: a preview that loads the player only when tapped ──
// YouTube refuses to play an embedded video unless it is told which page
// it is on (otherwise: "Error 153, video player configuration error").
// On a hosted page (GitHub Pages) the player is loaded with that
// information. A page opened straight from the computer (file://) has no
// address to give, so there the button opens the video on YouTube instead.
function ssVideoFacade(id, title) {
  return '<div class="video-wrap">' +
    '<button type="button" class="ss-video-facade" onclick="ssPlayVideo(this)" data-yt="' + id + '" data-title="' + title + '" aria-label="Play video: ' + title + '">' +
      '<img src="https://i.ytimg.com/vi/' + id + '/hqdefault.jpg" alt="" loading="lazy" decoding="async">' +
      '<span class="ss-video-play" aria-hidden="true"><svg viewBox="0 0 68 48" width="68" height="48"><path d="M66.5 7.7c-.8-2.9-3-5.2-5.9-6C55.3.3 34 .3 34 .3s-21.3 0-26.6 1.4c-2.9.8-5.1 3.1-5.9 6C.1 13 .1 24 .1 24s0 11 1.4 16.3c.8 2.9 3 5.2 5.9 6C12.7 47.7 34 47.7 34 47.7s21.3 0 26.6-1.4c2.9-.8 5.1-3.1 5.9-6 1.4-5.3 1.4-16.3 1.4-16.3s0-11-1.4-16.3z" fill="#f00"/><path d="M45 24 27 14v20z" fill="#fff"/></svg></span>' +
    '</button></div>' +
    '<a class="ss-video-link" href="https://www.youtube.com/watch?v=' + id + '" target="_blank" rel="noopener">Watch on YouTube &#8599;</a>';
}
function ssPlayVideo(btn) {
  var id = btn.getAttribute('data-yt');
  if (!/^https?:$/.test(location.protocol)) {
    window.open('https://www.youtube.com/watch?v=' + id, '_blank', 'noopener');
    return;
  }
  var f = document.createElement('iframe');
  f.src = 'https://www.youtube.com/embed/' + id + '?autoplay=1&rel=0';
  f.title = btn.getAttribute('data-title') || 'Video';
  f.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
  f.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
  f.setAttribute('allowfullscreen', '');
  btn.parentNode.replaceChild(f, btn);
}

// ── TANK SETUP ────────────────────────────────────────
function renderSetup() {
  return '<div class="page-body">' +
    '<div class="watch-first reveal">' +
      '<div class="watch-first-bubbles" id="wfBubbles"></div>' +
      '<div class="watch-first-label">&#128250; Watch First</div>' +
      '<div class="watch-first-title">Beginner Shrimp Tank Setup</div>' +
      '<div class="watch-first-desc">A great visual walkthrough before diving into the written guide below.</div>' +
      ssVideoFacade('nTbYQqX8He0', 'Beginner Shrimp Tank Setup') +
    '</div>' +
    '<h2 class="section-heading reveal">Tank size</h2>' +
    '<p class="prose reveal">Neocaridina can survive in tanks as small as 2.5 gallons, but <strong>5–10 gallons is the sweet spot</strong> for a beginner colony. Larger water volume means slower parameter swings - the single biggest cause of shrimp deaths is sudden chemistry change, and a bigger tank forgives the mistakes that would be fatal in a nano.</p>' +
    '<div class="highlight-box gold reveal"><strong>Minimum recommendation:</strong> 5 gallons for Neocaridina. 10 gallons for Ghost Shrimp. 15–20 gallons for Bamboo/Vampire Shrimp, which need established flow and a mature ecosystem.</div>' +
    '<h2 class="section-heading reveal">Filtration</h2>' +
    '<p class="prose reveal">The sponge filter is the standard in shrimp keeping for good reason: biological filtration, gentle flow, and a safe grazing surface - with zero risk of sucking up shrimplets. Pair with an air pump sized for your tank volume.</p>' +
    '<div class="info-card reveal"><div class="info-card-title">Why not a hang-on-back or canister filter?</div><div class="info-card-body">HOB and canister filters pull shrimplets and juveniles into the impeller. If you use one, cover the intake with a pre-filter sponge. For most shrimp tanks, a dual sponge filter provides all the filtration you need at a fraction of the cost.</div></div>' +
    '<h2 class="section-heading reveal">Substrate</h2>' +
    '<p class="prose reveal">For Neocaridina, choose an <strong>inert substrate</strong> - one that does not affect water chemistry. Plain gravel, coarse sand, or crushed lava rock all work well. Avoid active substrates (ADA Amazonia, SL-Aqua, etc.) which buffer pH downward.</p>' +
    '<table class="data-table reveal"><thead><tr><th>Substrate</th><th>pH effect</th><th>Neocaridina?</th><th>Notes</th></tr></thead><tbody>' +
      '<tr><td>Plain gravel</td><td>None</td><td>&#9989; Yes</td><td>Classic choice, easy to find</td></tr>' +
      '<tr><td>Pool filter sand</td><td>None</td><td>&#9989; Yes</td><td>Cheap, natural look, easy to clean</td></tr>' +
      '<tr><td>Crushed lava rock</td><td>None</td><td>&#9989; Yes</td><td>Great biofilm surface</td></tr>' +
      '<tr><td>Fluval Stratum</td><td>Lowers pH</td><td>&#9888;&#65039; Caution</td><td>Designed for Caridina</td></tr>' +
      '<tr><td>ADA Amazonia</td><td>Lowers pH significantly</td><td>&#10060; No</td><td>Active substrate, wrong chemistry</td></tr>' +
      '<tr><td>Coral / crushed coral</td><td>Raises pH/KH</td><td>&#9888;&#65039; Caution</td><td>Can push KH too high</td></tr>' +
    '</tbody></table>' +
    '<h2 class="section-heading reveal">Cycling your tank</h2>' +
    '<p class="prose reveal">Never add shrimp to an uncycled tank. The nitrogen cycle must establish a colony of beneficial bacteria before shrimp go in - ammonia and nitrite are lethal even at very low concentrations. A fishless cycle typically takes 4–6 weeks.</p>' +
    '<div class="highlight-box blue reveal"><strong>Fast cycle tip:</strong> Add a seeded sponge filter or substrate from an established tank. This transfers the bacteria colony and can reduce cycle time to 1–2 weeks. You\'re ready when ammonia and nitrite read 0 ppm after dosing.</div>' +
    '<h2 class="section-heading reveal">Hardscape &amp; cover</h2>' +
    '<p class="prose reveal">Shrimp are prey animals and feel safest with plenty of cover. Driftwood, smooth river stones, cholla wood, and dense plant growth all give shrimp places to hide during vulnerable molts and encourage natural foraging. Indian Almond Leaves (IAL) release tannins, provide a grazing surface, and have mild antibacterial properties.</p>' +
  '</div>';
}

// ── SPECIES PROFILES ──────────────────────────────────
function renderSpecies() {
  return '<div class="page-body">' +

    '<div class="highlight-box water reveal">This guide covers three groups suited to most home aquariums. Neocaridina are the backbone of the hobby - hardy, colorful, and endlessly varied. Ghost Shrimp are underrated and fascinating up close. Bamboo Shrimp reward patience with one of the most unusual feeding behaviors in freshwater.</div>' +

    '<h2 class="section-heading reveal">Neocaridina: Color Forms</h2>' +
    '<p class="prose reveal">All Neocaridina color forms are the same species - <em>Neocaridina davidi</em> - selectively bred for specific colors. They interbreed freely, so keep only one color form per tank unless you want wild-type offspring within a few generations.</p>' +

    '<table class="data-table reveal"><thead><tr><th>Common Name</th><th>Color</th><th>Grade note</th><th>Difficulty</th></tr></thead><tbody>' +
      '<tr><td><strong>Red Cherry</strong></td><td>Red, translucent to solid</td><td>Sakura &rarr; Fire Red &rarr; Painted Fire Red</td><td>&#9989; Beginner</td></tr>' +
      '<tr><td><strong>Blue Dream</strong></td><td>Deep sapphire to midnight blue</td><td>Higher grades more opaque; colony drifts without culling</td><td>&#9989; Beginner</td></tr>' +
      '<tr><td><strong>Yellow Goldenback</strong></td><td>Yellow with gold dorsal stripe</td><td>Stripe width and color density vary by line</td><td>&#9989; Beginner</td></tr>' +
      '<tr><td><strong>Snowball</strong></td><td>White, opaque</td><td>Eggs are bright white - easy to spot berried females</td><td>&#9989; Beginner</td></tr>' +
      '<tr><td><strong>Bloody Mary</strong></td><td>Deep red, near-opaque body</td><td>Darker than Fire Red; distinct line from Chocolate</td><td>&#9989; Beginner</td></tr>' +
      '<tr><td><strong>Blue Velvet</strong></td><td>Cerulean blue, translucent</td><td>Lighter than Blue Dream; rili pattern common in lower grades</td><td>&#9989; Beginner</td></tr>' +
      '<tr><td><strong>Chocolate</strong></td><td>Dark brown to near-black</td><td>Ancestral line for several blue and dark color forms</td><td>&#9989; Beginner</td></tr>' +
      '<tr><td><strong>Orange Sakura</strong></td><td>Orange to burnt orange</td><td>Color fades on light substrate - use dark sand or gravel</td><td>&#9989; Beginner</td></tr>' +
    '</tbody></table>' +

    '<div class="info-card reveal"><div class="info-card-title">On grading</div><div class="info-card-body">Grades (e.g. Sakura, Fire Red, Painted Fire Red) describe color density and coverage - not a different species or care requirement. Higher-grade shrimp cost more and look more impressive, but are identical to care for. Without selective culling, a high-grade colony will drift toward lower expression over several generations as recessive traits re-emerge.</div></div>' +

    '<h2 class="section-heading reveal">Neocaridina: Care Parameters</h2>' +
    '<div class="stat-grid">' +
      '<div class="stat-pill reveal"><div class="stat-pill-value">6.8–7.8</div><div class="stat-pill-label">pH range</div></div>' +
      '<div class="stat-pill reveal"><div class="stat-pill-value">7–15</div><div class="stat-pill-label">GH (dGH)</div></div>' +
      '<div class="stat-pill reveal"><div class="stat-pill-value">2–8</div><div class="stat-pill-label">KH (dKH)</div></div>' +
      '<div class="stat-pill reveal"><div class="stat-pill-value">150–250</div><div class="stat-pill-label">TDS (ppm)</div></div>' +
      '<div class="stat-pill reveal"><div class="stat-pill-value">65–78°F</div><div class="stat-pill-label">Temperature</div></div>' +
      '<div class="stat-pill reveal"><div class="stat-pill-value">0 / 0</div><div class="stat-pill-label">Ammonia / Nitrite</div></div>' +
    '</div>' +
    '<div class="highlight-box blue reveal"><strong>The golden rule:</strong> stability beats perfection. A tank that holds steady at pH 7.4 is far safer than one that swings between 7.0 and 7.8. Test your parameters weekly until you know your tank is stable, then monthly.</div>' +

    '<h2 class="section-heading reveal">Ghost Shrimp</h2>' +
    '<p class="prose reveal"><em>Palaemonetes paludosus</em> - often sold in bulk as feeder shrimp, but kept in their own tank they are fascinating, active, and genuinely beautiful in a subtle way. Their completely transparent bodies let you watch organs, food traveling through the gut, and eggs developing in berried females.</p>' +
    '<table class="data-table reveal"><thead><tr><th>Parameter</th><th>Ghost Shrimp</th><th>Notes</th></tr></thead><tbody>' +
      '<tr><td>pH</td><td>6.5–8.0</td><td>Tolerant of a wide range</td></tr>' +
      '<tr><td>Temperature</td><td>65–80°F</td><td>Hardy across a wide band</td></tr>' +
      '<tr><td>GH</td><td>3–15</td><td>Not highly sensitive</td></tr>' +
      '<tr><td>Tank size</td><td>10 gal min</td><td>More active and territorial than Neocaridina</td></tr>' +
      '<tr><td>Max size</td><td>1.5 in</td><td>Larger than Neocaridina; predatory toward very small tank mates</td></tr>' +
    '</tbody></table>' +
    '<div class="info-card reveal"><div class="info-card-title">Ghost Shrimp &amp; breeding</div><div class="info-card-body">Ghost Shrimp will breed in freshwater but larvae require brackish water to survive - making colony expansion in a standard freshwater tank nearly impossible. This is actually useful if you want a display tank without population explosions. Females carry eggs for 3–4 weeks; larvae typically die within days in pure freshwater.</div></div>' +

    '<h2 class="section-heading reveal">Bamboo / Vampire Shrimp</h2>' +
    '<p class="prose reveal"><em>Atyopsis moluccensis</em> (Bamboo) and <em>Atya gabonensis</em> (Vampire/African) are fan-feeders - they extend feathery fans into the current to catch suspended particles. This feeding behavior makes them unique and captivating to watch, but also means they have very specific care requirements compared to grazing shrimp.</p>' +
    '<div class="highlight-box gold reveal"><strong>Not a beginner species.</strong> Bamboo and Vampire Shrimp need a mature, well-established tank with consistent moderate flow, fine suspended particulate in the water column (from feeding or natural decomposition), and very stable parameters. They will slowly starve in a low-flow or brand-new tank even if other shrimp thrive.</div>' +
    '<table class="data-table reveal"><thead><tr><th>Parameter</th><th>Bamboo/Vampire</th><th>Notes</th></tr></thead><tbody>' +
      '<tr><td>pH</td><td>6.5–7.5</td><td>Softer water preferred</td></tr>' +
      '<tr><td>Temperature</td><td>75–82°F</td><td>Warmer than Neocaridina</td></tr>' +
      '<tr><td>Tank size</td><td>20 gal min</td><td>Needs room and established flow</td></tr>' +
      '<tr><td>Max size</td><td>3–5 in</td><td>Largest of the three groups; fully peaceful</td></tr>' +
      '<tr><td>Feeding</td><td>Fan-feeder</td><td>Powdered foods or strong current; does not graze substrate</td></tr>' +
    '</tbody></table>' +
    '<div class="info-card reveal"><div class="info-card-title">Powdered food tip</div><div class="info-card-body">Broadcast a small pinch of powdered spirulina, crushed flake, or commercial shrimp powder near your Bamboo Shrimp and watch the fans go to work. They will reposition themselves to face the current and spend hours feeding. No direct target-feeding needed - just ensure particulate reaches them.</div></div>' +

  '</div>';
}

// ── PLANTS & DÉCOR ────────────────────────────────────
function renderPlants() {
  return '<div class="page-body">' +

    '<p class="prose reveal">Plants are not optional in a shrimp tank - they are infrastructure. They stabilize parameters, generate the biofilm shrimp graze on constantly, provide cover during vulnerable molts, and create the complex microhabitat that keeps shrimp active and visible rather than hiding in corners.</p>' +

    '<h2 class="section-heading reveal">Mosses</h2>' +
    '<p class="prose reveal">Moss is the single most shrimp-friendly plant category. Its fine structure creates enormous surface area for biofilm, gives shrimplets refuge from larger tank mates, and looks natural in almost any aquascape. All mosses below thrive in low to medium light with no CO2.</p>' +
    '<table class="data-table reveal"><thead><tr><th>Moss</th><th>Growth</th><th>Best use</th><th>Notes</th></tr></thead><tbody>' +
      '<tr><td><strong>Java Moss</strong></td><td>Fast</td><td>Mesh walls, driftwood, substrate mats</td><td>The classic. Tolerates almost any conditions; never fails.</td></tr>' +
      '<tr><td><strong>Christmas Moss</strong></td><td>Medium</td><td>Attached to wood or rock</td><td>Fern-like fronds; tidier appearance than Java.</td></tr>' +
      '<tr><td><strong>Flame Moss</strong></td><td>Slow</td><td>Foreground accent, stones</td><td>Upright spiralling growth; striking and unusual.</td></tr>' +
      '<tr><td><strong>Taiwan Moss</strong></td><td>Medium</td><td>Carpets, walls</td><td>Dense and fine-textured; excellent shrimplet refuge.</td></tr>' +
      '<tr><td><strong>Subwassertang</strong></td><td>Medium</td><td>Free-floating or attached</td><td>Not true moss - a liverwort. Lobed, bright green fronds that shrimp love to pick through.</td></tr>' +
    '</tbody></table>' +

    '<h2 class="section-heading reveal">Stem &amp; Rosette Plants</h2>' +
    '<p class="prose reveal">Fast-growing stem plants are your best ally against algae and ammonia spikes. They outcompete algae for nutrients and provide large leaf surfaces for biofilm development. Choose species rated for your light level - no CO2 injection is needed for any plant on this list.</p>' +
    '<table class="data-table reveal"><thead><tr><th>Plant</th><th>Light</th><th>Growth rate</th><th>Shrimp value</th></tr></thead><tbody>' +
      '<tr><td><strong>Hornwort</strong></td><td>Low–Med</td><td>Very fast</td><td>Excellent biofilm; can be free-floating or planted</td></tr>' +
      '<tr><td><strong>Guppy Grass</strong> (Najas)</td><td>Low–Med</td><td>Very fast</td><td>Shrimplets love hiding in the dense tangle</td></tr>' +
      '<tr><td><strong>Rotala rotundifolia</strong></td><td>Medium</td><td>Fast</td><td>Good biofilm surface; trims easily to control</td></tr>' +
      '<tr><td><strong>Anubias</strong> (all sp.)</td><td>Low</td><td>Very slow</td><td>Shrimp graze on leaves constantly; nearly indestructible</td></tr>' +
      '<tr><td><strong>Java Fern</strong></td><td>Low</td><td>Slow</td><td>Attach to wood or rock - roots rot if buried</td></tr>' +
      '<tr><td><strong>Amazon Sword</strong></td><td>Medium</td><td>Medium</td><td>Large leaves create shade and grazing surface</td></tr>' +
      '<tr><td><strong>Water Sprite</strong></td><td>Low–Med</td><td>Fast</td><td>Floating or planted; fine leaves = excellent biofilm</td></tr>' +
    '</tbody></table>' +

    '<h2 class="section-heading reveal">Floating Plants</h2>' +
    '<p class="prose reveal">Floaters are often overlooked but are among the most useful plants in a shrimp tank. They soften harsh surface light, provide dangling roots for grazing and refuge, and absorb nutrients directly from the water column - helping keep nitrates low between water changes.</p>' +
    '<div class="species-grid">' +
      '<div class="species-card reveal"><span class="species-emoji">🌱</span><div class="species-name">Frogbit</div><div class="species-latin">Limnobium laevigatum</div><p class="info-card-body" style="margin-top:0.5rem;font-size:0.8rem;">Large round leaves, long dangling roots. One of the best shrimp floaters - roots become a biofilm-covered playground.</p></div>' +
      '<div class="species-card reveal"><span class="species-emoji">🌿</span><div class="species-name">Salvinia</div><div class="species-latin">Salvinia natans / minima</div><p class="info-card-body" style="margin-top:0.5rem;font-size:0.8rem;">Velvety textured leaves that trap micro-bubbles. Fast growing - thin regularly to maintain light penetration.</p></div>' +
      '<div class="species-card reveal"><span class="species-emoji">🟢</span><div class="species-name">Duckweed</div><div class="species-latin">Lemna minor</div><p class="info-card-body" style="margin-top:0.5rem;font-size:0.8rem;">The most nutrient-hungry floater - great for high-bioload tanks. Can become invasive; introduce intentionally.</p></div>' +
    '</div>' +

    '<h2 class="section-heading reveal">Botanicals</h2>' +
    '<p class="prose reveal">Botanicals are dried plant material - leaves, pods, bark - added to the tank as they are. They release tannins that soften water, lower pH slightly, and create a natural, tea-colored environment. More importantly, they decompose slowly into the most nutritious biofilm a shrimp can graze on.</p>' +
    '<table class="data-table reveal"><thead><tr><th>Botanical</th><th>Effect</th><th>Notes</th></tr></thead><tbody>' +
      '<tr><td><strong>Indian Almond Leaf</strong> (IAL / Catappa)</td><td>Tannins, mild antibacterial, biofilm</td><td>The hobby standard. Add 1 small leaf per 10 gal; replace when fully decomposed (~4 weeks).</td></tr>' +
      '<tr><td><strong>Cholla Wood</strong></td><td>Biofilm surface, hardscape</td><td>Hollow skeleton - shrimp explore the inside. Soak 24h before adding.</td></tr>' +
      '<tr><td><strong>Alder Cones</strong></td><td>Mild tannins, biofilm</td><td>Small and unobtrusive. Popular for nano tanks.</td></tr>' +
      '<tr><td><strong>Magnolia Leaves</strong></td><td>Biofilm, leaf litter look</td><td>Dry your own or buy prepared. Large surface area for grazing.</td></tr>' +
      '<tr><td><strong>Coconut Husk / Shell</strong></td><td>Hardscape, refuge, biofilm</td><td>Half-shells create caves; shrimp congregate inside during molts.</td></tr>' +
    '</tbody></table>' +
    '<div class="highlight-box moss reveal"><strong>Boil or not?</strong> Boiling softens botanicals and speeds up the initial tannin release, reducing the water-staining effect. However it also kills surface microorganisms. Many keepers skip boiling and simply rinse - the tannin color fades within a week and the biofilm establishes faster on unboiled material.</div>' +

  '</div>';
}

// ── FEEDING ───────────────────────────────────────────
function renderFeeding() {
  return '<div class="page-body">' +

    '<div class="highlight-box water reveal">Shrimp in a well-established, planted tank with good biofilm development rarely need supplemental feeding more than 2–3 times per week. Overfeeding is a far more common problem than underfeeding - uneaten food spikes ammonia and destabilizes the very parameters that keep shrimp healthy.</div>' +

    '<h2 class="section-heading reveal">Biofilm: the foundation</h2>' +
    '<p class="prose reveal">Biofilm is a thin layer of bacteria, microalgae, protozoans, and organic matter that coats every surface in an established tank. It is the natural diet of dwarf shrimp in the wild, and in a mature tank it provides more nutrition than any commercial food you can add. Shrimp graze on it constantly - watch a healthy shrimp for 30 seconds and you\'ll see it picking at almost every surface it touches.</p>' +
    '<p class="prose reveal">Biofilm is encouraged by: natural driftwood, botanicals, slow-decaying plant matter, live rock or lava rock, moss, and any surface with texture. A bare-bottom tank with plastic decor and pristine glass is biofilm-poor and will require more supplemental feeding than a planted tank with natural hardscape.</p>' +

    '<h2 class="section-heading reveal">Staple foods</h2>' +
    '<table class="data-table reveal"><thead><tr><th>Food type</th><th>Frequency</th><th>Notes</th></tr></thead><tbody>' +
      '<tr><td><strong>Shrimp-specific pellets / wafers</strong></td><td>2–3x per week</td><td>Spirulina-based or mineral-enriched formulas. Hikari Shrimp Cuisine, Glasgarten Bacter AE, and SL-Aqua products are widely used.</td></tr>' +
      '<tr><td><strong>Blanched vegetables</strong></td><td>1–2x per week</td><td>Zucchini, spinach, kale, cucumber. Blanch 1–2 min to soften; remove after 24h to prevent fouling.</td></tr>' +
      '<tr><td><strong>Snowflake food</strong></td><td>2–3x per week</td><td>Dried soybean hulls that expand in water. Shrimp graze on them for hours; slow to foul. A staple for good reason.</td></tr>' +
      '<tr><td><strong>Indian Almond Leaf</strong></td><td>Ongoing</td><td>Leave decomposing leaves in tank - shrimp graze on them continuously.</td></tr>' +
      '<tr><td><strong>Powdered foods</strong></td><td>2x per week</td><td>Especially useful for young shrimplets. Bacter AE, Shrimp King Baby, crushed spirulina tablet.</td></tr>' +
    '</tbody></table>' +

    '<h2 class="section-heading reveal">Protein sources</h2>' +
    '<p class="prose reveal">Shrimp are omnivores and benefit from occasional protein - especially important when females are berried or have recently released shrimplets. Too much protein in a warm, established tank can accelerate bacterial blooms, so keep portions small.</p>' +
    '<div class="species-grid">' +
      '<div class="species-card reveal"><span class="species-emoji">🦟</span><div class="species-name">Freeze-dried bloodworms</div><p class="info-card-body" style="margin-top:0.5rem;font-size:0.8rem;">Small portions, once a week max. Break into tiny pieces - a whole worm is too much for a small tank. Remove any uneaten after a few hours.</p></div>' +
      '<div class="species-card reveal"><span class="species-emoji">🦐</span><div class="species-name">Brine shrimp (frozen)</div><p class="info-card-body" style="margin-top:0.5rem;font-size:0.8rem;">Ironic but true - shrimp eat shrimp. A small portion of frozen brine shrimp 1x per week is an excellent protein supplement.</p></div>' +
      '<div class="species-card reveal"><span class="species-emoji">🥚</span><div class="species-name">Hard-boiled egg yolk</div><p class="info-card-body" style="margin-top:0.5rem;font-size:0.8rem;">A grain-of-rice sized portion occasionally. Rich protein source beloved by shrimp - but watch water quality closely; egg yolk clouds water fast.</p></div>' +
    '</div>' +

    '<h2 class="section-heading reveal">Feeding schedule - a simple starting point</h2>' +
    '<table class="data-table reveal"><thead><tr><th>Day</th><th>Food</th><th>Amount</th></tr></thead><tbody>' +
      '<tr><td>Monday</td><td>Shrimp pellets / wafer</td><td>1 small wafer or 3–4 pellets per 10 shrimp</td></tr>' +
      '<tr><td>Wednesday</td><td>Snowflake food</td><td>Small pinch; remove next day if uneaten</td></tr>' +
      '<tr><td>Friday</td><td>Blanched vegetable</td><td>Coin-sized slice of zucchini or cucumber</td></tr>' +
      '<tr><td>Sunday</td><td>Protein (optional)</td><td>Tiny portion frozen brine shrimp or bloodworm</td></tr>' +
      '<tr><td>Daily</td><td>Biofilm (passive)</td><td>No action needed - let the tank do the work</td></tr>' +
    '</tbody></table>' +

    '<h2 class="section-heading reveal">Overfeeding: the real risk</h2>' +
    '<div class="highlight-box gold reveal"><strong>Remove uneaten food within 24 hours.</strong> Decomposing food drives up ammonia and nitrite, feeds nuisance bacteria, and creates the kind of parameter swing that kills shrimp overnight. When in doubt, feed less. A shrimp that has access to good biofilm will never starve - but it can absolutely die from the ammonia spike caused by a forgotten zucchini slice.</div>' +
    '<p class="prose reveal">Signs you are overfeeding: food sits untouched after several hours, tank develops a smell, algae outbreaks increase, or parameters show elevated ammonia or nitrite between water changes. Cut feeding frequency and quantities in half for two weeks and test again.</p>' +

  '<div class="highlight-box teal reveal" style="cursor:pointer;margin-top:1.5rem" onclick="navigateTo(\x27naturals\x27)">' +
    '<strong>&#127810; See Naturals &amp; Botanicals</strong> - full guide to food leaves, tannin leaves, alder cones, cholla wood, lotus pods, wild harvesting preparation, and how to manage snail competition at feeding time.' +
  '</div>' +

  '</div>';
}

// ── NATURALS & BOTANICALS ──────────────────────────────────

      '<div style="display:flex;align-items:flex-start;gap:0.85rem;flex-wrap:wrap">' +

        '<div style="flex:1;min-width:200px">' +
          '<div style="font-family:\'Lora\',serif;font-size:1rem;font-weight:600;color:var(--blue-deep);margin-bottom:0.1rem">' + name + '</div>' +
          '<div style="font-size:0.73rem;color:var(--m-text);font-style:italic;margin-bottom:0.4rem">' + latin + ' - ' + role + '</div>' +
          '<div style="display:flex;flex-wrap:wrap;gap:0.3rem;margin-bottom:0.6rem">' + tagHTML + '</div>' +

        '<div style="flex:1;min-width:200px">' +

        '</div>' +
