// Your own photos win over online ones (and are the only photos the
// color-form rows use). Key = the card's link name, shown in the address
// bar when it is open, for example:
//   'blue-dream': { src: 'photos/blue-dream.jpg', credit: 'Photo: overalls1' }
var SS_PHOTO_OVERRIDES = {};

var SS_PHOTO_KEY = 'ss_cardkit_photos_v1';
var SS_PHOTO_REFRESH_MS = 30 * 864e5;
var ssPhotoCache = (function () {
  try { return JSON.parse(localStorage.getItem(SS_PHOTO_KEY) || '{}') || {}; } catch (e) { return {}; }
})();
var ssPending = {};
var ssCards = [];
var ssCardBySlug = {};
var ssSheetCard = null;
var ssLastFocus = null;
var ssOpenedByKey = false;

function ssEsc(x) {
  return String(x == null ? '' : x).replace(/&/g, '&amp;').replace(/"/g, '&quot;')
    .replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function ssPlain(html) {
  var d = document.createElement('div');
  d.innerHTML = html || '';
  return (d.textContent || '').replace(/\s+/g, ' ').trim();
}
function ssSlug(t) {
  return String(t).toLowerCase().replace(/&[a-z]+;/g, '').replace(/['\u2019]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}
function ssSaveCache() {
  try { localStorage.setItem(SS_PHOTO_KEY, JSON.stringify(ssPhotoCache)); } catch (e) { /* storage full or off */ }
}

// "Physella acuta / Physella spp." -> "Physella acuta"; "Phylum Nematoda" -> "Nematoda"
function ssTaxon(latin) {
  var t = ssPlain(latin);
  if (!t || /various|genera/i.test(t)) return null;
  t = t.replace(/^(subkingdom|kingdom|phylum|subphylum|class|subclass|superorder|order|suborder|superfamily|family|subfamily|genus)\s+/i, '');
  t = t.split(/\s+\/\s+|\s+&\s+|\s+\(|\s+\u2014\s+|\s+-\s+/)[0];
  t = t.replace(/\s+var\..*$/i, '').replace(/\s+(sp|spp)\.?$/i, '').trim();
  if (!/^[A-Z][a-z]+( [a-z\-]+)?$/.test(t)) return null;
  return t;
}
// Cards whose photo shows the species rather than this exact color form or cultivar
function ssIsForm(latin, name) {
  return /var\.|form|cultivar/i.test(latin || '') || /jewel varieties/i.test(name || '');
}

// ── Small request queue: at most three lookups at a time ──
var ssQueue = [], ssActive = 0;
function ssFetchJson(url) {
  return new Promise(function (resolve, reject) {
    ssQueue.push({ url: url, resolve: resolve, reject: reject });
    ssPump();
  });
}
function ssPump() {
  while (ssActive < 3 && ssQueue.length) {
    var job = ssQueue.shift();
    ssActive++;
    (function (j) {
      fetch(j.url).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(j.resolve, j.reject).then(function () { ssActive--; ssPump(); });
    })(job);
  }
}
function ssQs(obj) {
  return Object.keys(obj).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(obj[k]); }).join('&');
}

// ── Wikipedia: free lead photo + short summary ──
function ssFetchWiki(taxon) {
  var base = 'https://en.wikipedia.org/w/api.php?';
  var q = { action: 'query', format: 'json', formatversion: '2', origin: '*', titles: taxon, redirects: '1',
    prop: 'pageimages|extracts|info', piprop: 'thumbnail|name', pithumbsize: '900', pilicense: 'free',
    exintro: '1', explaintext: '1', exsentences: '4', inprop: 'url' };
  return ssFetchJson(base + ssQs(q)).then(function (r1) {
    var pg = r1.query && r1.query.pages && r1.query.pages[0];
    if (!pg || pg.missing) return null;
    var out = { title: pg.title, url: pg.fullurl || ('https://en.wikipedia.org/wiki/' + encodeURIComponent(pg.title.replace(/ /g, '_'))),
      extract: (pg.extract || '').slice(0, 900) };
    if (!pg.thumbnail || !pg.pageimage ||
        /\.svg$|logo|map|range|distribution|locator|icon|diagram|illustration|drawing|plate|herbarium|specimen/i.test(pg.pageimage)) {
      return out;
    }
    var q2 = { action: 'query', format: 'json', formatversion: '2', origin: '*', titles: 'File:' + pg.pageimage,
      prop: 'imageinfo', iiprop: 'extmetadata', iiextmetadatafilter: 'Artist|LicenseShortName' };
    return ssFetchJson(base + ssQs(q2)).then(function (r2) {
      var fp = r2.query && r2.query.pages && r2.query.pages[0];
      var md = (fp && fp.imageinfo && fp.imageinfo[0] && fp.imageinfo[0].extmetadata) || {};
      var lic = ssPlain(md.LicenseShortName && md.LicenseShortName.value);
      if (!lic) return out;
      var artist = ssPlain(md.Artist && md.Artist.value);
      if (artist.length > 60) artist = artist.slice(0, 57).trim() + '...';
      out.src = pg.thumbnail.source;
      out.page = 'https://commons.wikimedia.org/wiki/File:' + encodeURIComponent(pg.pageimage.replace(/ /g, '_'));
      out.credit = (artist ? artist + ', ' : '') + lic + ', via Wikimedia Commons';
      return out;
    }, function () { return out; });
  });
}

// ── iNaturalist: match the taxon exactly (or by a recognized synonym) ──
function ssFetchInat(taxon) {
  var url = 'https://api.inaturalist.org/v1/taxa?' + ssQs({ q: taxon, per_page: '10', locale: 'en' });
  return ssFetchJson(url).then(function (r) {
    var want = taxon.toLowerCase();
    var hit = null;
    (r.results || []).some(function (t) {
      if ((t.name || '').toLowerCase() === want || (t.matched_term || '').toLowerCase() === want) { hit = t; return true; }
      return false;
    });
    if (!hit) return null;
    var out = { id: hit.id, name: hit.name, common: hit.preferred_common_name || '',
      url: 'https://www.inaturalist.org/taxa/' + hit.id };
    var dp = hit.default_photo;
    if (dp && dp.license_code && dp.medium_url) {
      out.src = dp.medium_url;
      out.credit = (dp.attribution || 'iNaturalist contributor') + ', via iNaturalist';
      out.page = 'https://www.inaturalist.org/photos/' + dp.id;
    }
    return out;
  });
}
function ssFetchInatGallery(id) {
  return ssFetchJson('https://api.inaturalist.org/v1/taxa/' + id).then(function (r) {
    var t = r.results && r.results[0];
    var list = [];
    ((t && t.taxon_photos) || []).forEach(function (tp) {
      var ph = tp.photo;
      if (!ph || !ph.license_code || !ph.medium_url || list.length >= 8) return;
      list.push({ src: ph.medium_url.replace('/medium.', '/large.'),
        credit: (ph.attribution || 'iNaturalist contributor') + ', via iNaturalist',
        page: 'https://www.inaturalist.org/photos/' + ph.id });
    });
    return list;
  });
}

// Card stage: Wikipedia first, iNaturalist only if Wikipedia has no usable photo.
// A failed request (no signal, server busy) is never remembered as "no photo".
function ssEnsureBasic(taxon) {
  var c = ssPhotoCache[taxon];
  if (c && c.basic && Date.now() - (c.at || 0) < SS_PHOTO_REFRESH_MS) return Promise.resolve(c);
  if (!navigator.onLine) return Promise.resolve(c || null);
  var key = 'b:' + taxon;
  if (ssPending[key]) return ssPending[key];
  var failed = false;
  ssPending[key] = ssFetchWiki(taxon).catch(function () { failed = true; return null; }).then(function (w) {
    var rec = { at: Date.now(), basic: true, w: w, i: undefined, g: undefined };
    if (w && w.src) return rec;
    return ssFetchInat(taxon).catch(function () { failed = true; return null; }).then(function (i) { rec.i = i; return rec; });
  }).then(function (rec) {
    delete ssPending[key];
    if (failed) return (rec.w || rec.i) ? rec : (c || null);
    ssPhotoCache[taxon] = rec; ssSaveCache();
    return rec;
  }, function () { delete ssPending[key]; return c || null; });
  return ssPending[key];
}
// Sheet stage: add the iNaturalist gallery.
function ssEnsureGallery(taxon) {
  return ssEnsureBasic(taxon).then(function (rec) {
    if (!rec) return null;
    if (rec.g !== undefined) return rec;
    var key = 'g:' + taxon;
    if (ssPending[key]) return ssPending[key];
    var failed = false;
    var step = rec.i !== undefined ? Promise.resolve(rec.i) : ssFetchInat(taxon).catch(function () { failed = true; return null; });
    ssPending[key] = step.then(function (i) {
      if (!failed) rec.i = i;
      if (!i) return failed ? undefined : [];
      return ssFetchInatGallery(i.id).catch(function () { failed = true; return undefined; });
    }).then(function (g) {
      delete ssPending[key];
      if (failed || g === undefined) return rec;
      rec.g = g; ssPhotoCache[taxon] = rec; ssSaveCache();
      return rec;
    });
    return ssPending[key];
  });
}
function ssMainPhoto(card, rec) {
  var ov = SS_PHOTO_OVERRIDES[card.slug];
  if (ov && ov.src) return { src: ov.src, credit: ov.credit || '', page: ov.link || '' };
  if (!rec) return null;
  if (rec.w && rec.w.src) return { src: rec.w.src, credit: rec.w.credit, page: rec.w.page };
  if (rec.i && rec.i.src) return { src: rec.i.src, credit: rec.i.credit, page: rec.i.page };
  return null;
}

// ── Build the card list and add photo slots ──
function ssWatchCards() {
  var pending = ssCards.filter(function (c) { return c.fig; });
  if (!('IntersectionObserver' in window)) { pending.forEach(ssFillCardPhoto); return; }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (!en.isIntersecting) return;
      io.unobserve(en.target);
      var c = ssCardBySlug[en.target.getAttribute('data-ss-slug')];
      if (c) ssFillCardPhoto(c);
    });
  }, { rootMargin: '400px 0px' });
  pending.forEach(function (c) { io.observe(c.el); });
}

// ── Find the elements SS_TAXA names: table rows, cards, section headings ──
function ssKey(t) { return ssPlain(t).replace(/^[^A-Za-z0-9]+/, '').toLowerCase().replace(/\s+/g, ' ').trim(); }
function ssCollectCards() {
  var root = document.getElementById('pages-container');
  var pageIds = {};
  PAGES.forEach(function (p) { pageIds[p.id] = true; });
  function register(el, kind, label, anchor) {
    var t = SS_TAXA[ssKey(label)];
    if (!t || el.hasAttribute('data-ss-slug')) return;
    var ov = null;
    var name = t.title || ssPlain(label).replace(/^[^A-Za-z0-9]+/, '');
    var pageEl = el.closest('.page');
    var pageId = pageEl ? pageEl.id.replace(/^page-/, '') : '';
    var slug = ssSlug(name);
    if (ssCardBySlug[slug] || pageIds[slug]) slug = slug + '-' + pageId;
    var n = 2, base = slug;
    while (ssCardBySlug[slug]) { slug = base + '-' + n; n++; }
    ov = SS_PHOTO_OVERRIDES[slug];
    if (t.own && !(ov && ov.src)) return;            // color forms wait for your own photos
    var card = { el: el, kind: kind, slug: slug, name: name, latin: t.latin, taxon: ssTaxon(t.latin),
      form: !!t.form, pageId: pageId, anchor: anchor || el };
    ssCards.push(card);
    ssCardBySlug[slug] = card;
    el.setAttribute('data-ss-slug', slug);
    el.classList.add('ss-clickable');
    el.setAttribute('tabindex', '0');
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', 'Open photos and details for ' + name);
    if (!card.taxon && !(ov && ov.src)) return;
    if (kind === 'row') {
      var th = document.createElement('span');
      th.className = 'ss-thumb ss-loading';
      th.setAttribute('aria-hidden', 'true');
      // Photo and name side by side, so long names wrap beside the photo
      var cell = el.children[0];
      var pair = document.createElement('div');
      pair.className = 'ss-thumb-wrap';
      var nm = document.createElement('span');
      nm.className = 'ss-thumb-name';
      while (cell.firstChild) nm.appendChild(cell.firstChild);
      pair.appendChild(th);
      pair.appendChild(nm);
      cell.appendChild(pair);
      cell.classList.add('ss-thumb-cell');
      card.fig = th;
    } else {
      var fig = document.createElement('figure');
      fig.className = 'ss-photo ss-loading' + (kind === 'section' ? ' ss-banner' : ' ss-inset');
      fig.setAttribute('aria-hidden', 'true');
      if (kind === 'section') el.parentNode.insertBefore(fig, el.nextSibling);
      else el.insertBefore(fig, el.firstChild);
      card.fig = fig;
    }
  }
  // Section headings: the heading itself is the tap target, the banner sits below it
  Array.prototype.forEach.call(root.querySelectorAll('.page h2'), function (h) {
    register(h, 'section', h.textContent);
  });
  // Table rows, named by their first cell
  Array.prototype.forEach.call(root.querySelectorAll('table tbody tr'), function (tr) {
    if (tr.children[0]) register(tr, 'row', tr.children[0].textContent);
  });
  // Cards: info-card titles, and tool-cards whose bold first line is the name
  Array.prototype.forEach.call(root.querySelectorAll('.info-card'), function (c) {
    var t = c.querySelector('.info-card-title');
    if (t) register(c, 'card', t.textContent);
  });
  Array.prototype.forEach.call(root.querySelectorAll('.tool-card'), function (c) {
    var t = c.querySelector('div[style*="font-weight:600"]');
    if (t) register(c, 'card', t.textContent);
  });
}
function ssFillCardPhoto(card) {
  if (!card.fig) return;
  var done = function (rec) {
    var m = ssMainPhoto(card, rec);
    if (!m) { if (card.fig.parentNode) card.fig.parentNode.removeChild(card.fig); card.fig = null; return; }
    card.fig.classList.remove('ss-loading');
    if (card.kind === 'row') {
      card.fig.innerHTML = '<img src="' + ssEsc(m.src) + '" alt="" loading="lazy" decoding="async">';
    } else {
      card.fig.innerHTML = '<img src="' + ssEsc(m.src) + '" alt="Photo of ' + ssEsc(card.name) + '" loading="lazy" decoding="async">' +
        '<span class="ss-photo-more">&#128247; Photos &amp; details</span>' +
        (m.credit ? '<span class="ss-photo-credit">' + ssEsc(m.credit) + '</span>' : '');
      if (card.kind === 'section') {
        card.fig.classList.add('ss-clickable');
        card.fig.setAttribute('data-ss-open', card.slug);
      }
    }
    var img = card.fig.querySelector('img');
    img.addEventListener('error', function () {
      if (card.fig && card.fig.parentNode) card.fig.parentNode.removeChild(card.fig);
      card.fig = null;
    });
  };
  if ((SS_PHOTO_OVERRIDES[card.slug] && SS_PHOTO_OVERRIDES[card.slug].src) || !card.taxon) { done(null); return; }
  ssEnsureBasic(card.taxon).then(done, function () { done(null); });
}
// What the sheet shows under the gallery, for each kind of element
function ssSheetBody(card) {
  var box = document.createElement('div');
  if (card.kind === 'row') {
    var table = card.el.closest('table');
    var heads = table ? table.querySelectorAll('thead th') : [];
    var h = '<dl class="ss-row-detail">';
    Array.prototype.forEach.call(card.el.children, function (td, k) {
      if (k === 0) return;
      var label = heads[k] ? ssPlain(heads[k].innerHTML) : '';
      h += '<dt>' + ssEsc(label) + '</dt><dd>' + td.innerHTML + '</dd>';
    });
    h += '</dl>';
    var sec = '';
    var prev = table ? (table.closest('.mk-table-scroll') || table) : null;
    while (prev && (prev = prev.previousElementSibling)) { if (prev.tagName === 'H2') { sec = ssPlain(prev.innerHTML); break; } }
    var pt = '';
    PAGES.some(function (p) { if (p.id === card.pageId) { pt = p.title; return true; } return false; });
    h += '<p class="ss-from">From the table' + (sec ? ' \u201c' + ssEsc(sec) + '\u201d' : '') + ' on the ' + ssEsc(pt) + ' page.</p>';
    box.innerHTML = h;
    return box;
  }
  if (card.kind === 'section') {
    var n = card.el.nextElementSibling;
    while (n && n.tagName !== 'H2' && !n.classList.contains('page-nav')) {
      if (!n.classList.contains('ss-photo')) box.appendChild(n.cloneNode(true));
      n = n.nextElementSibling;
    }
  } else {
    var clone = card.el.cloneNode(true);
    Array.prototype.forEach.call(clone.querySelectorAll('.ss-photo, .info-card-title'), function (x) { x.parentNode.removeChild(x); });
    var bold = clone.querySelector('div[style*="font-weight:600"]');
    if (bold) bold.parentNode.removeChild(bold);
    clone.classList.add('ss-sheet-card');
    box.appendChild(clone);
  }
  Array.prototype.forEach.call(box.querySelectorAll('*'), function (x) {
    x.classList.remove('reveal', 'ss-clickable');
    ['data-ss-slug', 'tabindex', 'role', 'aria-label', 'id'].forEach(function (a) { x.removeAttribute(a); });
  });
  Array.prototype.forEach.call(box.querySelectorAll('.ss-thumb'), function (x) { x.parentNode.removeChild(x); });
  return box;
}
function ssRevealCard(card) {
  if (card.pageId && card.pageId !== currentPageId) navigateTo(card.pageId);
  setTimeout(function () {
    if (card.el.offsetParent !== null) card.el.scrollIntoView({ block: 'center' });
    if (typeof triggerReveal === 'function') triggerReveal();
  }, 80);
}

function ssHvRegion() {

      return;
    }
    var on = ssHvMonths(w.list);
    var cur = null;
    w.list.some(function (x) { if (ssHvInWin(today, x[0], x[1])) { cur = x; return true; } return false; });
    var next = null, gap = 999;
    if (!cur) w.list.forEach(function (x) { var g = ((x[0] - today) + 365) % 365; if (g < gap) { gap = g; next = x; } });
    if (cur) groups.now.push({ c: c, what: cur[2] });
    else if (gap <= 42) groups.soon.push({ c: c, what: next[2], weeks: Math.max(1, Math.round(gap / 7)) });
    badge.className = 'ss-season-badge' + (cur ? ' now' : '');
    badge.innerHTML = cur ? '&#127807; In season now' : '&#128197; ' + ssHvMonthText(on);
    rows += '<div class="ss-hv-row"><button type="button" class="ss-hv-name" data-ss-open="' + c.slug + '">' + ssEsc(c.name) + '</button>' +
      '<div class="ss-hv-cells">' + on.map(function (v, m) {
        return '<span class="ss-hv-cell' + (v ? ' on' : '') + (m === monthNow ? ' cur' : '') + '" title="' + SS_MONTHS[m] + (v ? ': in season' : '') + '"></span>';
      }).join('') + '</div></div>';
  });
  function chips(list, soon) {
    if (!list.length) return '<p class="ss-hv-empty">Nothing right now.</p>';
    return '<div class="ss-hv-chips">' + list.map(function (g) {
      var rec = g.c.taxon ? ssPhotoCache[g.c.taxon] : null;
      var m = ssMainPhoto(g.c, rec);
      return '<button type="button" class="ss-hv-chip" data-ss-open="' + g.c.slug + '">' +
        (m ? '<img src="' + ssEsc(m.src) + '" alt="">' : '<span class="ss-hv-dot"></span>') +
        '<span><b>' + ssEsc(g.c.name) + '</b><small>' + ssEsc(g.what) + (soon ? ' \u00b7 in ~' + g.weeks + ' wk' : '') + '</small></span></button>';
    }).join('') + '</div>';
  }
  var zoneOpts = SS_ZONES.map(function (z) {
    return '<option value="' + z[0] + '"' + (z[0] === region.zone ? ' selected' : '') + '>Zone ' + z[0] + '</option>';
  }).join('');
  box.innerHTML =
    '<div class="ss-hv-head"><div><div class="ss-hv-kicker">&#128197; In season now</div>' +
      '<div class="ss-hv-title">' + SS_MONTHS[monthNow] + ' in zone ' + region.zone + (region.south ? ' (Southern Hemisphere)' : '') + '</div>' +
      (region.chosen ? '' : '<div class="ss-hv-sub">Showing North Georgia, USA (zone 7b). Choose your zone for your own calendar.</div>') + '</div>' +
      '<div class="ss-hv-controls">' +
        '<label class="ss-hv-lbl">Your zone <select id="ssHvZone">' + zoneOpts + '</select></label>' +
        '<label class="ss-hv-lbl">Hemisphere <select id="ssHvSouth"><option value="0"' + (region.south ? '' : ' selected') + '>Northern</option><option value="1"' + (region.south ? ' selected' : '') + '>Southern</option></select></label>' +
        '<button type="button" class="ss-hv-preset" id="ssHvPreset">North Georgia (7b)</button>' +
      '</div></div>' +
    '<div class="ss-hv-groups">' +
      '<div class="ss-hv-group"><h4>Gather now <span>' + groups.now.length + '</span></h4>' + chips(groups.now) + '</div>' +
      '<div class="ss-hv-group"><h4>Coming up <span>' + groups.soon.length + '</span></h4>' + chips(groups.soon, true) + '</div>' +
      '<div class="ss-hv-group"><h4>Buy dried <span>' + groups.buy.length + '</span></h4>' + chips(groups.buy) + '</div>' +
    '</div>' +
    '<details class="ss-hv-cal"><summary>Full-year calendar</summary>' +
      '<div class="ss-hv-row ss-hv-months"><span></span><div class="ss-hv-cells">' + SS_MONTHS.map(function (mn, m) {
        return '<span class="' + (m === monthNow ? 'cur' : '') + '">' + mn.charAt(0) + '</span>';
      }).join('') + '</div></div>' + rows + '</details>' +
    '<p class="ss-hv-note">Windows are estimates from typical frost dates for your zone; a warm or cold year moves them by weeks. ' +
      'Dried leaves keep for a year, so gather a season\u2019s supply. Collect only from trees you can identify, away from roads and sprays. ' +
      '<a href="https://planthardiness.ars.usda.gov/" target="_blank" rel="noopener">Find your USDA zone &#8599;</a></p>';
  document.getElementById('ssHvZone').addEventListener('change', ssHvSave);
  document.getElementById('ssHvSouth').addEventListener('change', ssHvSave);
  document.getElementById('ssHvPreset').addEventListener('click', function () {
    document.getElementById('ssHvZone').value = '7b';
    document.getElementById('ssHvSouth').value = '0';
    ssHvSave();
  });
}
function ssHvSave() {
  var r = { zone: document.getElementById('ssHvZone').value, south: document.getElementById('ssHvSouth').value === '1' };
  try { localStorage.setItem(SS_HV_KEY, JSON.stringify(r)); } catch (e) { /* ignore */ }
  var open = document.querySelector('.ss-hv-cal') && document.querySelector('.ss-hv-cal').open;
  ssHvRender();
  if (open) document.querySelector('.ss-hv-cal').open = true;
}
function ssHvInit() {
  var page = document.getElementById('page-naturals');
  if (!page || !ssHvItems().length) return;
  var firstH2 = page.querySelector('.page-body h2');
  if (!firstH2) return;
  var box = document.createElement('section');
  box.id = 'ssHarvest';
  box.className = 'ss-harvest';
  box.setAttribute('aria-label', 'What to gather this month');
  firstH2.parentNode.insertBefore(box, firstH2);
  ssHvRender();
  // Photos for the chips are looked up only once the calendar is on screen
  var fetchPhotos = function () {
    Promise.all(ssHvItems().filter(function (c) { return c.taxon; }).map(function (c) {
      return ssEnsureBasic(c.taxon).catch(function () { return null; });
    })).then(ssHvRefreshPhotos);
  };
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (en) {
      if (en.some(function (x) { return x.isIntersecting; })) { io.disconnect(); fetchPhotos(); }
    }, { rootMargin: '200px 0px' });
    io.observe(box);
  } else { fetchPhotos(); }
}
function ssHvRefreshPhotos() {
  var open = document.querySelector('.ss-hv-cal') && document.querySelector('.ss-hv-cal').open;
  ssHvRender();
  if (open) document.querySelector('.ss-hv-cal').open = true;
}

// ═════════════════════════════════════════════════════════════════
// COMPARE TRAY (V1.5): up to four species side by side
// ─────────────────────────────────────────────────────────────────
// "+ Compare" in any species sheet adds it to a tray at the bottom of
// the screen (remembered on this device). The compare view lines up
// photos and every attribute the cards carry, and draws temperature and
// pH ranges on one scale so the overlap (or the lack of one) is plain.
// ═════════════════════════════════════════════════════════════════
var SS_CMP_KEY = 'ss_compare_v1';
var SS_CMP_MAX = 4;
var ssCmp = [];

function ssCmpLoad() {
  try { ssCmp = JSON.parse(localStorage.getItem(SS_CMP_KEY) || '[]') || []; } catch (e) { ssCmp = []; }
  ssCmp = ssCmp.filter(function (s) { return !!ssCardBySlug[s]; }).slice(0, SS_CMP_MAX);
}
function ssCmpSave() { try { localStorage.setItem(SS_CMP_KEY, JSON.stringify(ssCmp)); } catch (e) { /* ignore */ } }
function ssCmpHas(slug) { return ssCmp.indexOf(slug) !== -1; }
function ssCmpToggle(slug) {
  var i = ssCmp.indexOf(slug);
  if (i !== -1) ssCmp.splice(i, 1);
  else if (ssCmp.length >= SS_CMP_MAX) { ssCmpRenderTray('The tray holds four. Remove one first.'); return false; }
  else ssCmp.push(slug);
  ssCmpSave();
  ssCmpRenderTray();
  if (document.getElementById('ssCmpView') && document.getElementById('ssCmpView').classList.contains('open')) ssCmpRenderView();
  return true;
}
function ssCmpBtnHtml(slug) {
  return ssCmpHas(slug) ? '&#10003; In compare' : '&#65291; Compare';
}

// Read what an entry says about itself: its table columns, or a card's role and uses
function ssCmpAttrs(card) {
  var el = card.el, out = [];
  function add(label, v) { v = (v || '').replace(/\s+/g, ' ').trim(); if (label && v) out.push({ label: label, v: v }); }
  if (card.kind === 'row') {
    var table = el.closest('table');
    var heads = table ? table.querySelectorAll('thead th') : [];
    Array.prototype.forEach.call(el.children, function (td, k) {
      if (k > 0 && heads[k]) add(heads[k].textContent, td.textContent);
    });
  } else if (card.kind === 'card') {
    var line = el.querySelector('div[style*="italic"]');
    var lparts = line ? line.textContent.split(/ - |: /) : [];
    if (lparts.length > 1) add('Role', lparts.slice(1).join(' - '));
    var tags = Array.prototype.map.call(el.querySelectorAll('div[style*="flex-wrap:wrap"] > span'), function (s) { return s.textContent.trim(); })
      .filter(function (t) { return t; });
    if (tags.length) add('Uses', tags.join(', '));
    var season = el.querySelector('.ss-season-badge');
    if (season) add('Season', season.textContent.replace(/^[^A-Za-z]+/, ''));
    if (!out.length) {
      var body = el.querySelector('.info-card-body');
      if (body) add('Notes', body.textContent.split(/(?<=\.)\s/)[0]);
    }
  }
  return out;
}
function ssCmpRange(v) {
  var m = /(\d+(?:\.\d+)?)\s*[\u2013\-]\s*(\d+(?:\.\d+)?)/.exec(v || '');
  return m ? [parseFloat(m[1]), parseFloat(m[2])] : null;
}
function ssCToF(c) { return Math.round(c * 9 / 5 + 32); }

// ── Tray ──
function ssCmpRenderTray(msg) {
  var tray = document.getElementById('ssCmpTray');
  if (!tray) {
    tray = document.createElement('div');
    tray.id = 'ssCmpTray';
    tray.className = 'ss-cmp-tray';
    tray.setAttribute('role', 'region');
    tray.setAttribute('aria-label', 'Compare tray');
    document.body.appendChild(tray);
    tray.addEventListener('click', function (e) {
      var rm = e.target.closest('[data-cmp-rm]');
      if (rm) { ssCmpToggle(rm.getAttribute('data-cmp-rm')); ssCmpSyncSheetBtn(); return; }
      if (e.target.closest('#ssCmpGo')) ssCmpOpenView();
      if (e.target.closest('#ssCmpClear')) { ssCmp = []; ssCmpSave(); ssCmpRenderTray(); ssCmpSyncSheetBtn(); }
    });
  }
  document.body.classList.toggle('ss-has-tray', ssCmp.length > 0);
  if (!ssCmp.length) { tray.classList.remove('show'); tray.innerHTML = ''; return; }
  tray.innerHTML =
    '<div class="ss-cmp-chips">' + ssCmp.map(function (s) {
      var c = ssCardBySlug[s];
      return '<span class="ss-cmp-chip">' + ssEsc(c.name) + '<button type="button" data-cmp-rm="' + s + '" aria-label="Remove ' + ssEsc(c.name) + '">&#10005;</button></span>';
    }).join('') + '</div>' +
    (msg ? '<span class="ss-cmp-msg">' + ssEsc(msg) + '</span>' : '') +
    '<div class="ss-cmp-actions">' +
      '<button type="button" class="ss-cmp-clear" id="ssCmpClear">Clear</button>' +
      '<button type="button" class="ss-cmp-go" id="ssCmpGo"' + (ssCmp.length < 2 ? ' disabled' : '') + '>' +
        (ssCmp.length < 2 ? 'Add one more' : 'Compare ' + ssCmp.length) + '</button>' +
    '</div>';
  tray.classList.add('show');
}
function ssCmpSyncSheetBtn() {
  var b = document.getElementById('ssCmpBtn');
  if (b && ssSheetCard) b.innerHTML = ssCmpBtnHtml(ssSheetCard.slug);
}

// ── Compare view ──
function ssCmpOpenView() {
  if (ssCmp.length < 2) return;
  var v = document.getElementById('ssCmpView');
  if (!v) {
    v = document.createElement('div');
    v.id = 'ssCmpView';
    v.className = 'ss-cmp-view';
    v.setAttribute('role', 'dialog');
    v.setAttribute('aria-modal', 'true');
    v.setAttribute('aria-label', 'Compare species');
    document.body.appendChild(v);
    v.addEventListener('click', function (e) {
      if (e.target === v || e.target.closest('#ssCmpClose')) { ssCmpCloseView(); return; }
      var rm = e.target.closest('[data-cmp-rm]');
      if (rm) { ssCmpToggle(rm.getAttribute('data-cmp-rm')); if (ssCmp.length < 2) ssCmpCloseView(); return; }
      var op = e.target.closest('[data-cmp-open]');
      if (op) { var c = ssCardBySlug[op.getAttribute('data-cmp-open')]; ssCmpCloseView(); ssRevealCard(c); setTimeout(function () { ssOpenSheet(c); }, 160); }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && v.classList.contains('open')) ssCmpCloseView();
    });
  }
  if (ssSheetCard) ssCloseSheet();
  ssCmpRenderView();
  v.classList.add('open');
  document.body.classList.add('ss-sheet-lock');
  setTimeout(function () { var c = document.getElementById('ssCmpClose'); if (c) c.focus(); }, 30);
}
function ssCmpCloseView() {
  var v = document.getElementById('ssCmpView');
  if (!v) return;
  v.classList.remove('open');
  document.body.classList.remove('ss-sheet-lock');
}
function ssCmpRangeBlock(label, cards, ranges, unitFn) {
  var have = ranges.filter(function (r) { return r; });
  if (have.length < 2) return '';
  var lo = Math.min.apply(null, have.map(function (r) { return r[0]; }));
  var hi = Math.max.apply(null, have.map(function (r) { return r[1]; }));
  var pad = (hi - lo) * 0.06 || 1;
  lo -= pad; hi += pad;
  var oLo = Math.max.apply(null, have.map(function (r) { return r[0]; }));
  var oHi = Math.min.apply(null, have.map(function (r) { return r[1]; }));
  var pct = function (x) { return ((x - lo) / (hi - lo) * 100).toFixed(2); };
  var overlap = oLo <= oHi;
  var h = '<div class="ss-cmp-range"><h4>' + label + '</h4>';
  h += '<div class="ss-cmp-bars">';
  if (overlap) h += '<div class="ss-cmp-band" style="left:' + pct(oLo) + '%;width:' + (pct(oHi) - pct(oLo)).toFixed(2) + '%"></div>';
  cards.forEach(function (c, k) {
    var r = ranges[k];
    h += '<div class="ss-cmp-barrow"><span class="ss-cmp-barname">' + ssEsc(c.name) + '</span><div class="ss-cmp-track">' +
      (r ? '<div class="ss-cmp-bar" style="left:' + pct(r[0]) + '%;width:' + Math.max(1, pct(r[1]) - pct(r[0])).toFixed(2) + '%"><span>' + unitFn(r[0], r[1]) + '</span></div>'
         : '<span class="ss-cmp-na">not listed</span>') +
      '</div></div>';
  });
  h += '</div>';
  h += overlap
    ? '<p class="ss-cmp-verdict ok">&#10003; Shared range: <strong>' + unitFn(oLo, oHi) + '</strong>' + (have.length < cards.length ? ' (for those with a listed range)' : '') + '</p>'
    : '<p class="ss-cmp-verdict bad">&#9888; No shared range. These can\u2019t all be kept comfortably in the same water.</p>';
  return h + '</div>';
}
function ssCmpRenderView() {
  var v = document.getElementById('ssCmpView');
  var cards = ssCmp.map(function (s) { return ssCardBySlug[s]; }).filter(Boolean);
  var attrs = cards.map(ssCmpAttrs);
  var labels = [];
  attrs.forEach(function (list) { list.forEach(function (a) { if (labels.indexOf(a.label) === -1) labels.push(a.label); }); });
  var head = '<tr><th class="ss-cmp-corner" scope="col"></th>' + cards.map(function (c) {
    var rec = c.taxon ? ssPhotoCache[c.taxon] : null;
    var m = ssMainPhoto(c, rec);
    if (!m && c.taxon) ssEnsureBasic(c.taxon).then(function () { if (v.classList.contains('open')) ssCmpRenderView(); });
    return '<th scope="col"><div class="ss-cmp-head">' +
      (m ? '<img src="' + ssEsc(m.src) + '" alt="">' : '<div class="ss-cmp-noimg">&#127807;</div>') +
      '<button type="button" class="ss-cmp-name" data-cmp-open="' + c.slug + '">' + ssEsc(c.name) + '</button>' +
      '<span class="ss-cmp-latin">' + ssEsc(c.latin) + '</span>' +
      '<button type="button" class="ss-cmp-rm" data-cmp-rm="' + c.slug + '">Remove</button></div></th>';
  }).join('') + '</tr>';
  var body = labels.map(function (lbl) {
    return '<tr><th scope="row">' + ssEsc(lbl) + '</th>' + attrs.map(function (list) {
      var hit = null;
      list.some(function (a) { if (a.label === lbl) { hit = a; return true; } return false; });
      return '<td>' + (hit ? ssEsc(hit.v) : '<span class="ss-cmp-na">-</span>') + '</td>';
    }).join('') + '</tr>';
  }).join('');
  function rangesFor(lbl) {
    return attrs.map(function (list) {
      var hit = null;
      list.some(function (a) { if (a.label === lbl) { hit = a; return true; } return false; });
      return hit ? ssCmpRange(hit.v) : null;
    });
  }
  var tempUnit = function (a, b) { return a.toFixed(0) + '\u2013' + b.toFixed(0) + '\u00b0C (' + ssCToF(a) + '\u2013' + ssCToF(b) + '\u00b0F)'; };
  var phUnit = function (a, b) { return a.toFixed(1) + '\u2013' + b.toFixed(1); };
  var ranges = ssCmpRangeBlock('Temperature', cards, rangesFor('Temp'), tempUnit) + ssCmpRangeBlock('pH', cards, rangesFor('pH'), phUnit);
  v.innerHTML = '<div class="ss-cmp-panel">' +
    '<div class="ss-cmp-top"><h3>Compare ' + cards.length + ' species</h3><button type="button" class="ss-icon-btn" id="ssCmpClose" aria-label="Close">&#10005;</button></div>' +
    '<div class="ss-cmp-scroll">' +
      (ranges ? '<div class="ss-cmp-ranges">' + ranges + '</div>' : '') +
      '<div class="ss-cmp-tablewrap"><table class="ss-cmp-table"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>' +
      (labels.length ? '' : '<p class="ss-cmp-hint">These entries don\u2019t list comparable details. Open each one for its full notes.</p>') +
      '<p class="ss-cmp-hint">Tap a name to open its full card. Compatibility between animals is on the Compatibility page.</p>' +
    '</div></div>';
}
function ssCmpInit() {
  ssCmpLoad();
  ssCmpRenderTray();
}

// ═════════════════════════════════════════════════════════════════
// PHOTO QUIZ (V1.5): name the plant or animal from a real photo
// ─────────────────────────────────────────────────────────────────
// Ten questions drawn from the species cards, four choices each
// (the wrong ones come from the same group). Uses the same photos as
// the cards, so it needs a connection the first time. Best scores are
// kept on this device.
// ═════════════════════════════════════════════════════════════════
var SS_QUIZ_BEST_KEY = 'ss_quiz_best_v1';
var SS_QUIZ_LEN = 10;
var SS_QUIZ_MODES = {
  plants:  { label: 'Plants & leaves', icon: '&#127807;', test: function (c) { return c.pageId === 'plants' || c.pageId === 'naturals' || c.pageId === 'feeding'; } },
  animals: { label: 'Shrimp & tank mates', icon: '&#129424;', test: function (c) { return !(c.pageId === 'plants' || c.pageId === 'naturals' || c.pageId === 'feeding'); } },
  all:     { label: 'Everything', icon: '&#10024;', test: function () { return true; } }
};
var ssQuiz = null;

function ssQuizBest() {
  try { return JSON.parse(localStorage.getItem(SS_QUIZ_BEST_KEY) || '{}') || {}; } catch (e) { return {}; }
}
function ssShuffle(a) {
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function ssQuizPool(mode) {
  var seen = {};
  return ssCards.filter(function (c) {
    if (!c.taxon || !SS_QUIZ_MODES[mode].test(c) || seen[c.taxon]) return false;
    seen[c.taxon] = true;
    return true;
  });
}
function ssQuizShell() {
  var v = document.getElementById('ssQuiz');
  if (v) return v;
  v = document.createElement('div');
  v.id = 'ssQuiz';
  v.className = 'ss-quiz';
  v.setAttribute('role', 'dialog');
  v.setAttribute('aria-modal', 'true');
  v.setAttribute('aria-label', 'Photo quiz');
  v.innerHTML = '<div class="ss-quiz-panel"><div class="ss-quiz-top"><h3>&#127919; Photo quiz</h3>' +
    '<button type="button" class="ss-icon-btn" id="ssQuizClose" aria-label="Close quiz">&#10005;</button></div>' +
    '<div class="ss-quiz-body" id="ssQuizBody" aria-live="polite"></div></div>';
  document.body.appendChild(v);
  v.addEventListener('click', function (e) {
    if (e.target === v || e.target.closest('#ssQuizClose')) { ssQuizClose(); return; }
    var mb = e.target.closest('[data-quiz-mode]');
    if (mb) { ssQuizStart(mb.getAttribute('data-quiz-mode')); return; }
    var ob = e.target.closest('[data-quiz-opt]');
    if (ob) { ssQuizAnswer(parseInt(ob.getAttribute('data-quiz-opt'), 10)); return; }
    if (e.target.closest('#ssQuizNext')) { ssQuizNext(); return; }
    if (e.target.closest('#ssQuizMenu')) { ssQuizMenu(); return; }
    if (e.target.closest('#ssQuizAgain')) { ssQuizStart(ssQuiz.mode); return; }
    var oc = e.target.closest('[data-quiz-card]');
    if (oc) {
      var c = ssCardBySlug[oc.getAttribute('data-quiz-card')];
      ssQuizClose();
      if (c) { ssRevealCard(c); setTimeout(function () { ssOpenSheet(c); }, 160); }
    }
  });
  document.addEventListener('keydown', function (e) {
    if (!v.classList.contains('open') || !ssQuiz) return;
    if (e.key === 'Escape') { ssQuizClose(); return; }
    if (ssQuiz.state === 'ask' && /^[1-4]$/.test(e.key)) ssQuizAnswer(parseInt(e.key, 10) - 1);
    else if (ssQuiz.state === 'told' && (e.key === 'Enter' || e.key === 'ArrowRight')) { e.preventDefault(); ssQuizNext(); }
  });
  return v;
}
function ssQuizOpen() {
  var v = ssQuizShell();
  if (ssSheetCard) ssCloseSheet();
  if (typeof closeSidebar === 'function') closeSidebar();
  v.classList.add('open');
  document.body.classList.add('ss-sheet-lock');
  ssQuizMenu();
}
function ssQuizClose() {
  var v = document.getElementById('ssQuiz');
  if (!v) return;
  v.classList.remove('open');
  document.body.classList.remove('ss-sheet-lock');
  if (ssQuiz) ssQuiz.cancelled = true;
}
function ssQuizMenu() {
  var best = ssQuizBest();
  ssQuiz = { state: 'menu' };
  document.getElementById('ssQuizBody').innerHTML =
    '<p class="ss-quiz-intro">Ten real photos. Pick the right name from four. The wrong choices come from the same group, so it gets harder than it looks.</p>' +
    '<div class="ss-quiz-modes">' + Object.keys(SS_QUIZ_MODES).map(function (k) {

        '<span class="ss-quiz-mode-best">' + (best[k] != null ? 'Best: ' + best[k] + ' / ' + SS_QUIZ_LEN : ssQuizPool(k).length + ' species') + '</span></button>';

function ssQuizStart(mode) {
  var pool = ssQuizPool(mode);
  var q = ssQuiz = { mode: mode, pool: pool, items: [], i: 0, score: 0, missed: [], state: 'load', cancelled: false };
  var body = document.getElementById('ssQuizBody');
  body.innerHTML = '<div class="ss-quiz-loading"><div class="ss-quiz-spin"></div><p>Gathering photos\u2026</p></div>';
  var cands = ssShuffle(pool.slice());

    if (q.cancelled) return;

    var batch = cands.slice(idx, idx + 6);
    idx += batch.length; tried += batch.length;
    Promise.all(batch.map(function (c) {
      return ssEnsureBasic(c.taxon).then(function (rec) { return { c: c, m: ssMainPhoto(c, rec) }; }, function () { return { c: c, m: null }; });
    })).then(function (res) {
      res.forEach(function (r) { if (r.m && q.items.length < SS_QUIZ_LEN) q.items.push({ card: r.c, photo: r.m }); });
      step();
    });
  }
  function begin() {
    if (q.cancelled) return;
    if (q.items.length < 4) {
      body.innerHTML = '<p class="ss-quiz-intro">Not enough photos came through. The quiz needs a connection to load them the first time.</p>' +
        '<div class="ss-quiz-actions"><button type="button" class="ss-link-btn" id="ssQuizMenu">&#8592; Back</button></div>';
      return;
    }
    q.items.forEach(function (it) {
      var others = ssShuffle(pool.filter(function (c) { return c.name !== it.card.name; })).slice(0, 3);
      it.options = ssShuffle([it.card].concat(others));

function ssQuizAsk() {

}
function ssQuizAnswer(k) {
  var q = ssQuiz, it = q.items[q.i];
  if (q.state !== 'ask' || !it.options[k]) return;
  q.state = 'told';
  var right = it.options[k] === it.card;
  if (right) q.score++; else q.missed.push(it.card);
  Array.prototype.forEach.call(document.querySelectorAll('.ss-quiz-opt'), function (b, n) {

      '<p>' + (right ? '&#10003; Right. ' : '&#10007; Not quite. ') + 'That\u2019s <strong>' + ssEsc(it.card.name) + '</strong> <em>' + ssEsc(it.card.latin) + '</em>.</p>' +
      '<div class="ss-quiz-actions"><button type="button" class="ss-link-btn" data-quiz-card="' + it.card.slug + '">Read its card</button>' +
      '<button type="button" class="ss-quiz-next" id="ssQuizNext">' + (last ? 'See score' : 'Next &#8250;') + '</button></div>' +

  document.getElementById('ssQuizBody').innerHTML =

function mkPageTitle(id) {
  var p = null;
  PAGES.some(function (pg) { if (pg.id === id) { p = pg; return true; } return false; });
  return p ? p.title : id;
}

// ── Tables ──
function mkStackTables() {
  var root = document.getElementById(MK_CFG.container);
  if (!root) return;
  Array.prototype.forEach.call(root.querySelectorAll('table'), function (t) {
    if (t.classList.contains('matrix-table') || t.closest('.mk-table-scroll')) return;
    var wrap = document.createElement('div');
    wrap.className = 'mk-table-scroll';
    t.parentNode.insertBefore(wrap, t);
    wrap.appendChild(t);
    var heads = t.querySelectorAll('thead th');
    if (!heads.length) return;
    var labels = [];
    Array.prototype.forEach.call(heads, function (th) {
      var span = parseInt(th.getAttribute('colspan') || '1', 10) || 1;
      for (var k = 0; k < span; k++) labels.push(mkText(th));
    });
    t.classList.add('mk-stack');
    Array.prototype.forEach.call(t.querySelectorAll('tbody tr'), function (tr) {
      var col = 0;
      Array.prototype.forEach.call(tr.children, function (td) {
        td.setAttribute('data-label', labels[col] || '');
        col += parseInt(td.getAttribute('colspan') || '1', 10) || 1;
      });
    });
  });
}

// ── Search index ──
function mkBuildIndex() {
  var items = [];
  var seen = [];
  function add(el, page, kind, title, sub, body, extra) {
    if (!title || seen.indexOf(el) !== -1) return;
    seen.push(el);
    var it = { el: el, page: page, kind: kind, title: title, sub: sub || '', body: (body || '').slice(0, 1200) };
    if (extra) for (var k in extra) it[k] = extra[k];
    it.nTitle = mkNorm(title); it.nSub = mkNorm(it.sub); it.nBody = mkNorm(it.body);
    items.push(it);
  }
  PAGES.forEach(function (p) {
    var pageEl = document.getElementById('page-' + p.id);
    if (!pageEl) return;
    var pt = p.title;
    add(pageEl, p.id, 'Page', pt, '', p.subtitle || p.intro || '');
    Array.prototype.forEach.call(pageEl.querySelectorAll('[data-ss-slug]'), function (el) {
      var card = (typeof ssCardBySlug !== 'undefined') ? ssCardBySlug[el.getAttribute('data-ss-slug')] : null;
      if (!card) return;
      add(el, p.id, 'Species', card.name, card.latin, mkText(el), { slug: card.slug });
    });
    Array.prototype.forEach.call(pageEl.querySelectorAll('.faq-question'), function (el) {
      var item = el.closest('.faq-item');
      var ans = item ? item.querySelector('.faq-answer') : null;
      add(el, p.id, 'Question', mkText(el).replace(/[+\u25BE\u25BC\u203A]\s*$/, ''), pt, mkText(ans));
    });
    Array.prototype.forEach.call(pageEl.querySelectorAll('.glossary-term dt'), function (el) {
      add(el.parentNode, p.id, 'Glossary', mkText(el), pt, mkText(el.parentNode.querySelector('dd')));
    });
    Array.prototype.forEach.call(pageEl.querySelectorAll('.info-card-title'), function (el) {
      var box = el.parentNode;
      add(box, p.id, p.id === 'glossary' ? 'Glossary' : 'Note', mkText(el), pt, mkText(box.querySelector('.info-card-body')));
    });
    Array.prototype.forEach.call(pageEl.querySelectorAll('h2, h3, h4'), function (el) {
      if (el.closest('[data-ss-slug], .faq-item, .glossary-term, table')) return;
      var t = mkText(el);
      if (t.length < 3) return;
      var next = el.nextElementSibling;
      add(el, p.id, 'Section', t, pt, mkBlockText(next));
    });
    Array.prototype.forEach.call(pageEl.querySelectorAll('table tbody tr'), function (tr) {
      if (tr.closest('.matrix-table')) return;
      var first = tr.children[0];
      var t = mkText(first);
      if (!t || t.length > 80) return;
      add(tr, p.id, 'Table', t, pt, Array.prototype.slice.call(tr.children, 1).map(mkText).filter(function (x) { return x; }).join(' \u00b7 '));
    });
  });
  return items;
}

function mkSearch(q) {
  var nq = mkNorm(q).trim();
  if (!nq) return [];
  var toks = nq.split(/\s+/);
  var out = [];
  mkIndex.forEach(function (it) {
    var all = it.nTitle + ' ' + it.nSub + ' ' + it.nBody;
    for (var i = 0; i < toks.length; i++) if (all.indexOf(toks[i]) === -1) return;
    var s = 0;
    if (it.nTitle === nq) s += 200;
    else if (it.nTitle.indexOf(nq) === 0) s += 120;
    else if (it.nTitle.indexOf(nq) !== -1) s += 80;
    toks.forEach(function (tk) {
      if (it.nTitle.indexOf(tk) !== -1) s += 20;
      else if (it.nSub.indexOf(tk) !== -1) s += 12;
      else s += 2;
    });
    s += { Species: 14, Page: 12, Glossary: 10, Question: 8, Section: 6, Table: 4, Note: 3 }[it.kind] || 0;
    out.push({ it: it, s: s });
  });
  out.sort(function (a, b) { return b.s - a.s; });
  return out.slice(0, 40).map(function (o) { return o.it; });
}

function mkMark(text, q) {
  var safe = mkEsc(text);
  var toks = mkNorm(q).trim().split(/\s+/).filter(function (t) { return t.length > 1; });
  toks.forEach(function (tk) {
    var re = new RegExp('(' + tk.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    safe = safe.replace(re, '<mark>$1</mark>');
  });
  return safe;
}
function mkSnippet(it, q) {
  var toks = mkNorm(q).trim().split(/\s+/);
  var where = -1;
  toks.some(function (tk) { if (it.nTitle.indexOf(tk) === -1) { where = it.nBody.indexOf(tk); return where !== -1; } return false; });
  if (where === -1) return it.body ? it.body.slice(0, 110) + (it.body.length > 110 ? '\u2026' : '') : '';
  var a = Math.max(0, where - 45);
  return (a > 0 ? '\u2026' : '') + it.body.slice(a, a + 120) + (a + 120 < it.body.length ? '\u2026' : '');
}

// ── Search panel ──
function mkBuildSearchUi() {
  var wrap = document.createElement('div');
  wrap.className = 'mk-search';
  wrap.id = 'mkSearch';
  wrap.setAttribute('role', 'dialog');
  wrap.setAttribute('aria-modal', 'true');
  wrap.setAttribute('aria-label', 'Search ' + MK_CFG.app);
  wrap.innerHTML =
    '<div class="mk-search-panel">' +
      '<div class="mk-search-box">' +
        '<span class="mk-search-glass" aria-hidden="true">&#128269;</span>' +
        '<input id="mkSearchInput" type="search" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" ' +
          'placeholder="' + mkEsc(MK_CFG.placeholder) + '" aria-label="Search" aria-controls="mkSearchResults">' +
        '<button type="button" class="mk-search-close" id="mkSearchClose">Close</button>' +
      '</div>' +
      '<div class="mk-search-results" id="mkSearchResults" role="listbox"></div>' +
    '</div>';
  document.body.appendChild(wrap);
  var input = document.getElementById('mkSearchInput');
  input.addEventListener('input', function () { mkSel = 0; mkRenderResults(); });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); mkMove(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); mkMove(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); if (mkHits[mkSel]) mkGo(mkHits[mkSel]); }
    else if (e.key === 'Escape') { e.preventDefault(); mkCloseSearch(); }
  });
  document.getElementById('mkSearchClose').addEventListener('click', mkCloseSearch);
  wrap.addEventListener('click', function (e) {
    if (e.target === wrap) { mkCloseSearch(); return; }
    var b = e.target.closest('[data-mk-hit]');
    if (b) mkGo(mkHits[parseInt(b.getAttribute('data-mk-hit'), 10)]);
  });
}
function mkRenderResults() {
  var q = document.getElementById('mkSearchInput').value;
  var box = document.getElementById('mkSearchResults');
  if (!q.trim()) {
    mkHits = [];
    box.innerHTML = '<p class="mk-search-hint">' + mkEsc(MK_CFG.hint) + '</p>' +
      '<div class="mk-search-pages">' + PAGES.map(function (p) {
        return '<button type="button" class="mk-page-chip" data-mk-page="' + p.id + '">' + (p.icon || '') + ' ' + mkEsc(p.title) + '</button>';
      }).join('') + '</div>';
    Array.prototype.forEach.call(box.querySelectorAll('[data-mk-page]'), function (b) {
      b.addEventListener('click', function () { var id = b.getAttribute('data-mk-page'); mkCloseSearch(); if (id !== currentPageId) navigateTo(id); });
    });
    return;
  }
  mkHits = mkSearch(q);
  if (!mkHits.length) { box.innerHTML = '<p class="mk-search-hint">Nothing matches \u201c' + mkEsc(q) + '\u201d. Try a shorter word.</p>'; return; }
  box.innerHTML = '<p class="mk-search-count">' + mkHits.length + (mkHits.length === 40 ? '+' : '') + ' result' + (mkHits.length === 1 ? '' : 's') + '</p>' +
    mkHits.map(function (it, k) {
      var snip = mkSnippet(it, q);
      return '<button type="button" role="option" class="mk-hit' + (k === mkSel ? ' sel' : '') + '" data-mk-hit="' + k + '" aria-selected="' + (k === mkSel) + '">' +
        '<span class="mk-hit-top"><span class="mk-hit-title">' + mkMark(it.title, q) + '</span><span class="mk-hit-kind">' + it.kind + '</span></span>' +
        '<span class="mk-hit-where">' + mkEsc(it.kind === 'Page' ? 'Page' : mkPageTitle(it.page)) + (it.kind === 'Species' && it.sub ? ' \u00b7 <i>' + mkEsc(it.sub) + '</i>' : '') + '</span>' +
        (snip ? '<span class="mk-hit-snip">' + mkMark(snip, q) + '</span>' : '') +
      '</button>';
    }).join('');
}
function mkMove(d) {
  if (!mkHits.length) return;
  mkSel = (mkSel + d + mkHits.length) % mkHits.length;
  Array.prototype.forEach.call(document.querySelectorAll('.mk-hit'), function (b, k) {
    b.classList.toggle('sel', k === mkSel);
    b.setAttribute('aria-selected', String(k === mkSel));
    if (k === mkSel) b.scrollIntoView({ block: 'nearest' });
  });
}
function mkOpenSearch() {
  if (!mkIndex) mkIndex = mkBuildIndex();
  if (!document.getElementById('mkSearch')) mkBuildSearchUi();
  if (typeof closeSidebar === 'function') closeSidebar();
  mkLastFocus = document.activeElement;
  var w = document.getElementById('mkSearch');
  w.classList.add('open');
  document.body.classList.add('mk-lock');
  var input = document.getElementById('mkSearchInput');
  input.select();
  mkRenderResults();
  setTimeout(function () { input.focus(); }, 30);
}
function mkCloseSearch() {
  var w = document.getElementById('mkSearch');
  if (!w) return;
  w.classList.remove('open');
  document.body.classList.remove('mk-lock');
  if (mkLastFocus && mkLastFocus.focus) { try { mkLastFocus.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
}
// Open any closed tab, filter or answer that hides an element
function mkReveal(el) {
  var pageEl = el.closest('.page');
  var a = el;
  while (a && a !== pageEl) {
    if (a.id && getComputedStyle(a).display === 'none') {
      var opener = null;
      Array.prototype.some.call(pageEl.querySelectorAll('[onclick]'), function (b) {
        if (b.getAttribute('onclick').indexOf("'" + a.id + "'") !== -1) { opener = b; return true; }
        return false;
      });
      if (opener) opener.click();
    }
    a = a.parentElement;
  }
  var faq = el.closest('.faq-item');
  if (faq && !faq.classList.contains('open')) {
    var q = faq.querySelector('.faq-question');
    if (q && typeof toggleFaq === 'function') toggleFaq(q); else faq.classList.add('open');
  }
}
function mkGo(it) {
  if (!it) return;
  mkCloseSearch();
  if (it.slug && typeof ssCardBySlug !== 'undefined' && ssCardBySlug[it.slug]) {
    var card = ssCardBySlug[it.slug];
    ssRevealCard(card);
    setTimeout(function () { ssOpenSheet(card); }, 160);
    return;
  }
  if (it.page !== currentPageId) navigateTo(it.page);
  if (it.kind === 'Page') { window.scrollTo(0, 0); return; }
  setTimeout(function () {
    mkReveal(it.el);
    if (typeof triggerReveal === 'function') triggerReveal();
    setTimeout(function () {
      it.el.scrollIntoView({ block: 'center' });
      it.el.classList.remove('mk-flash');
      void it.el.offsetWidth;
      it.el.classList.add('mk-flash');
      setTimeout(function () { it.el.classList.remove('mk-flash'); }, 2200);
    }, 90);
  }, 70);
}

function mkInit() {
  mkStackTables();
  // Phone header button
  var hdr = document.querySelector(MK_CFG.header);
  if (hdr) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'mk-search-btn';
    b.setAttribute('aria-label', 'Search the guide');
    b.innerHTML = '&#128269;';
    b.addEventListener('click', mkOpenSearch);
    hdr.appendChild(b);
  }
  // Desktop sidebar search bar
  var top = document.querySelector(MK_CFG.sidebarTop);
  if (top) {
    var s = document.createElement('button');
    s.type = 'button';
    s.className = 'mk-side-search';
    s.innerHTML = '<span aria-hidden="true">&#128269;</span><span class="mk-side-label">Search the guide</span><kbd>/</kbd>';
    s.addEventListener('click', mkOpenSearch);
    top.parentNode.insertBefore(s, top.nextSibling);
  }
  document.addEventListener('keydown', function (e) {
    var typing = /input|textarea|select/i.test(e.target.tagName) || e.target.isContentEditable;
    if ((e.key === '/' && !typing) || ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K'))) {
      e.preventDefault();
      mkOpenSearch();
    }
  });
}

// ── INIT ──────────────────────────────────────────────
function init() {
  document.getElementById('pages-container').innerHTML =
    PAGES.map(function(p, i) { return renderPage(p, i); }).join('');

  buildSidebar();
  setActiveNav(currentPageId);

  // Sidebar bubbles - full height, more count
  buildBubbles('sidebarBubbles', 28);

  // First page header bubbles
  buildBubbles('hbubbles-' + currentPageId, 18);
  document.getElementById('hbubbles-' + currentPageId).dataset.built = '1';

  // Watch-first card bubbles (setup page)
  buildBubbles('wfBubbles', 12);

  // Init interactive tool logic
  initTools();

  setTimeout(triggerReveal, 80);
  var vb = document.getElementById('appVersionBadge');
  if (vb) vb.textContent = APP_VERSION;
  var tb = document.getElementById('topbarVersionBadge');
  if (tb) tb.textContent = APP_VERSION;
  if (typeof ssCardInit === 'function') ssCardInit();
  if (typeof ssHvInit === 'function') ssHvInit();
  if (typeof xlInit === 'function') xlInit();
  if (typeof ssCmpInit === 'function') ssCmpInit();
  if (typeof mkInit === 'function') mkInit();
  if (typeof ssQuizInit === 'function') ssQuizInit();
  if (typeof ssShelfInit === 'function') ssShelfInit();
  if (typeof ssTsInit === 'function') ssTsInit();
  if (typeof ssThemeInit === 'function') ssThemeInit();
}

document.addEventListener('DOMContentLoaded', init);
</script>
